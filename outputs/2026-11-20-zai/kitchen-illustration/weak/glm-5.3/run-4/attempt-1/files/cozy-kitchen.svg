    <radialGradient id="glowG" gradientUnits="userSpaceOnUse" cx="230" cy="240" r="520">
      <stop offset="0" stop-color="#ffdf9e" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/>
