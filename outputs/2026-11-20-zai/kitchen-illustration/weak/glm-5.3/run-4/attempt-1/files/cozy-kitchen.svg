    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeecb"/>
      <stop offset="0.55" stop-color="#ffd6a0"/>
      <stop offset="1" stop-color="#ffbf94"/>
