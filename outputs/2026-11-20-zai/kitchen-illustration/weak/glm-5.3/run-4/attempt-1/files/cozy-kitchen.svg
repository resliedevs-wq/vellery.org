    <linearGradient id="beamG" gradientUnits="userSpaceOnUse" x1="280" y1="96" x2="620" y2="640">
      <stop offset="0" stop-color="#fff6d0" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff6d0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="copperG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e09a5f"/>
      <stop offset="1" stop-color="#c2713a"/>
