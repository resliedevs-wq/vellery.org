  <polygon points="260,224 640,366 586,404 260,306" fill="#ffdc96" opacity="0.20"/>

  <!-- ============ table, front view ============ -->
  <ellipse cx="570" cy="552" rx="255" ry="11" fill="#b6935f" opacity="0.40"/>
  <rect x="352" y="398" width="22" height="150" rx="4" fill="#8e6a49"/>
  <rect x="766" y="398" width="22" height="150" rx="4" fill="#8e6a49"/>
  <rect x="340" y="398" width="460" height="14" rx="3" fill="#82613f"/>
  <rect x="322" y="378" width="496" height="20" rx="4" fill="#a9825f"/>
