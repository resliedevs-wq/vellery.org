  <rect x="150" y="70" width="8" height="254" fill="#f4ecdb"/>
  <rect x="62" y="190" width="184" height="8" fill="#f4ecdb"/>
  <rect x="38" y="338" width="232" height="14" rx="3" fill="#e6d5b6"/>

