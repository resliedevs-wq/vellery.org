  <ellipse cx="650" cy="334" rx="13" ry="6" fill="#aeb4b8"/>
  <circle cx="640" cy="323" r="16" fill="#a4aaae"/>
  <polygon points="628,310 632,296 640,308" fill="#9aa0a4"/>
  <polygon points="640,308 648,295 653,309" fill="#9aa0a4"/>
  <polygon points="631,307 633,300 637,306" fill="#c99d97" opacity="0.8"/>
  <polygon points="643,306 646,299 649,307" fill="#c99d97" opacity="0.8"/>
  <g fill="none" stroke="#5d6367" stroke-width="1.8" stroke-linecap="round">
    <path d="M630 321 q4 3 8 0"/>
    <path d="M643 321 q4 3 8 0"/>
