  <polygon points="638,327 644,327 641,331" fill="#b78a86"/>
  <text x="746" y="304" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#a09274" transform="rotate(8 746 304)">z</text>
  <text x="758" y="290" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#a09274" transform="rotate(14 758 290)">z</text>

  <!-- ============ soft light overlay ============ -->
  <polygon points="260,130 850,332 850,392 260,246" fill="#ffe3a1" opacity="0.10"/>
