  <ellipse cx="525" cy="379" rx="34" ry="5" fill="#86613f" opacity="0.5"/>
  <path d="M552 346 q24 0 24 12 t -24 12" fill="none" stroke="#5e829e" stroke-width="7" stroke-linecap="round"/>
  <rect x="496" y="334" width="56" height="44" rx="9" fill="#5e829e"/>
  <rect x="503" y="342" width="7" height="30" rx="3" fill="#7fa3bd" opacity="0.7"/>
