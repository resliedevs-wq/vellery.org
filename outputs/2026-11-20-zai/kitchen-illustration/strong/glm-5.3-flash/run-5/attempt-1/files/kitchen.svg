    <line x1="594" y1="370" x2="706" y2="370"/>
    <line x1="594" y1="376" x2="676" y2="376"/>
  </g>
  <rect x="716" y="362" width="56" height="16" rx="2" fill="#d9cfb4"/>
  <rect x="590" y="340" width="190" height="18" rx="3" fill="#f6efdb"/>
  <g stroke="#bfb294" stroke-width="2" stroke-linecap="round">
    <line x1="600" y1="347" x2="700" y2="347"/>
    <line x1="600" y1="353" x2="676" y2="353"/>
  </g>
  <rect x="712" y="344" width="56" height="10" rx="2" fill="#8f8672" opacity="0.7"/>

