  <!-- ============ room ============ -->
  <rect x="0" y="0" width="900" height="474" fill="#ecdcc4"/>
  <rect x="0" y="474" width="900" height="12" fill="#dfc8a4"/>
  <rect x="0" y="486" width="900" height="114" fill="#d4b489"/>
  <g stroke="#bfa077" stroke-width="2" opacity="0.5">
    <line x1="140" y1="492" x2="140" y2="596"/>
    <line x1="290" y1="492" x2="290" y2="596"/>
    <line x1="440" y1="492" x2="440" y2="596"/>
    <line x1="590" y1="492" x2="590" y2="596"/>
    <line x1="740" y1="492" x2="740" y2="596"/>
  </g>

  <!-- ============ window, left ============ -->
  <rect x="48" y="56" width="212" height="282" rx="4" fill="#f4ecdb"/>
  <rect x="62" y="70" width="184" height="254" fill="#d8e7e3"/>
  <circle cx="112" cy="124" r="34" fill="#f2cd82" opacity="0.35"/>
