  <ellipse cx="420" cy="380" rx="58" ry="6" fill="#86613f" opacity="0.45"/>
  <circle cx="390" cy="363" r="17" fill="#ad4632"/>
  <path d="M390 347 q2 -8 7 -11" fill="none" stroke="#6e5030" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="384" cy="358" rx="4" ry="6" fill="#d98a6b" opacity="0.55" transform="rotate(-20 384 358)"/>
  <circle cx="456" cy="363" r="16" fill="#a84230"/>
  <path d="M456 348 q2 -8 6 -10" fill="none" stroke="#6e5030" stroke-width="3" stroke-linecap="round"/>
