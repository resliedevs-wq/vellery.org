  <ellipse cx="686" cy="341" rx="60" ry="5" fill="#c9bc9d" opacity="0.65"/>
  <path d="M735 332 q16 6 2 12 q-36 10 -84 4" fill="none" stroke="#868d91" stroke-width="9" stroke-linecap="round"/>
  <rect x="626" y="294" width="120" height="46" rx="22" fill="#9aa0a4"/>
  <g fill="none" stroke="#7e858a" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <path d="M655 299 q5 11 1 20"/>
    <path d="M678 296 q5 11 1 21"/>
    <path d="M701 299 q5 11 1 20"/>
