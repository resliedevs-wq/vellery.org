<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <!-- Morning window sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7E3E2"/>
      <stop offset="55%" stop-color="#ECE6D5"/>
      <stop offset="100%" stop-color="#F7E4BD"/>
    </linearGradient>

    <!-- Warm morning sunlight beam gradients -->
    <linearGradient id="sunBeamGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FFF2C7" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFF0BF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFF0BF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Subtle floor sun patch gradient -->
    <linearGradient id="floorSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6C296" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D8AB7E" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Clip for window panes -->
    <clipPath id="windowClip">
      <rect x="52" y="88" width="144" height="240" rx="2"/>
    </clipPath>

    <!-- Clip for sleeping cat torso stripes -->
    <clipPath id="catBodyClip">
      <path d="M 584,376 C 584,352 612,340 648,342 C 685,344 707,360 707,379 C 707,391 694,396 672,396 L 605,396 C 591,396 584,388 584,376 Z"/>
    </clipPath>
  </defs>

  <!-- Room Background -->
  <!-- Upper Wall -->
  <rect x="0" y="0" width="1000" height="370" fill="#EFE4D2"/>
  <!-- Lower Wall / Wainscoting -->
  <rect x="0" y="370" width="1000" height="150" fill="#E3D2BB"/>
  <rect x="0" y="366" width="1000" height="8" fill="#D5C0A2"/>
  <!-- Baseboard -->
  <rect x="0" y="518" width="1000" height="18" fill="#C9B08E"/>
  <!-- Floor -->
  <rect x="0" y="536" width="1000" height="164" fill="#C69A76"/>
  <!-- Subtle floor plank lines -->
  <line x1="0" y1="568" x2="1000" y2="568" stroke="#B68965" stroke-width="2"/>
  <line x1="0" y1="608" x2="1000" y2="608" stroke="#B68965" stroke-width="2"/>
  <line x1="0" y1="654" x2="1000" y2="654" stroke="#B68965" stroke-width="2"/>

  <!-- Morning Sun Patch on Floor -->
  <polygon points="480,536 1000,536 1000,700 818,700" fill="url(#floorSunGrad)"/>

  <!-- Window on the Left -->
  <g id="kitchen-window">
    <!-- Outer recessed frame -->
    <rect x="40" y="76" width="168" height="264" rx="4" fill="#D5BE9F"/>
    <rect x="46" y="82" width="156" height="252" rx="2" fill="#F2EAD9"/>

    <!-- Window Sky and Distant Morning Horizon -->
    <g clip-path="url(#windowClip)">
      <rect x="52" y="88" width="144" height="240" fill="url(#skyGrad)"/>
      <!-- Soft morning sun glow in upper-left of window -->
      <circle cx="88" cy="134" r="34" fill="#FFF7DA" opacity="0.7"/>
      <!-- Muted distant hills/foliage -->
      <path d="M 52,294 Q 95,274 138,288 T 196,282 L 196,328 L 52,328 Z" fill="#BDC8B3"/>
      <path d="M 52,306 Q 112,292 196,304 L 196,328 L 52,328 Z" fill="#A9B79E"/>
    </g>

    <!-- Window Mullions (crossbars) -->
    <rect x="121" y="88" width="6" height="240" fill="#F2EAD9"/>
    <rect x="52" y="205" width="144" height="6" fill="#F2EAD9"/>

    <!-- Simple Muted Linen Curtain on Left Edge -->
    <path d="M 38,76 L 84,76 C 78,136 72,188 60,234 C 74,264 78,300 74,338 L 38,338 Z" fill="#DECBB2"/>
    <path d="M 38,76 L 56,76 C 54,142 52,202 48,234 C 55,270 56,305 54,338 L 38,338 Z" fill="#CEB89B"/>
    <rect x="38" y="230" width="24" height="7" rx="3" fill="#B89F80"/>

    <!-- Window Sill -->
    <rect x="30" y="338" width="188" height="15" rx="3" fill="#C9AE8B"/>
    <rect x="30" y="338" width="188" height="4" rx="2" fill="#D9C1A1"/>
  </g>

  <!-- Table Shadow on Floor (cast rightward from left morning sun) -->
  <polygon points="262,636 776,636 814,656 298,656" fill="#A67B5A" opacity="0.42"/>
  <ellipse cx="520" cy="626" rx="255" ry="20" fill="#A67B5A" opacity="0.28"/>

  <!-- Small Kitchen Table (Front View) -->
  <g id="kitchen-table">
    <!-- Back Legs (slightly inset and darker for subtle depth) -->
    <polygon points="282,428 304,428 302,608 286,608" fill="#785236"/>
    <polygon points="696,428 718,428 714,608 698,608" fill="#785236"/>

    <!-- Under-table Apron -->
    <rect x="256" y="424" width="488" height="24" fill="#8C6040"/>
    <rect x="256" y="424" width="488" height="5" fill="#734D32"/>

    <!-- Front Legs -->
    <polygon points="244,424 274,424 270,636 248,636" fill="#A4734E"/>
    <polygon points="244,424 252,424 254,636 248,636" fill="#B6855E"/>

    <polygon points="726,424 756,424 752,636 730,636" fill="#A4734E"/>
    <polygon points="726,424 734,424 735,636 730,636" fill="#B6855E"/>

    <!-- Tabletop (shallow top surface + front edge) -->
    <polygon points="244,394 756,394 784,414 216,414" fill="#C7976E"/>
    <!-- Subtle sunlit left bevel on tabletop -->
    <polygon points="244,394 420,394 410,414 216,414" fill="#CE9F76"/>
    <!-- Front face of tabletop -->
    <rect x="216" y="414" width="568" height="16" rx="2" fill="#A87751"/>
    <rect x="216" y="414" width="568" height="3" fill="#B98760"/>
  </g>

  <!-- Cast Shadows of Tabletop Objects (falling to the right) -->
  <g id="table-shadows" opacity="0.58">
    <ellipse cx="284" cy="401" rx="22" ry="5" fill="#A67650"/>
    <ellipse cx="334" cy="407" rx="23" ry="5.5" fill="#A67650"/>
    <ellipse cx="383" cy="400" rx="22" ry="5" fill="#A67650"/>
    <ellipse cx="472" cy="407" rx="34" ry="6.5" fill="#A67650"/>
    <polygon points="544,407 754,407 762,412 544,412" fill="#A67650"/>
  </g>

  <!-- Object 1: Three Red Apples (Left side of tabletop) -->
  <g id="three-apples">
    <!-- Apple 1 (back-left) -->
    <g transform="translate(274, 381) rotate(-3) scale(0.94)">
      <path d="M 0,-13 C -7,-18 -20,-16 -21,-2 C -22,12 -12,21 -4,20 C -1,20 0,19 0,19 C 0,19 1,20 4,20 C 12,21 22,12 21,-2 C 20,-16 7,-18 0,-13 Z" fill="#BC483D"/>
      <path d="M -10,-10 C -16,-7 -17,3 -12,11 C -15,3 -14,-5 -9,-9 Z" fill="#D46659"/>
      <path d="M 11,-10 C 17,-4 17,8 9,15 C 14,7 14,-3 10,-9 Z" fill="#9E372E"/>
      <path d="M 0,-12 Q 2,-21 5,-24" stroke="#6E4B32" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 2,-17 Q 12,-25 18,-17 Q 10,-11 2,-17 Z" fill="#7D9662"/>
    </g>

    <!-- Apple 2 (front-middle) -->
    <g transform="translate(324, 386) rotate(2) scale(1.0)">
      <path d="M 0,-13 C -7,-18 -20,-16 -21,-2 C -22,12 -12,21 -4,20 C -1,20 0,19 0,19 C 0,19 1,20 4,20 C 12,21 22,12 21,-2 C 20,-16 7,-18 0,-13 Z" fill="#C24C41"/>
      <path d="M -10,-10 C -16,-7 -17,3 -12,11 C -15,3 -14,-5 -9,-9 Z" fill="#D96B5E"/>
      <path d="M 11,-10 C 17,-4 17,8 9,15 C 14,7 14,-3 10,-9 Z" fill="#A13930"/>
      <path d="M 0,-12 Q -1,-21 2,-25" stroke="#6E4B32" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 1,-18 Q -10,-25 -15,-17 Q -8,-11 1,-18 Z" fill="#7D9662"/>
    </g>

    <!-- Apple 3 (back-right) -->
    <g transform="translate(373, 380) rotate(-2) scale(0.95)">
      <path d="M 0,-13 C -7,-18 -20,-16 -21,-2 C -22,12 -12,21 -4,20 C -1,20 0,19 0,19 C 0,19 1,20 4,20 C 12,21 22,12 21,-2 C 20,-16 7,-18 0,-13 Z" fill="#B8453B"/>
      <path d="M -10,-10 C -16,-7 -17,3 -12,11 C -15,3 -14,-5 -9,-9 Z" fill="#D06256"/>
      <path d="M 11,-10 C 17,-4 17,8 9,15 C 14,7 14,-3 10,-9 Z" fill="#99342B"/>
      <path d="M 0,-12 Q 2,-21 5,-24" stroke="#6E4B32" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 2,-17 Q 12,-25 18,-17 Q 10,-11 2,-17 Z" fill="#7D9662"/>
    </g>
  </g>

  <!-- Object 2: Blue Mug with "MONDAY" printed on it -->
  <g id="monday-mug">
    <!-- Handle on the right -->
    <path d="M 489,354 C 508,354 508,392 489,392" fill="none" stroke="#42677F" stroke-width="8" stroke-linecap="round"/>
    <path d="M 490,355 C 506,355 506,390 490,390" fill="none" stroke="#547B94" stroke-width="3" stroke-linecap="round"/>

    <!-- Mug Body -->
    <path d="M 426,342 L 492,342 L 492,400 C 492,405 486,408 459,408 C 432,408 426,405 426,400 Z" fill="#4E758E"/>
    <!-- Subtle sunlit left side highlight -->
    <path d="M 426,342 L 442,342 L 442,407 C 431,406 426,403 426,400 Z" fill="#6089A3"/>
    <!-- Subtle right shade -->
    <path d="M 480,342 L 492,342 L 492,400 C 492,403 487,406 480,407 Z" fill="#42657D"/>

    <!-- Mug Top Rim & Inside -->
    <ellipse cx="459" cy="342" rx="33" ry="6.5" fill="#6A93AD"/>
    <ellipse cx="459" cy="342.5" rx="28" ry="4.5" fill="#355165"/>
    <!-- Coffee/Tea surface inside -->
    <ellipse cx="459" cy="344" rx="23" ry="2.5" fill="#5D402C"/>

    <!-- "MONDAY" Printed on the Mug -->
    <text x="459" y="380" text-anchor="middle" font-family="Trebuchet MS, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#F5EFE0">MONDAY</text>

    <!-- Gentle Morning Steam -->
    <path d="M 449,330 Q 444,318 451,308 Q 456,299 451,290" fill="none" stroke="#F8EFE0" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 467,328 Q 472,316 465,305 Q 460,295 466,287" fill="none" stroke="#F8EFE0" stroke-width="2.2" stroke-linecap="round" opacity="0.42"/>
  </g>

  <!-- Object 3: Folded Newspaper with Gray Cat Asleep on Top -->
  <g id="newspaper-and-cat">
    <!-- Folded Newspaper -->
    <g id="folded-newspaper">
      <!-- Bottom stacked edge / thickness -->
      <polygon points="532,402 748,402 748,409 532,409" fill="#C7BDA7"/>
      <line x1="534" y1="405.5" x2="746" y2="405.5" stroke="#B0A48C" stroke-width="1.2"/>

      <!-- Main folded newsprint surface -->
      <polygon points="544,382 736,382 748,402 532,402" fill="#EAE2D0"/>
      <!-- Upper fold layer -->
      <polygon points="548,382 732,382 740,397 539,397" fill="#F1EAD9"/>
      <line x1="539" y1="397" x2="740" y2="397" stroke="#D3C9B4" stroke-width="1.5"/>

      <!-- Printed Newspaper Details (visible on left and right of the cat) -->
      <!-- Left column masthead and lines -->
      <rect x="548" y="385" width="28" height="3" rx="0.5" fill="#9A9282"/>
      <line x1="546" y1="391" x2="574" y2="391" stroke="#B5AD9D" stroke-width="1.5"/>
      <line x1="544" y1="394" x2="572" y2="394" stroke="#B5AD9D" stroke-width="1.5"/>
      <line x1="541" y1="399.5" x2="576" y2="399.5" stroke="#B5AD9D" stroke-width="1.2"/>

      <!-- Right column box and lines -->
      <rect x="706" y="385" width="20" height="6" rx="0.5" fill="#B8B0A0"/>
      <line x1="704" y1="394" x2="732" y2="394" stroke="#ACA494" stroke-width="1.5"/>
      <line x1="708" y1="399.5" x2="739" y2="399.5" stroke="#ACA494" stroke-width="1.2"/>
    </g>

    <!-- Gray Cat Asleep on Top of the Newspaper -->
    <g id="sleeping-cat">
      <!-- Subtle shadow directly under cat on newspaper -->
      <ellipse cx="644" cy="395" rx="64" ry="5.5" fill="#CCC2AD"/>

      <!-- Curled Cat Torso -->
      <path d="M 584,376 C 584,352 612,340 648,342 C 685,344 707,360 707,379 C 707,391 694,396 672,396 L 605,396 C 591,396 584,388 584,376 Z" fill="#8A8D91"/>

      <!-- Soft morning highlight along upper back -->
      <path d="M 596,356 C 614,344 646,341 678,348 C 660,348 632,350 608,360 Z" fill="#9FA2A6"/>

      <!-- Muted Tabby Stripes on Back -->
      <g clip-path="url(#catBodyClip)" fill="none" stroke="#6E7176" stroke-width="5" stroke-linecap="round">
        <path d="M 636,340 Q 642,354 638,366"/>
        <path d="M 654,340 Q 661,355 656,368"/>
        <path d="M 672,343 Q 678,358 672,371"/>
      </g>

      <!-- Curled Tail wrapping around front right -->
      <path d="M 702,380 C 712,388 696,396 668,395 C 650,395 640,394 632,392" fill="none" stroke="#7A7D82" stroke-width="10" stroke-linecap="round"/>
      <path d="M 652,394.5 C 642,394 636,393 632,392" fill="none" stroke="#64676B" stroke-width="10" stroke-linecap="round"/>

      <!-- Tucked Front Paws -->
      <ellipse cx="595" cy="390" rx="10" ry="5.5" fill="#A0A3A7"/>
      <ellipse cx="615" cy="391" rx="10" ry="5.5" fill="#979A9E"/>

      <!-- Sleeping Cat Head -->
      <g id="cat-head">
        <!-- Ears -->
        <path d="M 583,358 L 580,336 L 598,348 Z" fill="#8A8D91"/>
        <path d="M 585,355 L 583,341 L 594,349 Z" fill="#C49B97"/>
        <path d="M 606,348 L 619,334 L 622,354 Z" fill="#7D8085"/>
        <path d="M 609,348 L 617,339 L 619,352 Z" fill="#B58E8B"/>

        <!-- Head Shape -->
        <ellipse cx="603" cy="367" rx="22" ry="19" fill="#8E9195"/>
        <!-- Subtle sunlit cheek/forehead -->
        <ellipse cx="596" cy="364" rx="14" ry="12" fill="#9A9DA1" opacity="0.65"/>

        <!-- Muzzle Patch -->
        <ellipse cx="602" cy="376" rx="9" ry="5.5" fill="#A7AAAE"/>

        <!-- Closed Sleeping Eyes -->
        <path d="M 590,367 Q 594,371 598,367" fill="none" stroke="#484B50" stroke-width="2" stroke-linecap="round"/>
        <path d="M 607,367 Q 611,371 615,367" fill="none" stroke="#484B50" stroke-width="2" stroke-linecap="round"/>

        <!-- Tiny Nose -->
        <polygon points="600,373 605,373 602.5,376" fill="#6C6062"/>

        <!-- Delicate Whiskers -->
        <line x1="586" y1="374" x2="574" y2="372" stroke="#62656A" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="586" y1="377" x2="574" y2="379" stroke="#62656A" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="618" y1="374" x2="630" y2="372" stroke="#62656A" stroke-width="1.2" stroke-linecap="round"/>
        <line x1="618" y1="377" x2="630" y2="379" stroke="#62656A" stroke-width="1.2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- Soft Morning Sunlight Beams from the Left Window -->
  <g id="morning-sunbeams" pointer-events="none">
    <!-- Upper pane sunbeam -->
    <polygon points="196,88 1000,474 1000,591 52,205" fill="url(#sunBeamGrad)"/>
    <!-- Lower pane sunbeam -->
    <polygon points="196,211 1000,597 818,700 52,328" fill="url(#sunBeamGrad)"/>
  </g>
</svg>
