<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Morning Kitchen Table</title>
  <desc>Flat vector illustration of a small kitchen table seen from the front, illuminated by morning sunlight from a window on the left. On the table are three red apples, a blue mug printed with MONDAY, and a folded newspaper with a gray cat asleep on top.</desc>

  <defs>
    <!-- Soft morning sunbeam gradient -->
    <linearGradient id="sunbeamGrad" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFF5D6" stop-opacity="0.48"/>
      <stop offset="55%" stop-color="#FCE9B8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#F7DC9C" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft warm window sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6DFB2"/>
      <stop offset="100%" stop-color="#FCECC9"/>
    </linearGradient>

    <!-- Subtle clip for window panes -->
    <clipPath id="windowClip">
      <rect x="64" y="94" width="182" height="312" rx="2"/>
    </clipPath>

    <!-- Clip for newspaper surface details -->
    <clipPath id="paperTopClip">
      <polygon points="712,418 938,418 954,433 696,433"/>
    </clipPath>
  </defs>

  <!-- ================= ROOM BACKGROUND ================= -->
  <!-- Warm muted cream wall -->
  <rect x="0" y="0" width="1200" height="635" fill="#EDE1CE"/>

  <!-- Subtle wainscoting / lower wall panel -->
  <rect x="0" y="485" width="1200" height="150" fill="#E3D4BE"/>
  <rect x="0" y="480" width="1200" height="10" fill="#D4C2A8"/>
  <rect x="0" y="625" width="1200" height="12" fill="#CEB99D"/>

  <!-- Warm muted wood floor -->
  <rect x="0" y="635" width="1200" height="165" fill="#C7A682"/>
  <!-- Subtle flat plank lines -->
  <line x1="0" y1="675" x2="1200" y2="675" stroke="#B6946F" stroke-width="2"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#B6946F" stroke-width="2"/>
  <line x1="0" y1="768" x2="1200" y2="768" stroke="#B6946F" stroke-width="2"/>
  <line x1="210" y1="635" x2="170" y2="675" stroke="#B6946F" stroke-width="2"/>
  <line x1="680" y1="635" x2="660" y2="675" stroke="#B6946F" stroke-width="2"/>
  <line x1="420" y1="675" x2="395" y2="720" stroke="#B6946F" stroke-width="2"/>
  <line x1="940" y1="675" x2="960" y2="720" stroke="#B6946F" stroke-width="2"/>
  <line x1="260" y1="720" x2="230" y2="768" stroke="#B6946F" stroke-width="2"/>
  <line x1="780" y1="720" x2="800" y2="768" stroke="#B6946F" stroke-width="2"/>

  <!-- ================= WINDOW ON THE LEFT ================= -->
  <g id="left-window">
    <!-- Outer recessed frame shadow -->
    <rect x="46" y="76" width="218" height="350" rx="4" fill="#D5C4AC"/>
    <!-- Window wooden frame -->
    <rect x="52" y="82" width="206" height="338" rx="3" fill="#F5ECE0"/>

    <!-- Sky & distant morning hills through window -->
    <g clip-path="url(#windowClip)">
      <rect x="64" y="94" width="182" height="312" fill="url(#skyGrad)"/>
      <!-- Soft morning sun glow in upper sky -->
      <circle cx="105" cy="145" r="42" fill="#FFF7DE" opacity="0.75"/>
      <!-- Distant muted hills / foliage -->
      <path d="M 64,340 Q 115,310 165,332 T 246,325 L 246,406 L 64,406 Z" fill="#D9C69C"/>
      <path d="M 64,368 Q 130,348 188,365 T 246,356 L 246,406 L 64,406 Z" fill="#C4B68C"/>
    </g>

    <!-- Window muntins (crossbars) -->
    <rect x="150" y="94" width="10" height="312" fill="#F5ECE0"/>
    <rect x="64" y="218" width="182" height="10" fill="#F5ECE0"/>
    <rect x="64" y="316" width="182" height="8" fill="#EFE4D4"/>

    <!-- Window sill -->
    <rect x="40" y="416" width="230" height="16" rx="3" fill="#EFE4D4"/>
    <rect x="40" y="430" width="230" height="6" rx="2" fill="#CFC0AA"/>
  </g>

  <!-- ================= MORNING SUNLIGHT (WALL LAYER) ================= -->
  <!-- Angled beams from the left window onto wall & floor -->
  <polygon points="64,94 246,94 1140,635 410,635" fill="url(#sunbeamGrad)"/>
  <polygon points="64,228 246,228 1180,750 480,750" fill="url(#sunbeamGrad)" opacity="0.65"/>

  <!-- ================= KITCHEN TABLE (FRONT VIEW) ================= -->
  <g id="kitchen-table">
    <!-- Floor shadow beneath table, angled slightly right from morning sun -->
    <ellipse cx="675" cy="726" rx="345" ry="22" fill="#9E7E5D" opacity="0.34"/>

    <!-- Back legs (slightly recessed & darker for front-view depth) -->
    <rect x="415" y="505" width="22" height="205" rx="2" fill="#7D5438"/>
    <rect x="883" y="505" width="22" height="205" rx="2" fill="#7D5438"/>

    <!-- Table apron (underside frame) -->
    <rect x="358" y="473" width="604" height="36" fill="#946544"/>
    <!-- Subtle shadow under tabletop lip -->
    <rect x="358" y="473" width="604" height="7" fill="#7D5438"/>

    <!-- Front legs -->
    <!-- Front left leg -->
    <rect x="364" y="505" width="28" height="222" rx="2" fill="#A6754F"/>
    <rect x="364" y="505" width="7" height="222" fill="#BA8962"/>
    <!-- Front right leg -->
    <rect x="928" y="505" width="28" height="222" rx="2" fill="#A6754F"/>
    <rect x="928" y="505" width="7" height="222" fill="#B6845E"/>

    <!-- Tabletop (front edge + slight top bevel) -->
    <rect x="322" y="440" width="676" height="33" rx="5" fill="#B8845B"/>
    <!-- Warm morning-lit top surface strip -->
    <rect x="322" y="440" width="676" height="10" rx="4" fill="#CC9A70"/>
    <!-- Subtle left-side sun highlight on tabletop -->
    <rect x="322" y="440" width="220" height="8" rx="4" fill="#D9AA80" opacity="0.8"/>
  </g>

  <!-- ================= OBJECTS ON THE TABLE ================= -->

  <!-- 1. EXACTLY THREE RED APPLES (Left side of tabletop) -->
  <g id="three-red-apples">
    <!-- Cast shadows to the right on tabletop -->
    <ellipse cx="404" cy="443" rx="24" ry="5" fill="#8A5C3C" opacity="0.45"/>
    <ellipse cx="462" cy="444" rx="25" ry="5" fill="#8A5C3C" opacity="0.45"/>
    <ellipse cx="516" cy="443" rx="23" ry="5" fill="#8A5C3C" opacity="0.45"/>

    <!-- Apple 1 (leftmost) -->
    <g id="apple-1">
      <!-- Stem & leaf -->
      <path d="M 390,396 Q 388,385 393,381" fill="none" stroke="#6B4C35" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M 392,389 Q 406,381 409,391 Q 399,396 392,389 Z" fill="#7D9468"/>
      <!-- Apple body -->
      <path d="M 390,396 C 378,391 364,400 364,418 C 364,435 375,444 386,444 C 388,444 389,443 390,442 C 391,443 392,444 394,444 C 405,444 416,435 416,418 C 416,400 402,391 390,396 Z" fill="#BF4D41"/>
      <!-- Warm morning highlight on left -->
      <path d="M 374,404 C 369,410 369,421 373,428" fill="none" stroke="#D97364" stroke-width="4.5" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Apple 2 (center of trio, slightly forward) -->
    <g id="apple-2">
      <!-- Stem -->
      <path d="M 446,393 Q 449,382 444,378" fill="none" stroke="#6B4C35" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Apple body -->
      <path d="M 446,393 C 433,388 418,398 418,417 C 418,435 430,445 441,445 C 444,445 445,444 446,443 C 447,444 448,445 451,445 C 462,445 474,435 474,417 C 474,398 459,388 446,393 Z" fill="#C95547"/>
      <!-- Warm morning highlight on left -->
      <path d="M 428,402 C 423,409 423,421 427,429" fill="none" stroke="#E07D6E" stroke-width="4.5" stroke-linecap="round" opacity="0.78"/>
    </g>

    <!-- Apple 3 (rightmost of trio) -->
    <g id="apple-3">
      <!-- Stem & leaf -->
      <path d="M 502,398 Q 505,387 510,384" fill="none" stroke="#6B4C35" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M 504,391 Q 491,383 488,392 Q 497,397 504,391 Z" fill="#7D9468"/>
      <!-- Apple body -->
      <path d="M 502,397 C 490,392 477,401 477,418 C 477,434 487,444 498,444 C 500,444 501,443 502,442 C 503,443 504,444 506,444 C 517,444 527,434 527,418 C 527,401 514,392 502,397 Z" fill="#B5463B"/>
      <!-- Warm morning highlight on left -->
      <path d="M 486,405 C 482,411 482,421 485,428" fill="none" stroke="#D16C5E" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    </g>
  </g>

  <!-- 2. BLUE MUG WITH "MONDAY" PRINTED ON IT -->
  <g id="monday-mug">
    <!-- Cast shadow to the right -->
    <ellipse cx="630" cy="443" rx="52" ry="6" fill="#8A5C3C" opacity="0.42"/>

    <!-- Mug handle on the right -->
    <path d="M 648,376 L 664,376 C 677,376 680,388 680,401 C 680,414 677,426 664,426 L 648,426"
          fill="none" stroke="#4D718C" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Subtle inner highlight on top of handle -->
    <path d="M 652,374 L 664,374 C 671,374 675,379 677,386"
          fill="none" stroke="#6E94B0" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- Mug main body -->
    <path d="M 562,360 L 652,360 L 652,434 C 652,440 647,444 641,444 L 573,444 C 567,444 562,440 562,434 Z" fill="#4F7491"/>

    <!-- Left-side morning sunlight strip on mug -->
    <path d="M 565,363 L 574,363 L 574,441 L 573,441 C 569,441 565,438 565,434 Z" fill="#6D93B0" opacity="0.55"/>
    <!-- Right-side subtle shading on mug -->
    <path d="M 638,363 L 650,363 L 650,434 C 650,438 646,441 641,441 L 638,441 Z" fill="#41627B" opacity="0.65"/>

    <!-- Ceramic rim / top lip -->
    <ellipse cx="607" cy="360" rx="45" ry="6" fill="#6D93B0"/>
    <ellipse cx="607" cy="360" rx="39" ry="4" fill="#E6DDD0"/>
    <ellipse cx="607" cy="361" rx="35" ry="2.8" fill="#70533E" opacity="0.85"/>

    <!-- Printed word MONDAY -->
    <text x="607" y="407"
          font-family="Helvetica, Arial, sans-serif"
          font-size="14.5"
          font-weight="700"
          letter-spacing="1.2"
          fill="#F2E9DB"
          text-anchor="middle">MONDAY</text>
  </g>

  <!-- 3. FOLDED NEWSPAPER & SLEEPING GRAY CAT ON TOP -->
  <g id="newspaper-and-cat">
    <!-- Cast shadow under newspaper to the right -->
    <ellipse cx="838" cy="444" rx="135" ry="6" fill="#8A5C3C" opacity="0.45"/>

    <!-- FOLDED NEWSPAPER -->
    <g id="folded-newspaper">
      <!-- Bottom folded layers (front edge thickness) -->
      <rect x="698" y="432" width="256" height="12" rx="2" fill="#CBC2B4"/>
      <!-- Page edge lines -->
      <line x1="702" y1="436" x2="950" y2="436" stroke="#B0A697" stroke-width="1.5"/>
      <line x1="702" y1="440" x2="950" y2="440" stroke="#B0A697" stroke-width="1.5"/>
      <!-- Rounded folded spine on left side -->
      <path d="M 698,432 C 691,432 691,444 698,444 L 705,444 L 705,432 Z" fill="#BEB4A5"/>

      <!-- Upper folded half surface (seen slightly angled from front) -->
      <polygon points="712,418 938,418 954,433 696,433" fill="#E5DDD0"/>

      <!-- Muted printed newspaper layout bars on visible top surface -->
      <g clip-path="url(#paperTopClip)" opacity="0.6">
        <rect x="716" y="421" width="54" height="3" fill="#9E9689"/>
        <rect x="716" y="426" width="38" height="2" fill="#B2AAA0"/>
        <rect x="896" y="421" width="36" height="3" fill="#9E9689"/>
        <rect x="896" y="426" width="42" height="2" fill="#B2AAA0"/>
        <rect x="896" y="430" width="28" height="2" fill="#B2AAA0"/>
      </g>

      <!-- Middle fold crease accent -->
      <line x1="696" y1="433" x2="954" y2="433" stroke="#BEB5A7" stroke-width="1.5"/>
    </g>

    <!-- GRAY CAT ASLEEP ON TOP OF THE NEWSPAPER -->
    <g id="sleeping-gray-cat">
      <!-- Subtle shadow of cat on newspaper -->
      <ellipse cx="830" cy="424" rx="88" ry="6" fill="#BDB3A3" opacity="0.7"/>

      <!-- Curled sleeping body -->
      <path d="M 756,423
               C 752,402 762,374 794,366
               C 824,358 866,360 886,378
               C 902,392 904,412 894,423
               Z" fill="#878A8F"/>

      <!-- Warm morning light along the cat's left & upper back -->
      <path d="M 762,412
               C 761,392 775,374 802,369
               C 825,365 852,366 868,374
               C 844,371 814,374 792,386
               C 776,395 768,406 765,418 Z" fill="#9FA2A7" opacity="0.75"/>

      <!-- Subtle muted tabby stripes on back -->
      <path d="M 812,366 Q 815,378 810,388" fill="none" stroke="#6E7176" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <path d="M 830,364 Q 834,378 828,389" fill="none" stroke="#6E7176" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <path d="M 848,366 Q 852,378 846,388" fill="none" stroke="#6E7176" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

      <!-- Tail curled comfortably forward on right/front of newspaper -->
      <path d="M 888,417
               C 914,417 918,402 904,394
               C 893,388 880,395 872,405"
            fill="none" stroke="#787B80" stroke-width="14" stroke-linecap="round"/>
      <!-- Lighter tip on tail -->
      <path d="M 883,399 C 878,401 874,404 871,407"
            fill="none" stroke="#999CA1" stroke-width="9" stroke-linecap="round"/>

      <!-- Sleeping cat head resting low on front paws -->
      <g id="cat-head">
        <!-- Left ear -->
        <path d="M 753,386 L 748,360 L 772,374 Z" fill="#878A8F"/>
        <path d="M 755,382 L 752,366 L 767,375 Z" fill="#C7ABA6"/>

        <!-- Right ear -->
        <path d="M 786,372 L 802,356 L 805,381 Z" fill="#7D8085"/>
        <path d="M 790,373 L 800,363 L 801,378 Z" fill="#BE9F9A"/>

        <!-- Head shape -->
        <ellipse cx="779" cy="395" rx="31" ry="24" fill="#8F9297"/>
        <!-- Subtle lighter muzzle / cheek -->
        <ellipse cx="778" cy="404" rx="18" ry="11" fill="#A2A5AA" opacity="0.7"/>

        <!-- Closed peaceful eyes (curved downward arcs) -->
        <path d="M 759,394 Q 765,399 771,394" fill="none" stroke="#45474B" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M 784,394 Q 790,399 796,394" fill="none" stroke="#45474B" stroke-width="2.4" stroke-linecap="round"/>

        <!-- Tiny muted nose -->
        <polygon points="775,401 781,401 778,405" fill="#C49A96"/>

        <!-- Gentle sleeping mouth -->
        <path d="M 778,405 Q 775,408 772,406 M 778,405 Q 781,408 784,406"
              fill="none" stroke="#5A5C61" stroke-width="1.6" stroke-linecap="round"/>

        <!-- Whiskers -->
        <line x1="757" y1="401" x2="740" y2="399" stroke="#5E6066" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="757" y1="405" x2="741" y2="407" stroke="#5E6066" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="799" y1="401" x2="816" y2="399" stroke="#5E6066" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="799" y1="405" x2="815" y2="407" stroke="#5E6066" stroke-width="1.4" stroke-linecap="round"/>
      </g>

      <!-- Tucked front paws resting on the newspaper -->
      <ellipse cx="764" cy="420" rx="13" ry="6.5" fill="#A2A5AA"/>
      <ellipse cx="793" cy="420" rx="13" ry="6.5" fill="#9A9DA2"/>
    </g>
  </g>

  <!-- ================= FOREGROUND SUNBEAM SHEEN ================= -->
  <!-- Very subtle warm morning glaze across table & objects from the left -->
  <polygon points="64,94 246,94 980,520 300,520" fill="#FFF4D1" opacity="0.10"/>
</svg>
