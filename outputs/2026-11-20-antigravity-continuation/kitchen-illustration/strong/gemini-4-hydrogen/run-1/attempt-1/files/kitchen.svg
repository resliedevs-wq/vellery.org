<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#F6E9D7"/>
      <stop offset="55%" stop-color="#ECDCC8"/>
      <stop offset="100%" stop-color="#E1CEBA"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#F8DFB8"/>
      <stop offset="55%" stop-color="#F6CA92"/>
      <stop offset="100%" stop-color="#F3B87A"/>
    </linearGradient>
    <linearGradient id="sunBeamGrad" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#FFF7E2" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#FFF4D6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFF4D6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D6B99B"/>
      <stop offset="100%" stop-color="#BD9E80"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="64" y="88" width="212" height="332" rx="2"/>
    </clipPath>
  </defs>

  <!-- Background Wall -->
  <rect x="0" y="0" width="1200" height="650" fill="url(#wallGrad)"/>

  <!-- Lower Wainscoting & Chair Rail -->
  <rect x="0" y="510" width="1200" height="140" fill="#DFCCB7"/>
  <rect x="0" y="502" width="1200" height="12" fill="#D2BCA5"/>
  <rect x="0" y="514" width="1200" height="3" fill="#C7B098"/>
  <!-- Subtle Wainscot Panels -->
  <g fill="none" stroke="#CEB8A0" stroke-width="2">
    <rect x="60" y="532" width="170" height="95" rx="2"/>
    <rect x="260" y="532" width="170" height="95" rx="2"/>
    <rect x="460" y="532" width="170" height="95" rx="2"/>
    <rect x="660" y="532" width="170" height="95" rx="2"/>
    <rect x="860" y="532" width="170" height="95" rx="2"/>
    <rect x="1060" y="532" width="110" height="95" rx="2"/>
  </g>
  <!-- Baseboard -->
  <rect x="0" y="636" width="1200" height="16" fill="#CBB49C"/>

  <!-- Floor -->
  <rect x="0" y="652" width="1200" height="148" fill="url(#floorGrad)"/>
  <g stroke="#B39375" stroke-width="2" opacity="0.55">
    <line x1="0" y1="688" x2="1200" y2="688"/>
    <line x1="0" y1="730" x2="1200" y2="730"/>
    <line x1="0" y1="774" x2="1200" y2="774"/>
    <line x1="210" y1="652" x2="185" y2="688"/>
    <line x1="590" y1="652" x2="575" y2="688"/>
    <line x1="940" y1="652" x2="950" y2="688"/>
    <line x1="370" y1="688" x2="345" y2="730"/>
    <line x1="780" y1="688" x2="770" y2="730"/>
    <line x1="160" y1="730" x2="125" y2="774"/>
    <line x1="650" y1="730" x2="640" y2="774"/>
    <line x1="1030" y1="730" x2="1050" y2="774"/>
  </g>

  <!-- Window on the Left -->
  <g id="window">
    <!-- Window Casing Shadow -->
    <rect x="52" y="76" width="242" height="364" rx="4" fill="#D2BEAA" opacity="0.5"/>
    <!-- Window Outer Frame -->
    <rect x="48" y="72" width="244" height="362" rx="4" fill="#F5EBDC"/>
    <!-- Sky & Morning Horizon -->
    <g clip-path="url(#windowClip)">
      <rect x="64" y="88" width="212" height="332" fill="url(#skyGrad)"/>
      <!-- Morning Sun Glow -->
      <circle cx="115" cy="215" r="56" fill="#FFF3D4" opacity="0.65"/>
      <circle cx="115" cy="215" r="32" fill="#FFF9E8" opacity="0.85"/>
      <!-- Soft Distant Foliage / Rooftop Silhouette -->
      <path d="M 64 365 Q 105 335 150 355 Q 195 322 245 348 L 276 340 L 276 420 L 64 420 Z" fill="#A6B098" opacity="0.65"/>
      <path d="M 64 385 L 130 375 L 185 388 L 276 370 L 276 420 L 64 420 Z" fill="#8E9A82" opacity="0.7"/>
      <!-- Diagonal Pane Glare -->
      <polygon points="75,88 125,88 85,240 64,240 64,135" fill="#FFF9EA" opacity="0.24"/>
      <polygon points="180,250 225,250 165,420 120,420" fill="#FFF9EA" opacity="0.18"/>
    </g>
    <!-- Window Mullions -->
    <rect x="166" y="88" width="8" height="332" fill="#F5EBDC"/>
    <rect x="64" y="246" width="212" height="8" fill="#F5EBDC"/>
    <!-- Subtle Inner Frame Edge -->
    <rect x="64" y="88" width="212" height="332" fill="none" stroke="#DECBB7" stroke-width="2"/>
    <!-- Curtain Rod & Soft Muted Sage Curtain on Left Side -->
    <rect x="30" y="56" width="280" height="7" rx="3.5" fill="#9E7E63"/>
    <circle cx="30" cy="59.5" r="6" fill="#8B6C52"/>
    <circle cx="310" cy="59.5" r="6" fill="#8B6C52"/>
    <path d="M 38 63 L 96 63 C 92 155 82 225 74 285 C 68 335 76 390 84 438 L 36 438 Z" fill="#9EAB95"/>
    <path d="M 52 63 C 50 175 46 295 48 438 L 62 438 C 58 295 62 175 66 63 Z" fill="#8C9983"/>
    <path d="M 76 63 C 74 160 66 230 62 285 C 58 335 66 390 72 438 L 84 438 C 76 390 68 335 74 285 C 82 225 92 155 96 63 Z" fill="#AEB9A5"/>
    <!-- Window Sill -->
    <rect x="38" y="428" width="264" height="14" rx="3" fill="#C49A74"/>
    <rect x="44" y="442" width="252" height="7" rx="2" fill="#A9815E"/>
  </g>

  <!-- Morning Sunlight Beams Coming from the Left Window -->
  <g id="sunlight" pointer-events="none">
    <polygon points="84,88 276,88 1060,652 460,652" fill="url(#sunBeamGrad)"/>
    <polygon points="84,115 276,225 940,652 520,652" fill="#FFF7E2" opacity="0.16"/>
    <polygon points="64,254 276,254 830,652 410,652" fill="#FFF7E2" opacity="0.13"/>
  </g>

  <!-- Small Kitchen Table (Seen from the Front) -->
  <g id="kitchen-table">
    <!-- Floor Shadows Under Table -->
    <ellipse cx="695" cy="692" rx="325" ry="15" fill="#A8896C" opacity="0.48"/>
    <ellipse cx="445" cy="692" rx="45" ry="7" fill="#95765A" opacity="0.45"/>
    <ellipse cx="955" cy="692" rx="45" ry="7" fill="#95765A" opacity="0.45"/>

    <!-- Back Legs (Slightly Shorter & Darker for Depth) -->
    <polygon points="418,500 442,500 437,668 417,668" fill="#8D6849"/>
    <polygon points="908,500 932,500 933,668 913,668" fill="#8D6849"/>

    <!-- Table Apron / Under-Frame -->
    <rect x="366" y="492" width="608" height="28" fill="#9A7251"/>
    <!-- Sunlit Left Side of Apron -->
    <rect x="366" y="492" width="160" height="28" fill="#A97F5C"/>
    <!-- Subtle Shadow Right Under Tabletop Lip -->
    <rect x="366" y="492" width="608" height="6" fill="#825E41"/>

    <!-- Front Legs -->
    <polygon points="372,492 406,492 398,690 374,690" fill="#B28763"/>
    <!-- Warm Sunlit Highlight on Left Edge of Front-Left Leg -->
    <polygon points="372,492 383,492 379,690 374,690" fill="#C69C77"/>
    <polygon points="934,492 968,492 966,690 942,690" fill="#A97F5B"/>
    <polygon points="934,492 943,492 945,690 942,690" fill="#BA906B"/>

    <!-- Tabletop Top Surface (Narrow Front Perspective Strip) -->
    <polygon points="338,452 1002,452 1020,470 320,470" fill="#CCA37D"/>
    <!-- Sunlight Highlight Across Left Portion of Tabletop -->
    <polygon points="338,452 670,452 630,470 320,470" fill="#D9B38D"/>

    <!-- Tabletop Front Edge -->
    <rect x="320" y="470" width="700" height="22" rx="3" fill="#B58A65"/>
    <rect x="320" y="470" width="290" height="22" rx="3" fill="#C39872"/>
    <line x1="322" y1="471" x2="1018" y2="471" stroke="#E0BE9B" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Object Shadows on Tabletop (Casting Rightward from Left Morning Sun) -->
  <g id="tabletop-shadows" fill="#A57E5B" opacity="0.52">
    <!-- Apples Shadows -->
    <ellipse cx="430" cy="462" rx="30" ry="4.5"/>
    <ellipse cx="498" cy="462" rx="28" ry="4.5"/>
    <ellipse cx="468" cy="466" rx="32" ry="5"/>
    <!-- Mug Shadow -->
    <ellipse cx="634" cy="465" rx="46" ry="5.5"/>
    <!-- Newspaper & Cat Shadow -->
    <ellipse cx="860" cy="466" rx="132" ry="6"/>
  </g>

  <!-- THREE RED APPLES -->
  <g id="three-red-apples">
    <!-- Apple 1 (Back Left) -->
    <g id="apple-1">
      <!-- Leaf -->
      <path d="M 412 405 C 402 395 390 397 386 405 C 394 411 405 410 412 405 Z" fill="#849873"/>
      <!-- Stem -->
      <path d="M 414 412 Q 415 401 419 396" fill="none" stroke="#6E4E37" stroke-width="3" stroke-linecap="round"/>
      <!-- Body -->
      <path d="M 414 411 C 397 407 384 419 385 436 C 386 452 399 462 414 461 C 429 462 442 452 443 436 C 444 419 431 407 414 411 Z" fill="#C24E42"/>
      <!-- Shaded Right Side -->
      <path d="M 424 411 C 435 415 442 426 441 438 C 440 451 428 460 416 461 C 428 456 434 444 433 430 C 432 420 428 414 424 411 Z" fill="#A63D33"/>
      <!-- Warm Sunlight Highlight on Left -->
      <ellipse cx="399" cy="427" rx="7" ry="11" transform="rotate(-14 399 427)" fill="#DB7263" opacity="0.72"/>
      <ellipse cx="395" cy="421" rx="2.8" ry="5" transform="rotate(-14 395 421)" fill="#F3A698" opacity="0.65"/>
    </g>

    <!-- Apple 2 (Back Right) -->
    <g id="apple-2">
      <!-- Stem -->
      <path d="M 488 413 Q 490 402 494 398" fill="none" stroke="#6E4E37" stroke-width="3" stroke-linecap="round"/>
      <!-- Leaf -->
      <path d="M 491 406 C 501 397 512 399 515 406 C 507 412 497 411 491 406 Z" fill="#8E9F7D"/>
      <!-- Body -->
      <path d="M 488 412 C 472 408 460 420 461 436 C 462 452 474 462 488 461 C 502 462 515 452 516 436 C 517 420 504 408 488 412 Z" fill="#BD4A3E"/>
      <!-- Shaded Right Side -->
      <path d="M 498 412 C 509 416 515 427 514 438 C 513 451 501 460 490 461 C 501 455 507 444 506 431 C 505 421 501 415 498 412 Z" fill="#9F392F"/>
      <!-- Warm Highlight -->
      <ellipse cx="474" cy="428" rx="6.5" ry="10.5" transform="rotate(-12 474 428)" fill="#D66B5C" opacity="0.7"/>
    </g>

    <!-- Apple 3 (Front Center) -->
    <g id="apple-3">
      <!-- Stem -->
      <path d="M 451 420 Q 450 409 446 403" fill="none" stroke="#6E4E37" stroke-width="3.2" stroke-linecap="round"/>
      <!-- Leaf -->
      <path d="M 450 412 C 461 402 473 404 477 412 C 468 418 457 417 450 412 Z" fill="#7D916C"/>
      <!-- Body -->
      <path d="M 451 418 C 433 414 420 426 421 443 C 422 459 436 467 451 466 C 466 467 480 459 481 443 C 482 426 469 414 451 418 Z" fill="#C95346"/>
      <!-- Shaded Right Side -->
      <path d="M 462 418 C 474 422 480 433 479 444 C 478 457 466 465 453 466 C 465 460 471 449 470 436 C 469 426 465 421 462 418 Z" fill="#AC4035"/>
      <!-- Warm Highlight -->
      <ellipse cx="435" cy="434" rx="7.5" ry="11.5" transform="rotate(-15 435 434)" fill="#E07B6C" opacity="0.75"/>
      <ellipse cx="431" cy="427" rx="3" ry="5" transform="rotate(-15 431 427)" fill="#F5ABA0" opacity="0.65"/>
    </g>
  </g>

  <!-- BLUE MUG WITH "MONDAY" PRINTED ON IT -->
  <g id="monday-mug">
    <!-- Subtle Warm Steam -->
    <path d="M 594 368 Q 587 352 596 338 Q 604 326 597 312" fill="none" stroke="#FAF2E4" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <path d="M 618 364 Q 625 348 616 333 Q 609 320 618 306" fill="none" stroke="#FAF2E4" stroke-width="2.5" stroke-linecap="round" opacity="0.42"/>

    <!-- Mug Handle -->
    <path d="M 648 396 C 674 396 676 446 648 446" fill="none" stroke="#4D6E8B" stroke-width="10" stroke-linecap="round"/>
    <path d="M 648 396 C 670 396 672 444 648 444" fill="none" stroke="#60829F" stroke-width="4" stroke-linecap="round"/>

    <!-- Mug Body -->
    <path d="M 568 383 L 652 383 L 652 448 C 652 460 642 466 630 466 L 590 466 C 578 466 568 460 568 448 Z" fill="#557795"/>
    <!-- Left Morning Sunlight Band -->
    <path d="M 568 383 L 592 383 L 592 466 L 590 466 C 578 466 568 460 568 448 Z" fill="#6A8DAB"/>
    <!-- Right Subtle Shading -->
    <path d="M 634 383 L 652 383 L 652 448 C 652 460 642 466 630 466 L 626 466 C 632 462 634 456 634 448 Z" fill="#466580"/>

    <!-- Mug Rim & Coffee Inside -->
    <ellipse cx="610" cy="383" rx="42" ry="7.5" fill="#7FA0BD"/>
    <ellipse cx="610" cy="383.5" rx="36" ry="5" fill="#5D3E2B"/>
    <ellipse cx="603" cy="384" rx="18" ry="2.4" fill="#73503A" opacity="0.6"/>

    <!-- Word MONDAY Printed on Mug -->
    <text x="610" y="431" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="700" letter-spacing="1.1" fill="#F7EFE2">MONDAY</text>
  </g>

  <!-- FOLDED NEWSPAPER WITH A GRAY CAT ASLEEP ON TOP -->
  <g id="newspaper-and-cat">
    <!-- Folded Newspaper -->
    <g id="folded-newspaper">
      <!-- Bottom Folded Sheet -->
      <polygon points="710,456 972,456 986,466 724,466" fill="#CFC2AE"/>
      <!-- Stacked Page Edges (Front & Right) -->
      <rect x="716" y="451" width="262" height="13" rx="1" fill="#DED3C0"/>
      <line x1="720" y1="455" x2="974" y2="455" stroke="#BCAE99" stroke-width="1.3"/>
      <line x1="720" y1="459" x2="974" y2="459" stroke="#BCAE99" stroke-width="1.3"/>
      <!-- Top Folded Newspaper Plane -->
      <polygon points="724,437 962,437 978,452 716,452" fill="#EFE6D6"/>
      <!-- Folded Spine on Left -->
      <path d="M 724 437 C 712 438 710 451 716 452 L 728 452 C 722 449 723 441 728 437 Z" fill="#E1D6C3"/>
      <!-- Newspaper Headline & Column Lines Visible on Exposed Left & Right Corners -->
      <rect x="732" y="440" width="28" height="3.5" rx="0.5" fill="#7B756D"/>
      <rect x="732" y="446" width="22" height="2" rx="0.5" fill="#9D968B"/>
      <rect x="918" y="440" width="34" height="3.5" rx="0.5" fill="#7B756D"/>
      <rect x="918" y="446" width="38" height="2" rx="0.5" fill="#9D968B"/>
    </g>

    <!-- Gray Cat Asleep on Top of the Newspaper -->
    <g id="sleeping-gray-cat">
      <!-- Soft Shadow of Cat on Newspaper -->
      <ellipse cx="842" cy="444" rx="95" ry="7" fill="#C9BDAA" opacity="0.8"/>

      <!-- Curled Tail Wrapping Around Front-Right -->
      <path d="M 902 426 C 934 426 942 442 918 446 C 896 449 868 448 852 444" fill="none" stroke="#787D82" stroke-width="16" stroke-linecap="round"/>
      <path d="M 902 424 C 932 424 939 439 917 443" fill="none" stroke="#969BA0" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
      <!-- Tail Tip -->
      <circle cx="852" cy="444" r="7.5" fill="#A6AAAE"/>

      <!-- Main Sleeping Body (Loaf / Curled Posture) -->
      <path d="M 762 434 C 760 398 796 376 848 378 C 898 380 924 402 922 430 C 920 442 904 446 878 446 L 784 446 C 769 446 763 442 762 434 Z" fill="#8C9196"/>

      <!-- Warm Sunlit Back Highlight -->
      <path d="M 786 392 C 814 378 856 378 886 388 C 862 390 822 394 786 392 Z" fill="#A9AEB2" opacity="0.7"/>

      <!-- Subtle Darker Gray Tabby Stripes on Back -->
      <path d="M 832 379 C 836 390 834 404 826 413" fill="none" stroke="#6E7378" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M 856 379 C 860 391 858 405 850 414" fill="none" stroke="#6E7378" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M 879 384 C 882 395 880 407 873 415" fill="none" stroke="#6E7378" stroke-width="5" stroke-linecap="round"/>

      <!-- Tucked Front Paws -->
      <ellipse cx="776" cy="441" rx="17" ry="8" fill="#B2B6BA"/>
      <ellipse cx="808" cy="442" rx="15" ry="7.5" fill="#A8ACB0"/>
      <path d="M 769 441 L 769 446 M 776 441 L 776 446" stroke="#80858A" stroke-width="1.3" stroke-linecap="round"/>

      <!-- Cat Ears -->
      <!-- Back/Right Ear -->
      <polygon points="794,394 812,371 820,398" fill="#7D8287"/>
      <polygon points="800,393 811,378 815,395" fill="#C79995"/>
      <!-- Front/Left Ear -->
      <polygon points="755,396 762,371 781,390" fill="#8C9196"/>
      <polygon points="760,394 764,378 775,390" fill="#CE9F9B"/>

      <!-- Sleeping Cat Head -->
      <ellipse cx="786" cy="412" rx="34" ry="27" fill="#959A9F"/>
      <!-- Sunlit Left Cheek / Forehead Highlight -->
      <path d="M 754 410 C 756 392 774 385 788 386 C 773 392 764 405 764 420 C 757 418 754 414 754 410 Z" fill="#A9AEB2" opacity="0.75"/>
      <!-- Lighter Muzzle Patch -->
      <ellipse cx="776" cy="423" rx="16" ry="11" fill="#BDC1C4"/>
      <!-- Forehead Markings -->
      <path d="M 780 388 L 781 397 M 788 388 L 787 397 M 796 390 L 793 398" stroke="#6E7378" stroke-width="2.6" stroke-linecap="round"/>

      <!-- Closed Peaceful Eyes -->
      <path d="M 763 412 Q 769 417 775 412" fill="none" stroke="#4D5155" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M 785 413 Q 792 418 798 413" fill="none" stroke="#4D5155" stroke-width="2.4" stroke-linecap="round"/>

      <!-- Little Dusty Pink Nose & Smile -->
      <polygon points="774,419 780,419 777,423" fill="#C98E89"/>
      <path d="M 772 426 Q 777 429 782 426" fill="none" stroke="#6E7378" stroke-width="1.6" stroke-linecap="round"/>

      <!-- Subtle Whiskers -->
      <g stroke="#D2D5D7" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
        <line x1="762" y1="421" x2="744" y2="419"/>
        <line x1="762" y1="425" x2="745" y2="428"/>
        <line x1="791" y1="422" x2="810" y2="421"/>
        <line x1="791" y1="426" x2="809" y2="429"/>
      </g>
    </g>
  </g>
</svg>
