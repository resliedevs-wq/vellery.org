<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 640 400" width="640" height="400">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican sits on the saddle of a bicycle, pedaling with its webbed feet.
        Wheels, cranks, pedals and the chain all rotate; the road, grass and clouds scroll past.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="30" ry="16"/>
      <ellipse cx="24" cy="-8" rx="20" ry="13"/>
      <ellipse cx="-24" cy="-6" rx="18" ry="11"/>
    </g>

    <g id="tuft" stroke="#6faf5a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-6 0 Q-8 -9 -12 -13"/>
      <path d="M0 0 Q0 -12 -2 -17"/>
      <path d="M6 0 Q9 -8 12 -12"/>
    </g>
  </defs>

  <!-- sky and sun -->
  <rect x="0" y="0" width="640" height="400" fill="url(#sky)"/>
  <circle cx="560" cy="66" r="44" fill="#ffe9a8" opacity="0.55"/>
  <circle cx="560" cy="66" r="26" fill="#ffd75e"/>

  <!-- distant hills -->
  <ellipse cx="180" cy="470" rx="430" ry="110" fill="#cdeab4"/>
  <ellipse cx="540" cy="480" rx="420" ry="120" fill="#bfe0a2"/>

  <!-- clouds: two parallax layers, seamless loops -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -320 0" dur="16s" repeatCount="indefinite"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(30,72)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(350,72)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(670,72)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(990,72)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; -320 0" dur="26s" repeatCount="indefinite"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(190,128) scale(0.65)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(510,128) scale(0.65)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(830,128) scale(0.65)"/>
      <use href="#cloud" xlink:href="#cloud" transform="translate(1150,128) scale(0.65)"/>
    </g>
  </g>

  <!-- speed streaks -->
  <g stroke="#9fc7e8" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="52" y1="118" x2="104" y2="118" opacity="0">
      <animateTransform attributeName="transform" type="translate"
                        values="30 0; -70 0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.55s" begin="0s" repeatCount="indefinite"/>
    </line>
    <line x1="36" y1="160" x2="96" y2="160" opacity="0">
      <animateTransform attributeName="transform" type="translate"
                        values="30 0; -70 0" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.55s" begin="-0.18s" repeatCount="indefinite"/>
    </line>
    <line x1="64" y1="208" x2="116" y2="208" opacity="0">
      <animateTransform attributeName="transform" type="translate"
                        values="30 0; -70 0" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="0.55s" begin="-0.36s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- road with scrolling lane markings -->
  <rect x="0" y="389" width="640" height="11" fill="#d8d8d8"/>
  <line x1="0" y1="394" x2="640" y2="394" stroke="#ffffff" stroke-width="3" stroke-dasharray="28 44">
    <animate attributeName="stroke-dashoffset" values="0;72" dur="0.23s" repeatCount="indefinite"/>
  </line>

  <!-- grass tufts scrolling past -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; -240 0" dur="0.76s" repeatCount="indefinite"/>
    <use href="#tuft" xlink:href="#tuft" transform="translate(20,389)"/>
    <use href="#tuft" xlink:href="#tuft" transform="translate(260,389)"/>
    <use href="#tuft" xlink:href="#tuft" transform="translate(500,389)"/>
    <use href="#tuft" xlink:href="#tuft" transform="translate(740,389)"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="290" cy="392" rx="195" ry="7" fill="#000000" opacity="0.08"/>

  <!-- rear wheel -->
  <g transform="translate(160,330)">
    <circle r="60" fill="none" stroke="#2f2f2f" stroke-width="9"/>
    <circle r="51" fill="none" stroke="#9aa0a6" stroke-width="3"/>
    <g stroke="#b9bec4" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate"
                        values="0 0 0; 360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <line x1="-51" y1="0" x2="51" y2="0"/>
      <line x1="0" y1="-51" x2="0" y2="51"/>
      <line x1="-36" y1="-36" x2="36" y2="36"/>
      <line x1="-36" y1="36" x2="36" y2="-36"/>
      <circle cx="34" cy="0" r="4" fill="#ff8c42" stroke="none"/>
    </g>
    <circle r="7" fill="#555555"/>
  </g>

  <!-- front wheel -->
  <g transform="translate(420,330)">
    <circle r="60" fill="none" stroke="#2f2f2f" stroke-width="9"/>
    <circle r="51" fill="none" stroke="#9aa0a6" stroke-width="3"/>
    <g stroke="#b9bec4" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate"
                        values="0 0 0; 360 0 0" dur="1.2s" repeatCount="indefinite"/>
      <line x1="-51" y1="0" x2="51" y2="0"/>
      <line x1="0" y1="-51" x2="0" y2="51"/>
      <line x1="-36" y1="-36" x2="36" y2="36"/>
      <line x1="-36" y1="36" x2="36" y2="-36"/>
      <circle cx="34" cy="0" r="4" fill="#59c1e8" stroke="none"/>
    </g>
    <circle r="7" fill="#555555"/>
  </g>

  <!-- far leg (left), synced to the crank -->
  <path fill="none" stroke="#d18a2e" stroke-width="7" stroke-linecap="round"
        d="M240 198 Q258.5 254 245 330">
    <animate attributeName="d" dur="0.95s" repeatCount="indefinite"
             keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
             values="M240 198 Q258.5 254 245 330;
                     M240 198 Q271.1 232.1 258.2 298.2;
                     M240 198 Q295 221.5 290 285;
                     M240 198 Q308.9 231.1 321.8 298.2;
                     M240 198 Q309.5 252 335 330;
                     M240 198 Q302.9 265.9 321.8 361.8;
                     M240 198 Q285 272.5 290 375;
                     M240 198 Q267.1 267.9 258.2 361.8;
                     M240 198 Q258.5 254 245 330"/>
  </path>
  <path fill="#d18a2e" stroke="#8a5a17" stroke-width="1.5" d="M -6 -2 L 18 1 L 12 7 L -4 5 Z">
    <animateTransform attributeName="transform" type="translate" dur="0.95s" repeatCount="indefinite"
                      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                      values="245 330; 258.2 298.2; 290 285; 321.8 298.2; 335 330;
                              321.8 361.8; 290 375; 258.2 361.8; 245 330"/>
  </path>

  <!-- chain and rear sprocket -->
  <circle cx="160" cy="330" r="9" fill="none" stroke="#666666" stroke-width="4"/>
  <path d="M160 321 L290 310" fill="none" stroke="#555555" stroke-width="3.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="10;0" dur="0.08s" repeatCount="indefinite"/>
  </path>
  <path d="M160 339 L290 350" fill="none" stroke="#555555" stroke-width="3.5" stroke-dasharray="6 4">
    <animate attributeName="stroke-dashoffset" values="0;10" dur="0.08s" repeatCount="indefinite"/>
  </path>

  <!-- frame -->
  <g stroke="#d64545" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M160 330 L290 330 L236 204"/>
    <path d="M160 330 L238 211"/>
    <path d="M240 211 L385 209"/>
    <path d="M290 330 L392 230"/>
    <path d="M382 200 L396 242" stroke-width="8"/>
  </g>
  <path d="M396 242 L420 330" stroke="#555555" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- handlebar -->
  <g stroke="#444444" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M382 200 L390 183"/>
    <path d="M377 182 Q391 173 405 182"/>
  </g>
  <circle cx="406" cy="182" r="4" fill="#333333"/>

  <!-- chainring, cranks and pedals (pedals counter-rotate to stay level) -->
  <g transform="translate(290,330)">
    <circle r="20" fill="none" stroke="#888888" stroke-width="4"/>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 0 0; 360 0 0" dur="0.95s" repeatCount="indefinite"/>
      <circle cx="9" cy="0" r="2.6" fill="#999999"/>
      <line x1="0" y1="0" x2="45" y2="0" stroke="#444444" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="-45" y2="0" stroke="#3a3a3a" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(-45,0)">
        <rect x="-10" y="-3.5" width="20" height="7" rx="2" fill="#2e2e2e">
          <animateTransform attributeName="transform" type="rotate"
                            values="0 0 0; -360 0 0" dur="0.95s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g transform="translate(45,0)">
        <rect x="-10" y="-3.5" width="20" height="7" rx="2" fill="#2e2e2e">
          <animateTransform attributeName="transform" type="rotate"
                            values="0 0 0; -360 0 0" dur="0.95s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
    <circle r="6.5" fill="#555555"/>
  </g>

  <!-- near leg (right), synced to the crank -->
  <path fill="none" stroke="#f5a63b" stroke-width="8" stroke-linecap="round"
        d="M252 196 Q315.5 251 335 330">
    <animate attributeName="d" dur="0.95s" repeatCount="indefinite"
             keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
             values="M252 196 Q315.5 251 335 330;
                     M252 196 Q308.9 264.9 321.8 361.8;
                     M252 196 Q291 271.5 290 375;
                     M252 196 Q273.1 266.9 258.2 361.8;
                     M252 196 Q264.5 253 245 330;
                     M252 196 Q277.1 231.1 258.2 298.2;
                     M252 196 Q301 220.5 290 285;
                     M252 196 Q314.9 231.1 321.8 298.2;
                     M252 196 Q315.5 251 335 330"/>
  </path>
  <path fill="#f5a63b" stroke="#8a5a17" stroke-width="1.5" d="M -6 -2 L 18 1 L 12 7 L -4 5 Z">
    <animateTransform attributeName="transform" type="translate" dur="0.95s" repeatCount="indefinite"
                      keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
                      values="335 330; 321.8 361.8; 290 375; 258.2 361.8; 245 330;
                              258.2 298.2; 290 285; 321.8 298.2; 335 330"/>
  </path>

  <!-- saddle -->
  <path d="M232 199 L237 205" stroke="#666666" stroke-width="4" stroke-linecap="round"/>
  <path d="M204 197 Q232 186 262 196 Q240 208 204 197 Z" fill="#333333"/>

  <!-- pelican torso (gently bobbing with each pedal stroke) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 3; 0 0" dur="0.475s" repeatCount="indefinite"
                      calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
    <!-- tail feathers -->
    <path d="M192 152 L146 136 L155 153 L136 159 L152 167 L143 177 L192 175 Z"
          fill="#fdfdfb" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- neck -->
    <path d="M258 150 C282 138 296 116 306 92" fill="none"
          stroke="#4a4a4a" stroke-width="21" stroke-linecap="round"/>
    <path d="M258 150 C282 138 296 116 306 92" fill="none"
          stroke="#fdfdfb" stroke-width="17" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="232" cy="168" rx="52" ry="34" transform="rotate(-6 232 168)"
             fill="#fdfdfb" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M196 178 Q224 188 258 180" fill="none" stroke="#d9d9d4" stroke-width="2"/>
    <path d="M198 166 Q226 176 260 168" fill="none" stroke="#d9d9d4" stroke-width="2"/>
    <!-- head -->
    <circle cx="310" cy="84" r="15" fill="#fdfdfb" stroke="#4a4a4a" stroke-width="2.5"/>
    <path d="M300 72 Q291 63 285 67" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"/>
    <!-- pouch and beak -->
    <path d="M318 88 L400 100 Q344 140 318 88 Z"
          fill="#f7b733" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M313 77 L405 95 L399 102 L312 85 Z"
          fill="#e8930c" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- eye -->
    <circle cx="312" cy="75" r="3.2" fill="#262626"/>
    <circle cx="313.2" cy="73.8" r="1" fill="#ffffff"/>
  </g>

  <!-- wing reaching the handlebar -->
  <path d="M244 148 Q300 134 402 180 Q350 199 296 194 Q258 189 246 167 Z"
        fill="#f4f4ee" stroke="#4a4a4a" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M292 186 Q336 186 372 183" fill="none" stroke="#cfcfc8" stroke-width="2"/>
  <path d="M282 176 Q320 176 356 175" fill="none" stroke="#cfcfc8" stroke-width="2"/>
</svg>
