<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican sits on the saddle of a red bicycle and pedals: cranks, pedals, feet and wheels rotate, the road rushes past.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe7f5"/>
      <stop offset="1" stop-color="#eef9fd"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="705" cy="72" r="44" fill="#ffe9a8" opacity="0.55"/>
  <circle cx="705" cy="72" r="30" fill="#ffd75e"/>

  <!-- drifting clouds -->
  <g fill="#ffffff" opacity="0.92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="880 78;-200 78" dur="26s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="55" ry="22"/>
      <ellipse cx="36" cy="-11" rx="36" ry="18"/>
      <ellipse cx="-38" cy="-8" rx="30" ry="15"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1030 140;-140 140" dur="34s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="48" ry="19"/>
      <ellipse cx="30" cy="-9" rx="30" ry="15"/>
      <ellipse cx="-32" cy="-7" rx="26" ry="13"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="950 42;-160 42" dur="20s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="38" ry="15"/>
      <ellipse cx="24" cy="-8" rx="24" ry="12"/>
    </g>
  </g>

  <!-- ground and road -->
  <rect x="0" y="415" width="800" height="85" fill="#93cf7b"/>
  <rect x="0" y="430" width="800" height="32" fill="#5d6067"/>
  <rect x="0" y="430" width="800" height="3" fill="#474a4f"/>
  <rect x="0" y="459" width="800" height="3" fill="#474a4f"/>
  <line x1="0" y1="446" x2="800" y2="446" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="42 28">
    <animate attributeName="stroke-dashoffset" values="0;70" dur="0.1s" repeatCount="indefinite"/>
  </line>
  <ellipse cx="390" cy="432" rx="215" ry="7" fill="#000000" opacity="0.15"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="52" y1="286" x2="150" y2="286" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.75s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="322" x2="145" y2="322" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.75s" begin="0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="60" y1="358" x2="168" y2="358" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.75s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- far crank arm (behind frame) -->
  <line x1="390" y1="315" x2="390" y2="405" stroke="#5a5a5a" stroke-width="9" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 390 360;360 390 360" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- far leg (two-bone IK keyframes, 30 deg steps, starts at bottom of stroke) -->
  <path fill="none" stroke="#7a4d0d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        d="M355 218 L416.3 303.3 L390 405">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M355 218 L416.3 303.3 L390 405;
      M355 218 L414.1 304.9 L367.5 399;
      M355 218 L418.3 301.8 L351 382.5;
      M355 218 L427 294.4 L345 360;
      M355 218 L439.2 280.7 L351 337.5;
      M355 218 L451.9 258.5 L367.5 321;
      M355 218 L458.6 235.4 L390 315;
      M355 218 L459.6 227.2 L412.5 321;
      M355 218 L458.3 236.7 L429 337.5;
      M355 218 L452.7 256.5 L435 360;
      M355 218 L441 278.2 L429 382.5;
      M355 218 L426.4 294.9 L412.5 399;
      M355 218 L416.3 303.3 L390 405"/>
  </path>
  <path fill="none" stroke="#b97f24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M355 218 L416.3 303.3 L390 405">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M355 218 L416.3 303.3 L390 405;
      M355 218 L414.1 304.9 L367.5 399;
      M355 218 L418.3 301.8 L351 382.5;
      M355 218 L427 294.4 L345 360;
      M355 218 L439.2 280.7 L351 337.5;
      M355 218 L451.9 258.5 L367.5 321;
      M355 218 L458.6 235.4 L390 315;
      M355 218 L459.6 227.2 L412.5 321;
      M355 218 L458.3 236.7 L429 337.5;
      M355 218 L452.7 256.5 L435 360;
      M355 218 L441 278.2 L429 382.5;
      M355 218 L426.4 294.9 L412.5 399;
      M355 218 L416.3 303.3 L390 405"/>
  </path>

  <!-- far foot on far pedal (orbits bottom-start, clockwise) -->
  <g transform="translate(390,360)">
    <g>
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M0,45 a45,45 0 1 1 0,-90 a45,45 0 1 1 0,90"/>
      <rect x="-11" y="3" width="23" height="6" rx="2" fill="#232323"/>
      <path d="M-4 -5 L27 -9 L28 3 L-4 2 Z" fill="#b97f24" stroke="#7a4d0d" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- rear wheel -->
  <g>
    <circle cx="250" cy="350" r="78" fill="none" stroke="#2e2e2e" stroke-width="11"/>
    <circle cx="250" cy="350" r="70" fill="none" stroke="#c9c9c9" stroke-width="4"/>
    <g stroke="#bfbfbf" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 250 350;360 250 350" dur="0.7s" repeatCount="indefinite"/>
      <line x1="250" y1="282" x2="250" y2="418"/>
      <line x1="182" y1="350" x2="318" y2="350"/>
      <line x1="202" y1="302" x2="298" y2="398"/>
      <line x1="202" y1="398" x2="298" y2="302"/>
      <circle cx="250" cy="350" r="9" fill="none" stroke="#8a8a8a" stroke-width="4" stroke-dasharray="4 3"/>
    </g>
  </g>

  <!-- front wheel -->
  <g>
    <circle cx="530" cy="350" r="78" fill="none" stroke="#2e2e2e" stroke-width="11"/>
    <circle cx="530" cy="350" r="70" fill="none" stroke="#c9c9c9" stroke-width="4"/>
    <g stroke="#bfbfbf" stroke-width="3">
      <animateTransform attributeName="transform" type="rotate" values="0 530 350;360 530 350" dur="0.7s" repeatCount="indefinite"/>
      <line x1="530" y1="282" x2="530" y2="418"/>
      <line x1="462" y1="350" x2="598" y2="350"/>
      <line x1="482" y1="302" x2="578" y2="398"/>
      <line x1="482" y1="398" x2="578" y2="302"/>
    </g>
    <circle cx="530" cy="350" r="6" fill="#3a3a3a"/>
  </g>

  <!-- frame -->
  <g stroke="#e0483f" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="390" y1="360" x2="342" y2="222"/>
    <line x1="342" y1="226" x2="485" y2="246"/>
    <line x1="390" y1="360" x2="486" y2="248"/>
    <line x1="250" y1="350" x2="342" y2="226"/>
    <line x1="250" y1="350" x2="390" y2="360"/>
    <line x1="487" y1="243" x2="530" y2="350"/>
    <path d="M487 243 L477 217 Q474 209 465 211 L455 213" stroke-width="6"/>
  </g>

  <!-- saddle (nose sticks out in front of the pelican) -->
  <path d="M320 220 Q347 208 384 218 L375 226 Q345 234 327 228 Z" fill="#2e2e2e"/>
  <circle cx="250" cy="350" r="6" fill="#3a3a3a"/>
  <circle cx="530" cy="350" r="6" fill="#3a3a3a"/>

  <!-- chain -->
  <g stroke="#464646" stroke-width="4.5" stroke-dasharray="6 4" fill="none" stroke-linecap="round">
    <line x1="252" y1="341" x2="390" y2="340">
      <animate attributeName="stroke-dashoffset" values="0;-10" dur="0.09s" repeatCount="indefinite"/>
    </line>
    <line x1="252" y1="359" x2="390" y2="380">
      <animate attributeName="stroke-dashoffset" values="0;10" dur="0.09s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- crank + chainring (near side) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 390 360;360 390 360" dur="1.2s" repeatCount="indefinite"/>
    <circle cx="390" cy="360" r="21" fill="none" stroke="#3f3f3f" stroke-width="5" stroke-dasharray="5 4"/>
    <line x1="390" y1="315" x2="390" y2="405" stroke="#2b2b2b" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="390" cy="360" r="6.5" fill="#1f1f1f"/>

  <!-- near foot on near pedal (orbits top-start, clockwise) -->
  <g transform="translate(390,360)">
    <g>
      <animateMotion dur="1.2s" repeatCount="indefinite" path="M0,-45 a45,45 0 1 1 0,90 a45,45 0 1 1 0,-90"/>
      <rect x="-11" y="3" width="23" height="6" rx="2" fill="#2e2e2e"/>
      <path d="M-4 -5 L27 -9 L28 3 L-4 2 Z" fill="#f08a1f" stroke="#9c5a10" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- pelican (with a gentle pedalling bob) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- tail feathers -->
    <path d="M292 172 L244 148 L254 166 L238 172 L254 178 L248 194 Z"
          fill="#e9e2d2" stroke="#3b3b3b" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- neck -->
    <path d="M352 180 C385 160 380 125 400 96" fill="none" stroke="#3b3b3b" stroke-width="21" stroke-linecap="round"/>
    <path d="M352 180 C385 160 380 125 400 96" fill="none" stroke="#f7f3e9" stroke-width="15" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="333" cy="182" rx="66" ry="44" fill="#f7f3e9" stroke="#3b3b3b" stroke-width="2.5"
             transform="rotate(-10 333 182)"/>

    <!-- wing reaching the handlebar -->
    <path d="M350 178 C388 170 430 192 466 218" fill="none" stroke="#3b3b3b" stroke-width="15" stroke-linecap="round"/>
    <path d="M350 178 C388 170 430 192 466 218" fill="none" stroke="#e9e2d2" stroke-width="10" stroke-linecap="round"/>
    <circle cx="464" cy="216" r="5.5" fill="#e9e2d2" stroke="#3b3b3b" stroke-width="2.5"/>

    <!-- head -->
    <circle cx="406" cy="90" r="19" fill="#f7f3e9" stroke="#3b3b3b" stroke-width="2.5"/>

    <!-- pouch -->
    <path d="M415 95 C435 140 480 138 510 104 L510 99 L415 88 Z"
          fill="#f6c766" stroke="#a5641c" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- upper beak -->
    <path d="M413 76 L514 100 L512 108 L414 95 Z"
          fill="#f2a63b" stroke="#a5641c" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- eye (blinks) -->
    <ellipse cx="412" cy="79" rx="3.4" ry="3.4" fill="#222222">
      <animate attributeName="ry" values="3.4;3.4;0.4;3.4" keyTimes="0;0.9;0.94;1" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- near leg (starts at top of stroke) -->
  <path fill="none" stroke="#9c5a10" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"
        d="M355 218 L458.6 235.4 L390 315">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M355 218 L458.6 235.4 L390 315;
      M355 218 L459.6 227.2 L412.5 321;
      M355 218 L458.3 236.7 L429 337.5;
      M355 218 L452.7 256.5 L435 360;
      M355 218 L441 278.2 L429 382.5;
      M355 218 L426.4 294.9 L412.5 399;
      M355 218 L416.3 303.3 L390 405;
      M355 218 L414.1 304.9 L367.5 399;
      M355 218 L418.3 301.8 L351 382.5;
      M355 218 L427 294.4 L345 360;
      M355 218 L439.2 280.7 L351 337.5;
      M355 218 L451.9 258.5 L367.5 321;
      M355 218 L458.6 235.4 L390 315"/>
  </path>
  <path fill="none" stroke="#f08a1f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        d="M355 218 L458.6 235.4 L390 315">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M355 218 L458.6 235.4 L390 315;
      M355 218 L459.6 227.2 L412.5 321;
      M355 218 L458.3 236.7 L429 337.5;
      M355 218 L452.7 256.5 L435 360;
      M355 218 L441 278.2 L429 382.5;
      M355 218 L426.4 294.9 L412.5 399;
      M355 218 L416.3 303.3 L390 405;
      M355 218 L414.1 304.9 L367.5 399;
      M355 218 L418.3 301.8 L351 382.5;
      M355 218 L427 294.4 L345 360;
      M355 218 L439.2 280.7 L351 337.5;
      M355 218 L451.9 258.5 L367.5 321;
      M355 218 L458.6 235.4 L390 315"/>
  </path>
</svg>
