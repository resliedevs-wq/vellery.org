        begin="-0.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 70 244 H 226">
      <animate attributeName="stroke-dashoffset" values="0;106" dur="0.85s"
        begin="-0.45s" repeatCount="indefinite"/>
    </path>
  </g>

