<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aedcff"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="roadg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7a87"/>
      <stop offset="1" stop-color="#55616d"/>
    </linearGradient>
  </defs>

  <!-- ======== background ======== -->
  <rect x="0" y="0" width="800" height="440" fill="url(#sky)"/>
  <circle cx="706" cy="76" r="48" fill="#ffd166" opacity="0.35"/>
  <circle cx="706" cy="76" r="34" fill="#ffd166"/>

  <!-- clouds drifting left (seamless loop) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="13s" repeatCount="indefinite"/>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="130" cy="92" rx="62" ry="20"/>
      <ellipse cx="178" cy="80" rx="46" ry="17"/>
      <ellipse cx="88"  cy="84" rx="40" ry="15"/>
      <ellipse cx="430" cy="58" rx="54" ry="17"/>
      <ellipse cx="470" cy="48" rx="36" ry="14"/>
    </g>
    <g fill="#ffffff" opacity="0.9">
      <ellipse cx="930" cy="92" rx="62" ry="20"/>
      <ellipse cx="978" cy="80" rx="46" ry="17"/>
      <ellipse cx="888" cy="84" rx="40" ry="15"/>
      <ellipse cx="1230" cy="58" rx="54" ry="17"/>
      <ellipse cx="1270" cy="48" rx="36" ry="14"/>
    </g>
  </g>

  <!-- ground -->
  <rect x="0" y="414" width="800" height="26" fill="#8fce77"/>
  <rect x="0" y="436" width="800" height="4"  fill="#6fb35e"/>
  <rect x="0" y="440" width="800" height="60" fill="url(#roadg)"/>
  <rect x="0" y="440" width="800" height="3"  fill="#4d5862"/>
  <line x1="-60" y1="470" x2="860" y2="470" stroke="#f2f2f2" stroke-width="5" stroke-dasharray="45 55">
    <animate attributeName="stroke-dashoffset" from="0" to="900" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- shadow -->
  <ellipse cx="375" cy="441" rx="240" ry="9" fill="#1b2733" opacity="0.14"/>

  <!-- ======== far crank + pedal + foot (other side of the bike) ======== -->
  <g transform="rotate(180 330 375)">
    <animateTransform attributeName="transform" type="rotate" from="180 330 375" to="540 330 375" dur="1.1s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="45" y2="0" transform="translate(330 375)" stroke="#3a3f44" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(375 375)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.1s" repeatCount="indefinite"/>
        <rect x="-11" y="-4" width="22" height="8" rx="2.5" fill="#2e3236"/>
        <g transform="rotate(-52.46)">
          <animateTransform attributeName="transform" type="rotate"
            values="-52.46 0 0;-59.10 0 0;-59.94 0 0;-53.33 0 0;-41.11 0 0;-28.31 0 0;-18.03 0 0;-10.46 0 0;-4.95 0 0;-1.09 0 0;0.98 0 0;-0.04 0 0;-6.45 0 0;-17.47 0 0;-30.06 0 0;-42.21 0 0;-52.46 0 0"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
            dur="1.1s" repeatCount="indefinite"/>
          <path d="M -8 -5 C -2 -8 5 -7 13 -3 L 14 -1 L -8 1 Z" fill="#d97a2b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== far leg (behind the bike) ======== -->
  <g transform="translate(300 250)">
    <g transform="rotate(-38.78)">
      <animateTransform attributeName="transform" type="rotate"
        values="-38.78 0 0;-46.84 0 0;-57.70 0 0;-70.75 0 0;-82.22 0 0;-87.33 0 0;-85.16 0 0;-77.63 0 0;-66.88 0 0;-54.52 0 0;-42.05 0 0;-31.70 0 0;-26.46 0 0;-26.24 0 0;-28.73 0 0;-32.91 0 0;-38.78 0 0"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        dur="1.1s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="90" stroke="#cf8a3f" stroke-width="12" stroke-linecap="round"/>
      <g transform="translate(0 90)">
        <g transform="rotate(91.24)">
          <animateTransform attributeName="transform" type="rotate"
            values="91.24 0 0;105.94 0 0;117.63 0 0;124.08 0 0;123.32 0 0;115.64 0 0;103.19 0 0;88.09 0 0;71.84 0 0;55.61 0 0;41.07 0 0;31.74 0 0;32.91 0 0;43.71 0 0;58.78 0 0;75.12 0 0;91.24 0 0"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
            dur="1.1s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="90" stroke="#cf8a3f" stroke-width="9" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== rear wheel ======== -->
  <g transform="translate(210 368)">
    <circle r="72" fill="none" stroke="#2b2d31" stroke-width="9"/>
    <circle r="63" fill="none" stroke="#d8dde2" stroke-width="4"/>
    <g stroke="#a6adb5" stroke-width="2.5" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.511s" repeatCount="indefinite"/>
      <line x1="-63" y1="0" x2="63" y2="0"/>
      <line x1="0" y1="-63" x2="0" y2="63"/>
      <line x1="-44.5" y1="-44.5" x2="44.5" y2="44.5"/>
      <line x1="-44.5" y1="44.5"  x2="44.5" y2="-44.5"/>
      <circle cx="0" cy="-56" r="3.5" fill="#e3554f" stroke="none"/>
    </g>
    <circle r="7" fill="#555b62"/>
    <!-- driven sprocket -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.511s" repeatCount="indefinite"/>
      <circle r="13" fill="none" stroke="#8a9096" stroke-width="5" stroke-dasharray="4 3"/>
      <circle r="13" fill="none" stroke="#6b7076" stroke-width="2"/>
      <line x1="-13" y1="0" x2="13" y2="0" stroke="#6b7076" stroke-width="2"/>
      <line x1="0" y1="-13" x2="0" y2="13" stroke="#6b7076" stroke-width="2"/>
    </g>
  </g>

  <!-- ======== front wheel ======== -->
  <g transform="translate(540 368)">
    <circle r="72" fill="none" stroke="#2b2d31" stroke-width="9"/>
    <circle r="63" fill="none" stroke="#d8dde2" stroke-width="4"/>
    <g stroke="#a6adb5" stroke-width="2.5" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.511s" repeatCount="indefinite"/>
      <line x1="-63" y1="0" x2="63" y2="0"/>
      <line x1="0" y1="-63" x2="0" y2="63"/>
      <line x1="-44.5" y1="-44.5" x2="44.5" y2="44.5"/>
      <line x1="-44.5" y1="44.5"  x2="44.5" y2="-44.5"/>
      <circle cx="0" cy="-56" r="3.5" fill="#e3554f" stroke="none"/>
    </g>
    <circle r="7" fill="#555b62"/>
  </g>

  <!-- ======== frame ======== -->
  <g stroke="#e63946" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 210 368 L 330 375"/>              <!-- chainstay -->
    <path d="M 210 368 L 302 264"/>              <!-- seat stay -->
    <path d="M 330 375 L 298 258"/>              <!-- seat tube -->
    <path d="M 302 264 L 492 268"/>              <!-- top tube -->
    <path d="M 330 375 L 503 335"/>              <!-- down tube -->
    <path d="M 503 335 L 492 268"/>              <!-- head tube -->
    <path d="M 503 335 Q 522 348 540 368"/>      <!-- fork -->
  </g>
  <!-- stem + handlebar -->
  <path d="M 492 268 L 500 236" stroke="#3a3f44" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 500 236 Q 501 230 508 231 L 530 234" stroke="#3a3f44" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="530" cy="234" r="5" fill="#22262a"/>
  <circle cx="499" cy="228" r="5" fill="#f2c14e" stroke="#c99b2e" stroke-width="1.5"/> <!-- bell -->
  <!-- saddle -->
  <rect x="272" y="248" width="52" height="10" rx="5" fill="#2f3338" transform="rotate(-4 298 253)"/>

  <!-- ======== chain (top run moves forward, bottom run rearward) ======== -->
  <g stroke="#4b5157" stroke-width="3.5" stroke-dasharray="5 5" fill="none">
    <line x1="212" y1="355" x2="331" y2="347">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="1s" repeatCount="indefinite"/>
    </line>
    <line x1="331" y1="403" x2="212" y2="381">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="1s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ======== chainring (turns with the cranks) ======== -->
  <g transform="translate(330 375)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
      <circle r="28" fill="none" stroke="#8a9096" stroke-width="6" stroke-dasharray="4 3"/>
      <circle r="24" fill="none" stroke="#6b7076" stroke-width="2.5"/>
      <circle r="9" fill="#6b7076"/>
      <line x1="0" y1="-24" x2="0" y2="24" stroke="#6b7076" stroke-width="3"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#6b7076" stroke-width="3"/>
    </g>
  </g>

  <!-- ======== near crank + pedal + foot ======== -->
  <g transform="translate(330 375)">
    <animateTransform attributeName="transform" type="rotate" from="0 330 375" to="360 330 375" dur="1.1s" repeatCount="indefinite"/>
    <line x1="0" y1="0" x2="45" y2="0" stroke="#4b5157" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="6" fill="#3a3f44"/>
    <g transform="translate(45 0)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="1.1s" repeatCount="indefinite"/>
        <rect x="-11" y="-4" width="22" height="8" rx="2.5" fill="#2e3236"/>
        <g transform="rotate(-4.95)">
          <animateTransform attributeName="transform" type="rotate"
            values="-4.95 0 0;-1.09 0 0;0.98 0 0;-0.04 0 0;-6.45 0 0;-17.47 0 0;-30.06 0 0;-42.21 0 0;-52.46 0 0;-59.10 0 0;-59.94 0 0;-53.33 0 0;-41.11 0 0;-28.31 0 0;-18.03 0 0;-10.46 0 0;-4.95 0 0"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
            dur="1.1s" repeatCount="indefinite"/>
          <path d="M -8 -5 C -2 -8 5 -7 13 -3 L 14 -1 L -8 1 Z" fill="#ef8734"/>
          <path d="M 2 -6 L 4 -2 M 8 -5 L 9 -2" stroke="#c9661f" stroke-width="1.2"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== near leg ======== -->
  <g transform="translate(300 250)">
    <g transform="rotate(-66.88)">
      <animateTransform attributeName="transform" type="rotate"
        values="-66.88 0 0;-54.52 0 0;-42.05 0 0;-31.70 0 0;-26.46 0 0;-26.24 0 0;-28.73 0 0;-32.91 0 0;-38.78 0 0;-46.84 0 0;-57.70 0 0;-70.75 0 0;-82.22 0 0;-87.33 0 0;-85.16 0 0;-77.63 0 0;-66.88 0 0"
        keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
        dur="1.1s" repeatCount="indefinite"/>
      <line x1="0" y1="0" x2="0" y2="90" stroke="#f4a261" stroke-width="13" stroke-linecap="round"/>
      <g transform="translate(0 90)">
        <g transform="rotate(71.84)">
          <animateTransform attributeName="transform" type="rotate"
            values="71.84 0 0;55.61 0 0;41.07 0 0;31.74 0 0;32.91 0 0;43.71 0 0;58.78 0 0;75.12 0 0;91.24 0 0;105.94 0 0;117.63 0 0;124.08 0 0;123.32 0 0;115.64 0 0;103.19 0 0;88.09 0 0;71.84 0 0"
            keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1"
            dur="1.1s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="90" stroke="#f4a261" stroke-width="10" stroke-linecap="round"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ======== pelican ======== -->
  <!-- tail (bounces with each pedal stroke) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 252 214;-6 252 214;0 252 214" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
    <path d="M 254 214 L 214 184 L 240 212 L 208 202 L 244 220 L 218 224 L 252 226 Z"
          fill="#e9edf1" stroke="#c9ced4" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- body -->
  <g transform="rotate(-8 300 222)">
    <ellipse cx="300" cy="222" rx="56" ry="40" fill="#f8f9fa" stroke="#c9ced4" stroke-width="3"/>
    <ellipse cx="306" cy="238" rx="34" ry="22" fill="#e9edf1"/>
  </g>

  <!-- neck -->
  <path d="M 326 218 C 344 190 356 168 392 156" fill="none" stroke="#c9ced4" stroke-width="25" stroke-linecap="round"/>
  <path d="M 326 218 C 344 190 356 168 392 156" fill="none" stroke="#f8f9fa" stroke-width="19" stroke-linecap="round"/>

  <!-- head (nods gently with the pedal strokes) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 394 158;-3 394 158;0 394 158" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
    <path d="M 396 132 Q 390 122 398 118 M 400 130 Q 398 120 406 116" fill="none" stroke="#c9ced4" stroke-width="2.5" stroke-linecap="round"/>
    <!-- pouch (wobbles) -->
    <g transform="translate(415 153)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1;1 1.1;1 1" keyTimes="0;0.5;1" dur="0.55s" repeatCount="indefinite"/>
        <path d="M 0 0 Q 37 52 97 19 L 101 11 L 1 -1 Z" fill="#ef6c3a" stroke="#d95b2e" stroke-width="1.5"/>
      </g>
    </g>
    <!-- upper beak -->
    <path d="M 414 138 L 516 164 L 512 174 L 416 152 Z" fill="#f59e2b" stroke="#d97f14" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="416" y1="152" x2="512" y2="172" stroke="#b34713" stroke-width="1.2"/>
    <!-- head -->
    <circle cx="406" cy="146" r="17" fill="#f8f9fa" stroke="#c9ced4" stroke-width="3"/>
    <!-- eye (blinks) -->
    <g transform="translate(404 138)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          values="1 1;1 1;1 0.1;1 1;1 1" keyTimes="0;0.42;0.46;0.5;1" dur="4s" repeatCount="indefinite"/>
        <circle r="6" fill="#ffffff" stroke="#c9ced4" stroke-width="1.5"/>
        <circle cx="1.5" cy="0.5" r="2.8" fill="#22262a"/>
        <circle cx="0.4" cy="-1.2" r="1" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- wing reaching to the handlebar -->
  <path d="M 331 256
           C 385 244 445 236 505 230
           L 512 228
           C 520 227 524 234 517 238
           C 458 248 392 264 342 286
           C 333 278 328 264 331 256 Z"
        fill="#f6f8fa" stroke="#b9c2cb" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 505 231 L 526 232 M 504 234 L 524 241 M 500 238 L 517 247" fill="none" stroke="#b9c2cb" stroke-width="2" stroke-linecap="round"/>
</svg>
