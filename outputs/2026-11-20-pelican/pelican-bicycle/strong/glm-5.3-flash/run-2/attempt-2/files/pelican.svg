<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican wearing a helmet pedals a red bicycle; wheels and cranks spin, legs pedal in sync, the road dashes by.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6fb"/>
      <stop offset="1" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#f0e7d2"/>
    </linearGradient>
  </defs>

  <!-- ======================= backdrop ======================= -->
  <rect width="900" height="620" fill="url(#sky)"/>
  <circle cx="812" cy="86" r="46" fill="#ffe9a3" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.85">
    <g>
      <ellipse cx="150" cy="112" rx="60" ry="22"/>
      <ellipse cx="196" cy="99" rx="44" ry="20"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="640" cy="72" rx="50" ry="18"/>
      <ellipse cx="677" cy="61" rx="36" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 8;0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ground / road -->
  <rect y="524" width="900" height="96" fill="#a9d980"/>
  <rect y="540" width="900" height="44" fill="#d7d2c6"/>
  <line x1="-260" y1="566" x2="1160" y2="566" stroke="#f6f2e7" stroke-width="6" stroke-dasharray="130 130">
    <animate attributeName="stroke-dashoffset" from="0" to="-260" dur="0.49s" repeatCount="indefinite"/>
  </line>
  <g stroke="#7cb45a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 90 614 q 4 -16 8 0 M 100 614 q 4 -11 8 0"/>
    <path d="M 700 610 q 4 -14 8 0 M 710 610 q 4 -10 8 0"/>
    <path d="M 830 616 q 4 -15 8 0"/>
    <path d="M 40 606 q 4 -13 8 0 M 50 606 q 4 -10 8 0"/>
  </g>

  <!-- speed lines -->
  <g stroke="#7fa8c9" stroke-width="5" stroke-linecap="round" opacity="0.35">
    <line x1="60" y1="300" x2="190" y2="300" stroke-dasharray="34 96">
      <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="0.49s" repeatCount="indefinite"/>
    </line>
    <line x1="90" y1="338" x2="205" y2="338" stroke-dasharray="26 104">
      <animate attributeName="stroke-dashoffset" from="0" to="-130" dur="0.49s" repeatCount="indefinite"/>
    </line>
  </g>

  <ellipse cx="465" cy="547" rx="250" ry="12" fill="#1c2b18" opacity="0.14"/>

  <!-- ======================= far crank + far leg (behind bike) ======================= -->
  <g>
    <line x1="430" y1="430" x2="375" y2="430" stroke="#8c4a1f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="375" cy="430" r="4.5" fill="#333333"/>
    <animateTransform attributeName="transform" type="rotate" from="0 430 430" to="360 430 430" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <g stroke-linecap="round">
    <!-- far thigh -->
    <line x1="402" y1="290" x2="468.1" y2="371.5" stroke="#a85f1d" stroke-width="13">
      <animate attributeName="x2" values="468.1;491.2;506.8;507;502.2;480.7;458.6;455.9;468.1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="371.5;345.5;296.3;287.9;321.4;359.5;378.5;380.1;371.5" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <!-- far shin -->
    <line x1="468.1" y1="371.5" x2="375" y2="430" stroke="#97541a" stroke-width="11">
      <animate attributeName="x1" values="468.1;491.2;506.8;507;502.2;480.7;458.6;455.9;468.1" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="371.5;345.5;296.3;287.9;321.4;359.5;378.5;380.1;371.5" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="375;391.1;430;468.9;485;468.9;430;391.1;375" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="430;391.1;375;391.1;430;468.9;485;468.9;430" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- far webbed foot -->
  <g transform="translate(375 430)">
    <path d="M -12 -5 L 14 -7 L 21 -1 L 8 1 L 17 5 L -12 5 Z" fill="#a85f1d" stroke="#3d3229" stroke-width="2" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="translate" values="375 430;391.1 391.1;430 375;468.9 391.1;485 430;468.9 468.9;430 485;391.1 468.9;375 430" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- ======================= wheels ======================= -->
  <!-- rear wheel -->
  <g>
    <circle cx="300" cy="430" r="110" fill="none" stroke="#2e2e2e" stroke-width="11"/>
    <circle cx="300" cy="430" r="97" fill="none" stroke="#c8ccd2" stroke-width="5"/>
    <g stroke="#8f959c" stroke-width="2.5">
      <line x1="300" y1="333" x2="300" y2="527"/>
      <line x1="203" y1="430" x2="397" y2="430"/>
      <line x1="231.4" y1="361.4" x2="368.6" y2="498.6"/>
      <line x1="368.6" y1="361.4" x2="231.4" y2="498.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 300 430" to="360 300 430" dur="1.3s" repeatCount="indefinite"/>
    </g>
    <circle cx="300" cy="430" r="8" fill="#3a3a3a"/>
  </g>
  <!-- front wheel -->
  <g>
    <circle cx="620" cy="430" r="110" fill="none" stroke="#2e2e2e" stroke-width="11"/>
    <circle cx="620" cy="430" r="97" fill="none" stroke="#c8ccd2" stroke-width="5"/>
    <g stroke="#8f959c" stroke-width="2.5">
      <line x1="620" y1="333" x2="620" y2="527"/>
      <line x1="523" y1="430" x2="717" y2="430"/>
      <line x1="551.4" y1="361.4" x2="688.6" y2="498.6"/>
      <line x1="688.6" y1="361.4" x2="551.4" y2="498.6"/>
      <animateTransform attributeName="transform" type="rotate" from="0 620 430" to="360 620 430" dur="1.3s" repeatCount="indefinite"/>
    </g>
    <circle cx="620" cy="430" r="8" fill="#3a3a3a"/>
  </g>

  <!-- ======================= frame ======================= -->
  <g stroke="#d64f42" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M 430 430 L 400 306"/>
    <path d="M 400 306 L 574 300"/>
    <path d="M 430 430 L 578 304"/>
    <path d="M 300 430 L 426 428"/>
    <path d="M 300 430 L 398 310"/>
    <path d="M 574 300 L 586 342"/>
    <path d="M 584 330 L 620 430"/>
    <path d="M 574 300 L 566 276"/>
  </g>
  <path d="M 566 276 C 556 268 542 268 534 276" stroke="#333333" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="534" cy="276" r="5.5" fill="#222222"/>
  <!-- seatpost + saddle -->
  <line x1="404" y1="330" x2="399" y2="300" stroke="#555555" stroke-width="6"/>
  <path d="M 376 292 C 384 285 416 285 428 291 C 416 297 386 298 376 292 Z" fill="#3a3a3a"/>

  <!-- ======================= chain + chainring ======================= -->
  <g stroke="#4c4c4c" stroke-width="5" stroke-dasharray="7 5" fill="none">
    <path d="M 300 417 L 430 396">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.27s" repeatCount="indefinite"/>
    </path>
    <path d="M 300 443 L 430 464">
      <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="0.27s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="300" cy="430" r="13" fill="none" stroke="#4a4a4a" stroke-width="4"/>
  <circle cx="430" cy="430" r="34" fill="none" stroke="#4c4c4c" stroke-width="5"/>
  <circle cx="430" cy="430" r="7" fill="#4c4c4c"/>

  <!-- ======================= near crank ======================= -->
  <g>
    <line x1="430" y1="430" x2="485" y2="430" stroke="#b0601f" stroke-width="8" stroke-linecap="round"/>
    <circle cx="485" cy="430" r="4.5" fill="#333333"/>
    <animateTransform attributeName="transform" type="rotate" from="0 430 430" to="360 430 430" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- ======================= near leg ======================= -->
  <g stroke-linecap="round">
    <line x1="402" y1="290" x2="502.2" y2="321.4" stroke="#e8862f" stroke-width="13">
      <animate attributeName="x2" values="502.2;480.7;458.6;455.9;468.1;491.2;506.8;507;502.2" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="321.4;359.5;378.5;380.1;371.5;345.5;296.3;287.9;321.4" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
    <line x1="502.2" y1="321.4" x2="485" y2="430" stroke="#d97a26" stroke-width="11">
      <animate attributeName="x1" values="502.2;480.7;458.6;455.9;468.1;491.2;506.8;507;502.2" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y1" values="321.4;359.5;378.5;380.1;371.5;345.5;296.3;287.9;321.4" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="485;468.9;430;391.1;375;391.1;430;468.9;485" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="430;468.9;485;468.9;430;391.1;375;391.1;430" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
    </line>
  </g>
  <!-- near webbed foot -->
  <g transform="translate(485 430)">
    <path d="M -12 -5 L 14 -7 L 21 -1 L 8 1 L 17 5 L -12 5 Z" fill="#e8862f" stroke="#3d3229" stroke-width="2" stroke-linejoin="round"/>
    <animateTransform attributeName="transform" type="translate" values="485 430;468.9 468.9;430 485;391.1 468.9;375 430;391.1 391.1;430 375;468.9 391.1;485 430" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- ======================= pelican (bobs gently) ======================= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 2.5;0 0;0 -1.8;0 0" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>

    <!-- tail -->
    <path d="M 342 252 L 306 232 L 336 236 L 308 206 L 340 226 L 322 192 L 348 220 Z" fill="#e9dfc6" stroke="#3d3229" stroke-width="3" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" values="0 342 250;-7 342 250;0 342 250;5 342 250;0 342 250" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </path>

    <!-- body sitting on the saddle -->
    <path d="M 336 238 C 338 204 378 192 418 206 C 450 217 464 242 459 264 C 452 287 424 297 396 296 C 362 295 334 270 336 238 Z" fill="url(#body)" stroke="#3d3229" stroke-width="3.5"/>

    <!-- wing-arm reaching the handlebar -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 441 252;2.4 441 252;0 441 252;-2 441 252;0 441 252" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
      <path d="M 438 254 C 468 262 502 270 534 278" stroke="#3d3229" stroke-width="21" stroke-linecap="round" fill="none"/>
      <path d="M 438 254 C 468 262 502 270 534 278" stroke="#efe5cd" stroke-width="15" stroke-linecap="round" fill="none"/>
      <circle cx="534" cy="278" r="7" fill="#2f2f2f"/>
    </g>

    <!-- head assembly (bobs with the pedaling) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 448 240;2.6 448 240;0 448 240;-2 448 240;0 448 240" keyTimes="0;0.25;0.5;0.75;1" dur="2.4s" repeatCount="indefinite"/>
      <!-- neck -->
      <path d="M 447 240 C 468 226 482 204 497 182" stroke="#3d3229" stroke-width="24" fill="none" stroke-linecap="round"/>
      <path d="M 447 240 C 468 226 482 204 497 182" stroke="#f9f4e8" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- pouch -->
      <path d="M 516 171 C 546 174 602 188 632 207 C 636 210 635 216 629 216 C 598 230 552 228 528 208 C 518 199 514 184 516 171 Z" fill="#f6b352" stroke="#3d3229" stroke-width="3"/>
      <!-- head -->
      <circle cx="505" cy="168" r="21" fill="#f9f4e8" stroke="#3d3229" stroke-width="3.5"/>
      <!-- upper bill -->
      <path d="M 518 158 C 559 166 603 183 634 200 C 637 202 636 207 632 208 L 628 209 C 598 194 556 178 516 173 Z" fill="#ef9f3f" stroke="#3d3229" stroke-width="3" stroke-linejoin="round"/>
      <!-- helmet -->
      <path d="M 483 161 C 481 140 500 132 509 132 C 523 132 530 145 528 157 Z" fill="#3aa6a0" stroke="#3d3229" stroke-width="3"/>
      <path d="M 481 162 L 529 155" stroke="#2e8a85" stroke-width="5" stroke-linecap="round"/>
      <!-- eye (blinks) -->
      <g transform="translate(514 165)">
        <g>
          <animateTransform attributeName="transform" type="scale" values="1 1;1 1;0.12 1;1 1;1 1" keyTimes="0;0.4;0.44;0.48;1" dur="4s" repeatCount="indefinite"/>
          <circle r="6" fill="#ffffff" stroke="#3d3229" stroke-width="1.6"/>
          <circle cx="1.6" cy="0.4" r="3" fill="#2c241c"/>
          <circle cx="2.8" cy="-0.8" r="1" fill="#ffffff"/>
        </g>
      </g>
    </g>
  </g>
</svg>
