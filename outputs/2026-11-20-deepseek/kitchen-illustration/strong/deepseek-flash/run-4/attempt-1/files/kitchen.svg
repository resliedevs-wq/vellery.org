<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A quiet kitchen table in morning light</title>
  <desc id="desc">A flat vector kitchen scene seen from the front. Three red apples, a blue mug printed with MONDAY, and a folded newspaper with a gray cat asleep on it rest on a small wooden table. Warm sunlight enters from a window on the left. No people.</desc>

  <defs>
