      <stop offset="0" stop-color="#eee4d2"/>
      <stop offset="1" stop-color="#e5d7c1"/>
    </linearGradient>
    <linearGradient id="glassSky" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c8d9d4"/>
      <stop offset="0.55" stop-color="#dedfca"/>
      <stop offset="1" stop-color="#f4dfb6"/>
    </linearGradient>
    <linearGradient id="beamGlow" gradientUnits="userSpaceOnUse" x1="260" y1="150" x2="840" y2="760">
      <stop offset="0" stop-color="#f7dca1" stop-opacity="0.50"/>
      <stop offset="0.55" stop-color="#f6d89a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f6d89a" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="tableGrain" x1="0" y1="0" x2="1" y2="0">
