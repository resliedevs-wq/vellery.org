      <stop offset="0.45" stop-color="#5a8498"/>
      <stop offset="1" stop-color="#466f83"/>
    </linearGradient>
    <linearGradient id="catGray" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a1a19c"/>
      <stop offset="0.6" stop-color="#90918e"/>
      <stop offset="1" stop-color="#7c7f7d"/>
    </linearGradient>
