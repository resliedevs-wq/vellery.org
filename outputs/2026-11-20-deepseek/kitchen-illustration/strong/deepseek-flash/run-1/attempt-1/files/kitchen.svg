    </clipPath>
    <clipPath id="windowClip">
      <rect x="114" y="90" width="252" height="414" rx="3"/>
    </clipPath>
    <clipPath id="catBodyClip">
      <path d="M 833 516 C 836 481 872 461 915 465 C 961 469 994 491 994 520 C 994 547 959 563 916 562 C 874 561 838 548 833 516 Z"/>
    </clipPath>

    <g id="apple">
