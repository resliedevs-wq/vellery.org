  <!-- Three red apples -->
  <g aria-label="three red apples">
    <use href="#apple" transform="translate(356 547) scale(0.94)"/>
    <use href="#apple" transform="translate(438 542) scale(1.03)"/>
    <use href="#apple" transform="translate(512 547) scale(0.91)"/>
