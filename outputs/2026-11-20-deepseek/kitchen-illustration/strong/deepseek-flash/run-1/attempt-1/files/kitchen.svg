    <path d="M 796 559 L 845 559 M 796 565 L 837 565 M 796 571 L 844 571 M 952 572 L 1002 570 M 952 578 L 994 576 M 952 584 L 1000 582" fill="none" stroke="#9D9481" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
