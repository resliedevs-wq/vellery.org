<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Morning kitchen table</title>
  <desc id="desc">A flat vector scene of a small wooden kitchen table with three red apples, a blue MONDAY mug, and a folded newspaper with a gray cat asleep on top. Warm morning sunlight enters through a window on the left.</desc>

