  <rect x="0" y="700" width="1200" height="14" fill="#D8B998"/>
  <path d="M 0 714 H 1200" stroke="#A98262" stroke-width="2" opacity="0.45"/>
  <path d="M 0 760 H 1200 M 0 816 H 1200 M 0 874 H 1200" stroke="#B78F6D" stroke-width="2" opacity="0.35"/>
  <path d="M 153 714 V 900 M 372 714 V 900 M 681 714 V 900 M 934 714 V 900" stroke="#AE8767" stroke-width="2" opacity="0.2"/>

