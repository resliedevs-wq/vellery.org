      <path d="M 16 35 C 32 26 39 8 36 -8 C 44 6 41 26 27 37 C 21 42 15 44 8 44 C 11 41 13 38 16 35 Z" fill="#8E332E" opacity="0.35"/>
      <ellipse cx="-13" cy="-13" rx="8" ry="15" transform="rotate(-27 -13 -13)" fill="#E68C72" opacity="0.55"/>
