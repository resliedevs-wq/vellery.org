    <ellipse cx="832" cy="537" rx="14" ry="9" fill="#9C988F"/>
    <path d="M 803 537 Q 808 541 813 537 M 827 538 Q 832 542 837 538" fill="none" stroke="#7D7972" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

