<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Monday morning in the kitchen</title>
  <desc id="desc">Sunlight from the left window falls across a little wooden table. Three red apples sit beside a blue MONDAY mug. A gray tabby sleeps on a folded newspaper.</desc>
