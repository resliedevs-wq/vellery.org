<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbeed9"/>
      <stop offset="1" stop-color="#f1d3a8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc98a"/>
      <stop offset="1" stop-color="#fff1d6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c99a68"/>
      <stop offset="1" stop-color="#a9764a"/>
    </linearGradient>
    <pattern id="tile" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#f5e0bf"/>
      <path d="M0 15H30M15 0V15" stroke="#dcbb92" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- wall and floor -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="526" width="800" height="74" fill="url(#floor)"/>
  <g stroke="#9a6c42" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="550" x2="800" y2="550"/>
    <line x1="0" y1="578" x2="800" y2="578"/>
  </g>

  <!-- tiled backsplash -->
  <rect x="30" y="210" width="740" height="120" fill="url(#tile)"/>

  <!-- upper cabinets -->
  <rect x="40" y="90" width="280" height="120" rx="4" fill="#c9915e"/>
  <rect x="44" y="94" width="131" height="112" rx="3" fill="#d6a270" stroke="#9c6b43" stroke-width="2"/>
  <rect x="185" y="94" width="131" height="112" rx="3" fill="#d6a270" stroke="#9c6b43" stroke-width="2"/>
  <circle cx="168" cy="150" r="4" fill="#5b3a22"/>
  <circle cx="192" cy="150" r="4" fill="#5b3a22"/>

  <!-- pendant lamp -->
  <line x1="250" y1="0" x2="250" y2="48" stroke="#6b4a33" stroke-width="2"/>
  <circle cx="250" cy="82" r="18" fill="#fff3b0" opacity="0.5"/>
  <path d="M222 78 L278 78 L262 50 L238 50 Z" fill="#f7c873"/>

  <!-- wall clock (8:15) -->
  <circle cx="410" cy="160" r="30" fill="#fff8ec" stroke="#8a5a36" stroke-width="5"/>
  <line x1="410" y1="160" x2="398" y2="167" stroke="#3d2a20" stroke-width="3" stroke-linecap="round"/>
  <line x1="410" y1="160" x2="430" y2="160" stroke="#3d2a20" stroke-width="2" stroke-linecap="round"/>

  <!-- window with sunrise -->
  <rect x="480" y="80" width="240" height="220" fill="#fff8ec"/>
  <rect x="496" y="96" width="208" height="188" fill="url(#sky)"/>
  <circle cx="600" cy="150" r="60" fill="#fff3b0" opacity="0.45"/>
  <circle cx="600" cy="150" r="26" fill="#ffd166"/>
  <path d="M496 262 Q545 235 600 258 T704 252 L704 284 L496 284 Z" fill="#a7c57f"/>
  <path d="M496 272 Q560 254 620 272 T704 268 L704 284 L496 284 Z" fill="#8fb36a"/>
  <rect x="596" y="80" width="8" height="220" fill="#fff8ec"/>
  <rect x="480" y="196" width="240" height="8" fill="#fff8ec"/>
  <rect x="468" y="298" width="264" height="10" rx="3" fill="#fff8ec"/>

  <!-- herb pot on windowsill -->
  <ellipse cx="507" cy="256" rx="6" ry="14" fill="#6fa35a" transform="rotate(-30 507 256)"/>
  <ellipse cx="523" cy="254" rx="6" ry="14" fill="#7bb06a" transform="rotate(25 523 254)"/>
  <rect x="502" y="270" width="26" height="28" rx="3" fill="#c8643b"/>

  <!-- counter top and base cabinets -->
  <rect x="30" y="330" width="740" height="22" rx="3" fill="#e9d3b4"/>
  <rect x="30" y="352" width="740" height="160" fill="#b07a4c"/>
  <rect x="30" y="512" width="740" height="14" fill="#5a3c28"/>
  <g fill="none" stroke="#8a5a36" stroke-width="2">
    <rect x="38" y="362" width="154" height="140" rx="4"/>
    <rect x="462" y="362" width="130" height="140" rx="4"/>
    <rect x="600" y="362" width="162" height="140" rx="4"/>
  </g>
  <g fill="#f3e3c8">
    <circle cx="182" cy="420" r="4"/>
    <circle cx="582" cy="420" r="4"/>
    <circle cx="610" cy="420" r="4"/>
  </g>

  <!-- stove: cooktop, oven -->
  <rect x="340" y="330" width="110" height="22" fill="#2b2b30"/>
  <rect x="340" y="352" width="110" height="160" fill="#5d4032"/>
  <rect x="350" y="362" width="90" height="4" rx="2" fill="#d8d8d8"/>
  <rect x="352" y="376" width="86" height="60" rx="4" fill="#3a2a22"/>
  <rect x="356" y="380" width="78" height="52" rx="3" fill="#ffb75e" opacity="0.45"/>

  <!-- kettle on the stove -->
  <path d="M360 292 Q385 264 410 292" fill="none" stroke="#b64030" stroke-width="4"/>
  <path d="M410 300 Q426 288 434 278 L440 286 Q430 300 414 310 Z" fill="#e05d4a"/>
  <ellipse cx="385" cy="306" rx="28" ry="23" fill="#e05d4a"/>
  <circle cx="385" cy="282" r="4" fill="#b64030"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M380 262 q-7 -8 0 -16 q7 -8 0 -16"/>
    <path d="M396 258 q-7 -8 0 -16 q7 -8 0 -16"/>
  </g>

  <!-- bread on a board -->
  <rect x="480" y="316" width="120" height="14" rx="4" fill="#d9a86c"/>
  <ellipse cx="540" cy="302" rx="40" ry="16" fill="#d9953f"/>
  <path d="M520 294 Q527 288 534 296 M546 292 Q553 286 560 294" fill="none" stroke="#a8662a" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- mug of coffee -->
  <rect x="618" y="294" width="26" height="36" rx="4" fill="#e8b04b"/>
  <ellipse cx="631" cy="296" rx="12" ry="3" fill="#6b4226"/>
  <path d="M644 302 q10 0 10 10 q0 9 -10 9" fill="none" stroke="#e8b04b" stroke-width="4"/>
  <path d="M628 284 q-6 -8 0 -16 q6 -8 0 -16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- potted plant on the counter -->
  <path d="M680 296 L716 296 L712 330 L684 330 Z" fill="#c8643b"/>
  <ellipse cx="688" cy="270" rx="8" ry="24" fill="#6fa35a" transform="rotate(-25 688 270)"/>
  <ellipse cx="702" cy="262" rx="8" ry="26" fill="#5f9650" transform="rotate(10 702 262)"/>
  <ellipse cx="714" cy="272" rx="7" ry="20" fill="#6fa35a" transform="rotate(35 714 272)"/>

  <!-- morning light beam and warm tint -->
  <polygon points="496,308 704,308 790,600 400,600" fill="#fff4cc" opacity="0.2"/>
  <rect width="800" height="600" fill="#ffd27a" opacity="0.08"/>

  <!-- sleepy cat on the floor -->
  <ellipse cx="125" cy="578" rx="52" ry="9" fill="#7a4e2c" opacity="0.35"/>
  <path d="M150 570 Q188 574 182 540 Q178 522 168 526" fill="none" stroke="#4a4140" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="120" cy="532" rx="34" ry="44" fill="#4a4140"/>
  <circle cx="120" cy="488" r="22" fill="#4a4140"/>
  <polygon points="102,480 104,452 120,470" fill="#4a4140"/>
  <polygon points="138,480 136,452 120,470" fill="#4a4140"/>
  <path d="M111 490 Q115 494 119 490 M121 490 Q125 494 129 490" fill="none" stroke="#1e1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
