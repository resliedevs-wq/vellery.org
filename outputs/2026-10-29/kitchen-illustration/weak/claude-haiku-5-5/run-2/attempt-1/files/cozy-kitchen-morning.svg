<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>A cozy kitchen in the morning</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9DCEB"/>
      <stop offset="1" stop-color="#FFE3B0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFF6D0" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="tile" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#F7EFE3"/>
      <path d="M0 0 H40 M0 0 V40" stroke="#E2D2BA" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- wall -->
  <rect width="800" height="600" fill="#FBEBD5"/>

  <!-- backsplash tiles -->
  <rect x="0" y="322" width="800" height="58" fill="url(#tile)"/>

  <!-- upper cabinets -->
  <rect x="590" y="70" width="210" height="130" rx="6" fill="#E9D2B0" stroke="#C9A97E" stroke-width="3"/>
  <line x1="695" y1="70" x2="695" y2="200" stroke="#C9A97E" stroke-width="3"/>
  <circle cx="683" cy="180" r="4" fill="#8B5E3C"/>
  <circle cx="707" cy="180" r="4" fill="#8B5E3C"/>

  <!-- open shelf with jars -->
  <rect x="20" y="110" width="200" height="12" rx="3" fill="#A0724A"/>
  <rect x="40" y="70" width="40" height="40" rx="6" fill="#E9B872"/>
  <rect x="40" y="64" width="40" height="8" rx="2" fill="#8B5E3C"/>
  <rect x="95" y="78" width="34" height="32" rx="6" fill="#C98B6B"/>
  <rect x="95" y="72" width="34" height="8" rx="2" fill="#8B5E3C"/>
  <rect x="145" y="66" width="44" height="44" rx="6" fill="#A7C7A0"/>
  <rect x="145" y="60" width="44" height="8" rx="2" fill="#8B5E3C"/>

  <!-- window -->
  <rect x="250" y="70" width="300" height="240" rx="10" fill="#8B5E3C"/>
  <rect x="266" y="86" width="268" height="208" fill="url(#sky)"/>
  <circle cx="400" cy="220" r="72" fill="#FFF3C4" opacity="0.5"/>
  <circle cx="400" cy="220" r="36" fill="#FFE58A"/>
  <ellipse cx="310" cy="130" rx="30" ry="10" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="500" cy="150" rx="24" ry="8" fill="#FFFFFF" opacity="0.8"/>
  <rect x="397" y="86" width="6" height="208" fill="#8B5E3C"/>
  <rect x="266" y="186" width="268" height="6" fill="#8B5E3C"/>
  <rect x="236" y="308" width="328" height="14" rx="4" fill="#A0724A"/>

  <!-- sill plants -->
  <rect x="286" y="276" width="30" height="32" rx="4" fill="#D9825B"/>
  <ellipse cx="290" cy="262" rx="10" ry="20" fill="#6FA06B" transform="rotate(-25 290 262)"/>
  <ellipse cx="312" cy="258" rx="10" ry="22" fill="#7DB574" transform="rotate(20 312 258)"/>
  <ellipse cx="301" cy="250" rx="9" ry="18" fill="#5E9461"/>
  <rect x="488" y="284" width="24" height="24" rx="4" fill="#E8A87C"/>
  <ellipse cx="496" cy="276" rx="6" ry="13" fill="#8FBF7F" transform="rotate(-20 496 276)"/>
  <ellipse cx="506" cy="274" rx="6" ry="13" fill="#8FBF7F" transform="rotate(18 506 274)"/>

  <!-- lower cabinets -->
  <rect x="0" y="400" width="800" height="120" fill="#A7B99A"/>
  <rect x="20" y="410" width="170" height="100" rx="4" fill="none" stroke="#8A9C7C" stroke-width="3"/>
  <rect x="210" y="410" width="170" height="100" rx="4" fill="none" stroke="#8A9C7C" stroke-width="3"/>
  <rect x="420" y="410" width="170" height="100" rx="4" fill="none" stroke="#8A9C7C" stroke-width="3"/>
  <rect x="610" y="410" width="170" height="100" rx="4" fill="none" stroke="#8A9C7C" stroke-width="3"/>
  <circle cx="176" cy="422" r="4" fill="#F3E3C3"/>
  <circle cx="366" cy="422" r="4" fill="#F3E3C3"/>
  <circle cx="576" cy="422" r="4" fill="#F3E3C3"/>
  <circle cx="766" cy="422" r="4" fill="#F3E3C3"/>

  <!-- countertop -->
  <rect x="0" y="380" width="800" height="20" rx="3" fill="#C49A6C"/>

  <!-- floor -->
  <rect x="0" y="520" width="800" height="80" fill="#C8956A"/>
  <line x1="0" y1="545" x2="800" y2="545" stroke="#B07F55" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="575" x2="800" y2="575" stroke="#B07F55" stroke-width="2" opacity="0.6"/>

  <!-- morning light falling from the window -->
  <polygon points="266,310 534,310 640,520 160,520" fill="url(#beam)"/>

  <!-- copper kettle -->
  <path d="M 110 330 Q 130 304 150 330" stroke="#8B5E3C" stroke-width="5" fill="none"/>
  <path d="M 96 356 Q 80 342 84 330 Q 92 344 104 350 Z" fill="#D08C60"/>
  <ellipse cx="130" cy="352" rx="34" ry="28" fill="#D08C60"/>
  <ellipse cx="120" cy="345" rx="5" ry="10" fill="#F0B88E" opacity="0.6"/>
  <ellipse cx="130" cy="326" rx="12" ry="4" fill="#B5714A"/>

  <!-- sleepy cat -->
  <ellipse cx="95" cy="570" rx="50" ry="28" fill="#6B5B53"/>
  <circle cx="60" cy="548" r="22" fill="#6B5B53"/>
  <polygon points="44,534 46,510 62,528" fill="#6B5B53"/>
  <polygon points="60,528 76,510 78,536" fill="#6B5B53"/>
  <path d="M 50 552 q 5 4 10 0 M 64 552 q 5 4 10 0" stroke="#3A2F2A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 140 578 Q 172 586 162 556" stroke="#6B5B53" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- table -->
  <rect x="200" y="488" width="12" height="112" fill="#9A6E47"/>
  <rect x="568" y="488" width="12" height="112" fill="#9A6E47"/>
  <rect x="180" y="470" width="440" height="18" rx="6" fill="#B9865A"/>

  <!-- toast on a plate -->
  <ellipse cx="300" cy="466" rx="70" ry="12" fill="#FFFDF8" stroke="#E6DCCB" stroke-width="2"/>
  <rect x="270" y="440" width="60" height="30" rx="8" fill="#E8B86D"/>
  <rect x="276" y="446" width="48" height="18" rx="6" fill="#F3D08F"/>
  <rect x="296" y="440" width="16" height="8" rx="2" fill="#FFF1A8"/>

  <!-- jam jar -->
  <rect x="380" y="426" width="36" height="44" rx="6" fill="#B8405A"/>
  <rect x="378" y="420" width="40" height="8" rx="2" fill="#D9A441"/>

  <!-- coffee mug with steam -->
  <rect x="470" y="416" width="50" height="54" rx="8" fill="#7FB7BE"/>
  <path d="M 520 430 q 16 0 16 16 q 0 16 -16 16" stroke="#7FB7BE" stroke-width="6" fill="none"/>
  <ellipse cx="495" cy="416" rx="23" ry="5" fill="#6B4226"/>
  <path d="M 488 402 Q 480 392 488 382 T 488 362 M 506 402 Q 498 392 506 382 T 506 362" stroke="#B8A58C" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- flower vase -->
  <path d="M 615 432 Q 600 412 598 392 M 615 432 Q 628 412 632 394 M 615 432 L 615 388" stroke="#6FA06B" stroke-width="3" fill="none"/>
  <path d="M 596 470 L 604 432 L 626 432 L 634 470 Z" fill="#8FB8C9"/>
  <circle cx="598" cy="388" r="9" fill="#F28DA0"/>
  <circle cx="632" cy="390" r="9" fill="#FFD166"/>
  <circle cx="615" cy="378" r="8" fill="#F7A8B8"/>
  <circle cx="615" cy="378" r="3" fill="#FFF2A8"/>
</svg>
