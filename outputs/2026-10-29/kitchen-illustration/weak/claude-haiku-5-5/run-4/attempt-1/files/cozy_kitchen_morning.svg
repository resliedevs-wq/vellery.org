  <path d="M664 572 Q712 540 740 566 Q748 580 728 580" stroke="#7d7470" stroke-width="8" fill="none" stroke-linecap="round"/>
  <ellipse cx="660" cy="575" rx="58" ry="22" fill="#7d7470"/>
  <circle cx="606" cy="562" r="17" fill="#7d7470"/>
  <polygon points="593,552 594,534 606,547" fill="#7d7470"/>
  <polygon points="610,547 620,534 620,552" fill="#7d7470"/>
