  <line x1="600" y1="396" x2="600" y2="540" stroke="#77a392" stroke-width="3"/>
  <circle cx="185" cy="420" r="4" fill="#f2d28a"/>
  <circle cx="215" cy="420" r="4" fill="#f2d28a"/>
  <circle cx="385" cy="420" r="4" fill="#f2d28a"/>
  <circle cx="415" cy="420" r="4" fill="#f2d28a"/>
