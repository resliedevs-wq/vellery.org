<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe9cf"/>
      <stop offset="1" stop-color="#f3d6b0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59e"/>
      <stop offset="0.55" stop-color="#ffe9c4"/>
      <stop offset="1" stop-color="#cfe8f0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8"/>
      <stop offset="0.5" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c98d5a"/>
      <stop offset="1" stop-color="#a86d3f"/>
    </linearGradient>
    <linearGradient id="counterTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe6"/>
      <stop offset="1" stop-color="#ddd3c3"/>
    </linearGradient>
    <linearGradient id="kettle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c94f3d"/>
      <stop offset="0.4" stop-color="#e8705a"/>
      <stop offset="1" stop-color="#a83a2c"/>
    </linearGradient>
    <pattern id="tiles" width="30" height="20" patternUnits="userSpaceOnUse">
      <rect width="30" height="20" fill="#e9f1ee"/>
      <path d="M0 0H30M0 0V20" stroke="#cbd9d3" stroke-width="2"/>
    </pattern>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fdf7ee"/>
      <rect width="12" height="12" fill="#e98a7a"/>
      <rect x="12" y="12" width="12" height="12" fill="#e98a7a"/>
    </pattern>
  </defs>

  <!-- Wall -->
  <rect width="900" height="650" fill="url(#wall)"/>

  <!-- Floor -->
  <rect y="520" width="900" height="130" fill="url(#floor)"/>
  <g stroke="#9a6236" stroke-width="2" opacity="0.6">
    <line x1="0" y1="560" x2="900" y2="560"/>
    <line x1="0" y1="605" x2="900" y2="605"/>
    <line x1="120" y1="520" x2="120" y2="560"/><line x1="340" y1="520" x2="340" y2="560"/>
    <line x1="230" y1="560" x2="230" y2="605"/><line x1="470" y1="560" x2="470" y2="605"/>
    <line x1="80" y1="605" x2="80" y2="650"/><line x1="390" y1="605" x2="390" y2="650"/>
  </g>

  <!-- Window -->
  <g>
    <rect x="300" y="60" width="300" height="230" rx="6" fill="#fff" />
    <rect x="312" y="72" width="276" height="206" fill="url(#sky)"/>
    <circle cx="470" cy="200" r="80" fill="url(#sun)"/>
    <circle cx="470" cy="200" r="28" fill="#fff4cf"/>
    <!-- hills -->
    <path d="M312 240 Q380 200 450 235 T588 225 V278 H312Z" fill="#a9c99a"/>
    <path d="M312 258 Q400 232 480 255 T588 250 V278 H312Z" fill="#8bb37c"/>
    <!-- clouds -->
    <g fill="#fffaf0" opacity="0.9">
      <ellipse cx="360" cy="115" rx="26" ry="10"/><ellipse cx="380" cy="108" rx="18" ry="11"/>
      <ellipse cx="540" cy="135" rx="22" ry="8"/><ellipse cx="555" cy="129" rx="14" ry="9"/>
    </g>
    <!-- birds -->
    <g stroke="#7a5a48" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M410 120 q6 -6 12 0 q6 -6 12 0"/>
      <path d="M445 105 q4 -4 8 0 q4 -4 8 0"/>
    </g>
    <!-- mullions -->
    <rect x="445" y="72" width="10" height="206" fill="#fff"/>
    <rect x="312" y="170" width="276" height="8" fill="#fff"/>
    <!-- sill -->
    <rect x="290" y="286" width="320" height="14" rx="3" fill="#f7f1e6"/>
    <!-- curtains -->
    <path d="M285 45 H345 Q330 140 350 230 Q320 250 290 240 Q300 140 285 45Z" fill="#f2a490"/>
    <path d="M615 45 H555 Q570 140 550 230 Q580 250 610 240 Q600 140 615 45Z" fill="#f2a490"/>
    <g stroke="#e38b76" stroke-width="2" fill="none" opacity="0.7">
      <path d="M305 55 Q300 150 305 235"/><path d="M325 55 Q318 150 325 238"/>
      <path d="M595 55 Q600 150 595 235"/><path d="M575 55 Q582 150 575 238"/>
    </g>
    <rect x="270" y="38" width="360" height="10" rx="5" fill="#8a5a3b"/>
    <circle cx="270" cy="43" r="8" fill="#8a5a3b"/><circle cx="630" cy="43" r="8" fill="#8a5a3b"/>
    <!-- potted plants on sill -->
    <path d="M330 270 h30 l-4 18 h-22z" fill="#d9825b"/>
    <g fill="#6fa36a"><ellipse cx="338" cy="262" rx="6" ry="12" transform="rotate(-25 338 262)"/><ellipse cx="346" cy="256" rx="6" ry="14"/><ellipse cx="354" cy="262" rx="6" ry="12" transform="rotate(25 354 262)"/></g>
    <path d="M540 272 h26 l-3 16 h-20z" fill="#e7c36b"/>
    <g fill="#88b874"><circle cx="546" cy="264" r="7"/><circle cx="558" cy="262" r="8"/><circle cx="552" cy="254" r="7"/></g>
  </g>

  <!-- Sunbeams -->
  <polygon points="312,72 588,72 900,520 160,520" fill="url(#beam)" opacity="0.5"/>

  <!-- Upper shelf left -->
  <g>
    <rect x="40" y="150" width="210" height="10" fill="#8a5a3b"/>
    <path d="M60 160 l10 18 h-10z M220 160 l-10 18 h10z" fill="#7a4c30"/>
    <!-- jars -->
    <rect x="55" y="105" width="32" height="45" rx="6" fill="#f8f1e3" stroke="#d8c8ae" stroke-width="2"/>
    <rect x="55" y="98" width="32" height="10" rx="3" fill="#b88458"/>
    <rect x="58" y="125" width="26" height="22" rx="4" fill="#f1d9a5"/>
    <rect x="97" y="115" width="28" height="35" rx="6" fill="#f8f1e3" stroke="#d8c8ae" stroke-width="2"/>
    <rect x="97" y="109" width="28" height="9" rx="3" fill="#b88458"/>
    <rect x="100" y="128" width="22" height="19" rx="3" fill="#7a4a2e"/>
    <!-- stacked cups -->
    <path d="M140 150 v-22 h30 v22z" fill="#9cc6c0"/>
    <path d="M170 134 q12 0 10 10 q-2 6 -10 4" fill="none" stroke="#9cc6c0" stroke-width="4"/>
    <!-- small plant -->
    <path d="M195 150 l-4 -20 h28 l-4 20z" fill="#e98a7a"/>
    <g stroke="#5f9a5c" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M205 130 q-20 10 -25 40"/><path d="M205 130 q-8 20 -10 50"/><path d="M205 130 q15 15 12 45"/>
    </g>
    <g fill="#6fa36a"><circle cx="182" cy="160" r="4"/><circle cx="196" cy="172" r="4"/><circle cx="216" cy="168" r="4"/><circle cx="185" cy="146" r="4"/></g>
  </g>

  <!-- Hanging utensils right -->
  <g>
    <rect x="660" y="120" width="190" height="6" rx="3" fill="#a77b52"/>
    <g stroke="#7f6a5a" stroke-width="2">
      <line x1="690" y1="126" x2="690" y2="140"/><line x1="735" y1="126" x2="735" y2="140"/>
      <line x1="780" y1="126" x2="780" y2="140"/><line x1="822" y1="126" x2="822" y2="140"/>
    </g>
    <!-- ladle -->
    <rect x="687" y="140" width="6" height="60" rx="3" fill="#b9b2a8"/>
    <path d="M675 200 a15 12 0 0 0 30 0z" fill="#b9b2a8"/>
    <!-- whisk -->
    <rect x="732" y="140" width="6" height="30" rx="3" fill="#8a5a3b"/>
    <path d="M735 170 q-14 30 0 45 q14 -15 0 -45 M735 170 q-6 30 0 45 q6 -15 0 -45" fill="none" stroke="#b9b2a8" stroke-width="2"/>
    <!-- pan -->
    <rect x="777" y="140" width="6" height="40" rx="3" fill="#3f3a36"/>
    <circle cx="780" cy="205" r="26" fill="#3f3a36"/>
    <circle cx="780" cy="205" r="19" fill="#57504a"/>
    <!-- spatula -->
    <rect x="819" y="140" width="6" height="45" rx="3" fill="#8a5a3b"/>
    <rect x="811" y="185" width="22" height="26" rx="4" fill="#d9a46a"/>
  </g>

  <!-- Backsplash -->
  <rect x="0" y="320" width="900" height="70" fill="url(#tiles)"/>

  <!-- Counter -->
  <rect x="0" y="388" width="900" height="16" fill="url(#counterTop)"/>
  <rect x="0" y="404" width="900" height="116" fill="#7fae9f"/>
  <g fill="#6f9c8e">
    <rect x="20" y="415" width="160" height="95" rx="4"/><rect x="200" y="415" width="160" height="95" rx="4"/>
    <rect x="540" y="415" width="160" height="95" rx="4"/><rect x="720" y="415" width="160" height="95" rx="4"/>
  </g>
  <!-- oven -->
  <rect x="380" y="410" width="140" height="105" rx="4" fill="#ece5d8"/>
  <rect x="392" y="440" width="116" height="62" rx="4" fill="#3d3632"/>
  <rect x="400" y="448" width="100" height="46" rx="3" fill="#5a4f48"/>
  <rect x="395" y="420" width="110" height="5" rx="2" fill="#c7bba8"/>
  <g fill="#e2c38a"><rect x="168" y="455" width="4" height="18" rx="2"/><rect x="208" y="455" width="4" height="18" rx="2"/><rect x="688" y="455" width="4" height="18" rx="2"/><rect x="728" y="455" width="4" height="18" rx="2"/></g>
  <!-- stove burners -->
  <ellipse cx="420" cy="388" rx="22" ry="4" fill="#3d3632"/>
  <ellipse cx="480" cy="388" rx="22" ry="4" fill="#3d3632"/>

  <!-- Kettle on stove -->
  <g>
    <path d="M392 386 Q388 330 420 325 Q452 330 448 386Z" fill="url(#kettle)"/>
    <ellipse cx="420" cy="325" rx="12" ry="4" fill="#a83a2c"/>
    <circle cx="420" cy="319" r="4" fill="#3f3a36"/>
    <path d="M400 335 Q420 295 440 335" fill="none" stroke="#3f3a36" stroke-width="5" stroke-linecap="round"/>
    <path d="M446 360 Q470 352 474 332 l6 2 Q474 362 446 372Z" fill="#c94f3d"/>
    <ellipse cx="408" cy="350" rx="5" ry="14" fill="#fff" opacity="0.35"/>
    <!-- steam -->
    <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <path d="M478 326 q-10 -15 2 -28 q12 -13 0 -30">
        <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3s" repeatCount="indefinite"/>
      </path>
      <path d="M490 318 q-8 -12 3 -24 q10 -12 0 -26" stroke-width="4" opacity="0.6">
        <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Bread board -->
  <g>
    <rect x="60" y="378" width="140" height="12" rx="5" fill="#b5804f"/>
    <circle cx="205" cy="384" r="7" fill="none" stroke="#b5804f" stroke-width="4"/>
    <path d="M75 378 Q80 340 125 340 Q170 340 175 378Z" fill="#d79a52"/>
    <g stroke="#b9772f" stroke-width="3" stroke-linecap="round"><line x1="100" y1="352" x2="108" y2="346"/><line x1="122" y1="349" x2="130" y2="343"/><line x1="144" y1="352" x2="152" y2="346"/></g>
    <!-- slice -->
    <path d="M182 378 v-26 q0 -8 8 -8 q8 0 8 8 v26z" fill="#f3d8a2" stroke="#d79a52" stroke-width="3"/>
  </g>

  <!-- Coffee mug + french press -->
  <g>
    <rect x="590" y="320" width="40" height="68" rx="4" fill="#d6e9ef" opacity="0.7" stroke="#8a7f74" stroke-width="2"/>
    <rect x="593" y="340" width="34" height="46" rx="3" fill="#5a3824"/>
    <rect x="586" y="312" width="48" height="10" rx="3" fill="#3f3a36"/>
    <rect x="608" y="300" width="4" height="14" fill="#3f3a36"/><circle cx="610" cy="298" r="5" fill="#3f3a36"/>
    <path d="M630 335 q18 0 18 22 q0 22 -18 22" fill="none" stroke="#3f3a36" stroke-width="5"/>

    <rect x="660" y="350" width="40" height="38" rx="6" fill="#f2b84b"/>
    <path d="M700 358 q16 0 14 14 q-2 10 -14 8" fill="none" stroke="#f2b84b" stroke-width="5"/>
    <ellipse cx="680" cy="352" rx="18" ry="4" fill="#6b4226"/>
    <path d="M668 352 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 l-6 7z" fill="#f2e4c8" opacity="0.8"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M674 342 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M686 342 q-6 -8 0 -16 q6 -8 0 -16"/>
    </g>
  </g>

  <!-- Fruit bowl -->
  <g>
    <circle cx="770" cy="368" r="11" fill="#f08c3a"/>
    <circle cx="792" cy="364" r="12" fill="#e9564a"/>
    <path d="M792 352 l3 -6" stroke="#6b4226" stroke-width="2"/>
    <ellipse cx="800" cy="360" rx="5" ry="2.5" fill="#6fa36a" transform="rotate(-20 800 360)"/>
    <circle cx="814" cy="370" r="10" fill="#f6d04d"/>
    <path d="M752 372 h80 q-6 18 -40 18 q-34 0 -40 -18z" fill="#4f8fa3"/>
    <path d="M760 378 h64" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Wall clock -->
  <g>
    <circle cx="780" cy="60" r="34" fill="#fffaf0" stroke="#8a5a3b" stroke-width="6"/>
    <g stroke="#8a5a3b" stroke-width="3" stroke-linecap="round">
      <line x1="780" y1="32" x2="780" y2="38"/><line x1="780" y1="82" x2="780" y2="88"/>
      <line x1="752" y1="60" x2="758" y2="60"/><line x1="802" y1="60" x2="808" y2="60"/>
      <line x1="780" y1="60" x2="772" y2="74"/> <!-- hour hand: 7 o'clock -->
      <line x1="780" y1="60" x2="780" y2="38" stroke-width="2"/>
    </g>
    <circle cx="780" cy="60" r="3" fill="#8a5a3b"/>
  </g>

  <!-- Hanging pendant lamp -->
  <g>
    <line x1="140" y1="0" x2="140" y2="50" stroke="#3f3a36" stroke-width="2"/>
    <path d="M115 72 Q115 50 140 50 Q165 50 165 72Z" fill="#f2b84b"/>
    <ellipse cx="140" cy="74" rx="6" ry="4" fill="#fff4cf"/>
  </g>

  <!-- Breakfast table in foreground -->
  <g>
    <ellipse cx="450" cy="640" rx="260" ry="18" fill="#000" opacity="0.12"/>
    <rect x="200" y="560" width="500" height="18" fill="url(#checks)"/>
    <path d="M200 560 h500 l-10 -20 h-480z" fill="url(#checks)"/>
    <path d="M210 578 l14 34 h452 l14 -34z" fill="#f6a593" opacity="0.6"/>
    <!-- plate with eggs -->
    <ellipse cx="330" cy="548" rx="56" ry="12" fill="#fffdf8" stroke="#e1d6c4" stroke-width="2"/>
    <ellipse cx="315" cy="545" rx="20" ry="7" fill="#fff"/>
    <ellipse cx="318" cy="544" rx="7" ry="4" fill="#f6b42b"/>
    <ellipse cx="348" cy="548" rx="18" ry="6" fill="#fff"/>
    <ellipse cx="350" cy="547" rx="6" ry="3.5" fill="#f6b42b"/>
    <!-- orange juice -->
    <rect x="420" y="508" width="26" height="42" rx="4" fill="#ffffff" opacity="0.6" stroke="#cfc6b8" stroke-width="2"/>
    <rect x="423" y="518" width="20" height="30" rx="2" fill="#f7a234"/>
    <!-- mug -->
    <rect x="490" y="512" width="34" height="38" rx="5" fill="#e98a7a"/>
    <path d="M524 520 q14 0 12 12 q-2 8 -12 7" fill="none" stroke="#e98a7a" stroke-width="5"/>
    <ellipse cx="507" cy="514" rx="15" ry="3" fill="#6b4226"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.85">
      <path d="M502 506 q-6 -8 0 -16 q6 -8 0 -16"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></path>
      <path d="M513 506 q-6 -8 0 -16 q6 -8 0 -16"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/></path>
    </g>
    <!-- small vase with flowers -->
    <path d="M590 550 q-12 -14 0 -32 h12 q12 18 0 32z" fill="#9cc6c0"/>
    <g stroke="#5f9a5c" stroke-width="2"><line x1="596" y1="518" x2="586" y2="488"/><line x1="596" y1="518" x2="598" y2="482"/><line x1="596" y1="518" x2="610" y2="490"/></g>
    <g fill="#fff3c4"><circle cx="586" cy="486" r="6"/><circle cx="598" cy="480" r="6"/><circle cx="611" cy="488" r="6"/></g>
    <g fill="#f2b84b"><circle cx="586" cy="486" r="2.5"/><circle cx="598" cy="480" r="2.5"/><circle cx="611" cy="488" r="2.5"/></g>
  </g>

  <!-- Sleepy cat on the floor -->
  <g>
    <ellipse cx="800" cy="600" rx="60" ry="8" fill="#000" opacity="0.12"/>
    <path d="M745 598 Q745 555 795 552 Q845 552 850 598Z" fill="#f0a35e"/>
    <path d="M845 595 q30 4 22 -20" fill="none" stroke="#f0a35e" stroke-width="10" stroke-linecap="round"/>
    <circle cx="760" cy="578" r="22" fill="#f0a35e"/>
    <path d="M744 565 l-4 -18 l14 10z M770 558 l8 -16 l4 18z" fill="#f0a35e"/>
    <path d="M746 563 l-2 -9 l7 5z M773 557 l4 -8 l2 9z" fill="#f7c8a8"/>
    <g stroke="#5a3824" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M748 578 q4 4 8 0"/><path d="M764 578 q4 4 8 0"/>
      <path d="M758 586 q2 2 4 0"/>
    </g>
    <g stroke="#d9874a" stroke-width="4" stroke-linecap="round"><line x1="795" y1="560" x2="800" y2="575"/><line x1="812" y1="560" x2="815" y2="576"/><line x1="828" y1="565" x2="830" y2="580"/></g>
    <text x="790" y="540" font-family="Georgia, serif" font-size="16" fill="#8a7f74" opacity="0.8">z</text>
    <text x="802" y="526" font-family="Georgia, serif" font-size="12" fill="#8a7f74" opacity="0.6">z</text>
  </g>

  <!-- Dust motes in sunlight -->
  <g fill="#fff8dc">
    <circle cx="380" cy="330" r="2"><animate attributeName="cy" values="330;318;330" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="300" r="1.5"><animate attributeName="cy" values="300;290;300" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="430" r="2"><animate attributeName="cy" values="430;418;430" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="460" r="1.5"><animate attributeName="cy" values="460;450;460" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
</svg>
