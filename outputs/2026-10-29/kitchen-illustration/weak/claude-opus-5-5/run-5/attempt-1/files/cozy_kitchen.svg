    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#fff8d8" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffe9a8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
