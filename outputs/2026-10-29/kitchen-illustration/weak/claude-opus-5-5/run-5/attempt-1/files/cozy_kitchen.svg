    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2c2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff2c2" stop-opacity="0"/>
