  <!-- sun beams across room -->
  <g>
    <polygon points="312,72 488,72 800,400 520,520" fill="url(#beam)" opacity="0.55"/>
    <polygon points="312,160 400,248 640,600 380,600" fill="url(#beam)" opacity="0.35"/>
    <!-- window light patch on floor -->
    <g fill="#fff3b8" opacity="0.38">
