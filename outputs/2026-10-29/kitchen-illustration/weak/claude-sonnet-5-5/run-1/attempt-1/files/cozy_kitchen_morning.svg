<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="1" stop-color="#f7d9a8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/>
      <stop offset="1" stop-color="#ffe7b8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c88f5a"/>
      <stop offset="1" stop-color="#a8703f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.45" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a0" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- wall -->
  <rect width="800" height="420" fill="url(#wall)"/>
