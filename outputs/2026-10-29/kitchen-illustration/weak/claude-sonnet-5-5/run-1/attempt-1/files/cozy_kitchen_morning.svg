    <circle cx="450" cy="115" r="16" fill="#fff8d8"/>
    <path d="M312 215 Q370 175 420 205 T488 190 V248 H312Z" fill="#a9d29a"/>
    <path d="M312 232 Q380 205 440 228 T488 220 V248 H312Z" fill="#86bb78"/>
    <!-- cloud -->
    <g fill="#fff" opacity="0.9">
