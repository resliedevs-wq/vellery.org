    <path d="M574 431 q10 2 0 12" stroke="#5e95a4" stroke-width="3.5" fill="none"/>
    <ellipse cx="563" cy="428" rx="10" ry="3" fill="#5a3a20"/>
    <path d="M559 420 q-5 -9 0 -16 q4 -7 0 -14" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.7"/>
