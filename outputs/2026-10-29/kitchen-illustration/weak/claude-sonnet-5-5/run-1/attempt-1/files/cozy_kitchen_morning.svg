      <rect x="116" y="112" width="14" height="14" rx="3" fill="#c0603b"/>
      <rect x="148" y="90" width="28" height="40" rx="5" fill="#fff6e4" stroke="#d9c7a3"/>
      <rect x="146" y="84" width="32" height="8" rx="3" fill="#b9854f"/>
      <rect x="153" y="106" width="18" height="20" rx="3" fill="#8bb46a"/>
