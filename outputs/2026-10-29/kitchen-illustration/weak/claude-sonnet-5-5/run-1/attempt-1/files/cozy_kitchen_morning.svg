    <rect x="40" y="290" width="720" height="70" fill="#f4ead8"/>
    <g stroke="#e0d2b8" stroke-width="1.5">
      <path d="M40 313H760M40 336H760"/>
      <path d="M70 290V313M130 290V313M190 290V313M250 290V313M310 290V313M370 290V313M430 290V313M490 290V313M550 290V313M610 290V313M670 290V313M730 290V313"/>
      <path d="M100 313V336M160 313V336M220 313V336M280 313V336M340 313V336M400 313V336M460 313V336M520 313V336M580 313V336M640 313V336M700 313V336"/>
      <path d="M70 336V360M130 336V360M190 336V360M250 336V360M310 336V360M370 336V360M430 336V360M490 336V360M550 336V360M610 336V360M670 336V360M730 336V360"/>
    </g>
  </g>

  <!-- floor -->
  <rect y="420" width="800" height="180" fill="url(#floor)"/>
  <g stroke="#94602f" stroke-width="2" opacity="0.5">
    <path d="M0 460H800M0 505H800M0 555H800"/>
    <path d="M120 420V460M300 420V460M520 420V460M690 420V460M60 460V505M220 460V505M410 460V505M600 460V505M760 460V505M140 505V555M330 505V555M520 505V555M700 505V555M40 555V600M260 555V600M450 555V600M640 555V600"/>
  </g>

  <!-- window -->
  <g>
    <rect x="300" y="60" width="200" height="200" rx="6" fill="#fff" stroke="#fff" stroke-width="0"/>
    <rect x="312" y="72" width="176" height="176" fill="url(#sky)"/>
