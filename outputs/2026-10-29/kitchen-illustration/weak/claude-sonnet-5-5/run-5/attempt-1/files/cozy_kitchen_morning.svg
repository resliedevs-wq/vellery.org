<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe8c8"/>
      <stop offset="1" stop-color="#f6d7a8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d6f0"/>
      <stop offset="0.6" stop-color="#fde2b8"/>
      <stop offset="1" stop-color="#ffd0a0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c58f5c"/>
      <stop offset="1" stop-color="#a87245"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="1" stop-color="#ffe9a0"/>
    </radialGradient>
    <clipPath id="win"><rect x="290" y="90" width="220" height="190" rx="6"/></clipPath>
  </defs>

  <!-- wall -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- backsplash tiles -->
  <g stroke="#e9c99a" stroke-width="1.5" fill="#fff6e6">
    <rect x="0" y="300" width="800" height="110"/>
  </g>
  <g stroke="#e3c08c" stroke-width="1.5">
    <path d="M0 327H800M0 355H800M0 383H800"/>
    <path d="M40 300V327M120 300V327M200 300V327M280 300V327M360 300V327M440 300V327M520 300V327M600 300V327M680 300V327M760 300V327
             M0 327V355M80 327V355M160 327V355M240 327V355M320 327V355M400 327V355M480 327V355M560 327V355M640 327V355M720 327V355
             M40 355V383M120 355V383M200 355V383M280 355V383M360 355V383M440 355V383M520 355V383M600 355V383M680 355V383M760 355V383
             M0 383V410M80 383V410M160 383V410M240 383V410M320 383V410M400 383V410M480 383V410M560 383V410M640 383V410M720 383V410"/>
  </g>

  <!-- window -->
  <rect x="278" y="78" width="244" height="214" rx="10" fill="#f3e2c4" stroke="#d8b98a" stroke-width="3"/>
  <g clip-path="url(#win)">
    <rect x="290" y="90" width="220" height="190" fill="url(#sky)"/>
    <circle cx="470" cy="215" r="55" fill="url(#sun)" opacity="0.9"/>
    <circle cx="470" cy="215" r="28" fill="#fffbe0"/>
    <!-- distant hills -->
    <path d="M290 245 Q340 215 390 240 T510 232 V280 H290Z" fill="#a9c79a"/>
    <path d="M290 262 Q350 240 410 258 T510 255 V280 H290Z" fill="#86ad7c"/>
    <!-- clouds -->
    <g fill="#fff" opacity="0.85">
      <ellipse cx="340" cy="130" rx="30" ry="9"/><ellipse cx="360" cy="124" rx="20" ry="9"/>
      <ellipse cx="450" cy="160" rx="26" ry="7"/><ellipse cx="466" cy="155" rx="16" ry="7"/>
    </g>
    <!-- birds -->
    <path d="M395 120q6-7 12 0q6-7 12 0" stroke="#6b5a4a" stroke-width="1.6" fill="none"/>
  </g>
  <!-- window frame -->
  <g stroke="#f3e2c4" stroke-width="8"><path d="M400 90V280M290 185H510"/></g>
  <rect x="290" y="90" width="220" height="190" rx="6" fill="none" stroke="#d8b98a" stroke-width="2"/>
  <!-- sill -->
  <rect x="268" y="290" width="264" height="12" rx="4" fill="#e6c9a0"/>
  <!-- curtains -->
  <path d="M278 78 Q300 160 282 292 H252 V78Z" fill="#f2a98f"/>
  <path d="M522 78 Q500 160 518 292 H548 V78Z" fill="#f2a98f"/>
  <path d="M262 80V290M270 80V290M538 80V290M530 80V290" stroke="#e08f74" stroke-width="2"/>
  <rect x="236" y="70" width="328" height="8" rx="4" fill="#9c6b45"/>

  <!-- herb pots on sill -->
  <g>
    <rect x="300" y="268" width="26" height="22" rx="3" fill="#d9774f"/>
    <path d="M313 268q-14-22-4-30M313 268q0-26 6-34M313 268q12-18 18-22" stroke="#5c9a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="340" y="272" width="24" height="18" rx="3" fill="#7fb0b8"/>
    <circle cx="346" cy="264" r="8" fill="#6fae58"/><circle cx="356" cy="262" r="9" fill="#5c9a4a"/><circle cx="352" cy="256" r="7" fill="#7cbf64"/>
  </g>

  <!-- sunbeam -->
  <polygon points="300,100 500,100 760,520 420,520" fill="url(#beam)"/>

  <!-- upper cabinets -->
  <g>
    <rect x="30" y="60" width="190" height="150" rx="6" fill="#8fb8a8" stroke="#6f9a8a" stroke-width="2"/>
    <rect x="42" y="72" width="80" height="126" rx="4" fill="none" stroke="#6f9a8a" stroke-width="2"/>
    <rect x="128" y="72" width="80" height="126" rx="4" fill="none" stroke="#6f9a8a" stroke-width="2"/>
    <circle cx="112" cy="140" r="4" fill="#e8c26a"/><circle cx="138" cy="140" r="4" fill="#e8c26a"/>
    <rect x="580" y="60" width="190" height="150" rx="6" fill="#8fb8a8" stroke="#6f9a8a" stroke-width="2"/>
    <rect x="592" y="72" width="80" height="126" rx="4" fill="none" stroke="#6f9a8a" stroke-width="2"/>
    <rect x="678" y="72" width="80" height="126" rx="4" fill="none" stroke="#6f9a8a" stroke-width="2"/>
    <circle cx="662" cy="140" r="4" fill="#e8c26a"/><circle cx="688" cy="140" r="4" fill="#e8c26a"/>
  </g>
  <!-- open shelf with jars -->
  <rect x="590" y="236" width="170" height="8" rx="2" fill="#9c6b45"/>
  <g>
    <rect x="602" y="206" width="26" height="30" rx="4" fill="#fff" opacity="0.7" stroke="#c9b08a"/>
    <rect x="602" y="220" width="26" height="16" fill="#e0b25a" opacity="0.85"/>
    <rect x="636" y="210" width="24" height="26" rx="4" fill="#fff" opacity="0.7" stroke="#c9b08a"/>
    <rect x="636" y="224" width="24" height="12" fill="#b9633f" opacity="0.8"/>
    <rect x="668" y="214" width="22" height="22" rx="4" fill="#fff" opacity="0.7" stroke="#c9b08a"/>
    <rect x="668" y="226" width="22" height="10" fill="#8a9a4a" opacity="0.8"/>
  </g>
  <!-- hanging utensils -->
  <path d="M60 232H200" stroke="#7a5a3c" stroke-width="3"/>
  <g stroke="#7a5a3c" stroke-width="3" fill="none">
    <path d="M80 232v6M120 232v6M160 232v6M185 232v6"/>
  </g>
  <ellipse cx="80" cy="262" rx="12" ry="16" fill="#c9a36a"/>
  <rect x="78" y="238" width="4" height="10" fill="#7a5a3c"/>
  <rect x="116" y="238" width="4" height="40" fill="#7a5a3c"/><ellipse cx="118" cy="288" rx="9" ry="12" fill="#b88a55"/>
  <rect x="158" y="238" width="4" height="46" fill="#9a9a9a"/><path d="M152 284h16l-3 14h-10z" fill="#aaa"/>
  <rect x="183" y="238" width="4" height="36" fill="#7a5a3c"/><rect x="176" y="274" width="18" height="12" rx="3" fill="#c9a36a"/>

  <!-- lower cabinets / counter -->
  <rect x="0" y="410" width="800" height="14" fill="#e6c9a0"/>
  <rect x="0" y="424" width="800" height="126" fill="#8fb8a8"/>
  <g stroke="#6f9a8a" stroke-width="2" fill="none">
    <rect x="12" y="436" width="180" height="100" rx="4"/>
    <rect x="204" y="436" width="180" height="100" rx="4"/>
    <rect x="416" y="436" width="180" height="100" rx="4"/>
    <rect x="608" y="436" width="180" height="100" rx="4"/>
  </g>
  <g fill="#e8c26a"><circle cx="172" cy="450" r="4"/><circle cx="364" cy="450" r="4"/><circle cx="436" cy="450" r="4"/><circle cx="628" cy="450" r="4"/></g>

  <!-- floor -->
  <rect x="0" y="550" width="800" height="50" fill="url(#floor)"/>
  <g stroke="#9a6a40" stroke-width="1.5" opacity="0.6">
    <path d="M0 575H800M120 550V600M300 575V600M470 550V600M650 575V600"/>
  </g>
  <!-- rug -->
  <ellipse cx="400" cy="578" rx="150" ry="16" fill="#e98f7a"/>
  <ellipse cx="400" cy="578" rx="130" ry="12" fill="none" stroke="#fbe3c0" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- ===== counter items ===== -->
  <!-- kettle on the left -->
  <g>
    <ellipse cx="110" cy="408" rx="42" ry="5" fill="#000" opacity="0.12"/>
    <path d="M72 404 Q70 360 110 356 Q150 360 148 404Z" fill="#d95b4b"/>
    <path d="M80 392 Q78 372 96 366" stroke="#fff" stroke-width="4" opacity="0.4" fill="none" stroke-linecap="round"/>
    <rect x="98" y="346" width="24" height="10" rx="4" fill="#8a3b30"/>
    <circle cx="110" cy="344" r="5" fill="#2e2e2e"/>
    <path d="M146 380 Q168 366 172 346" stroke="#d95b4b" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M74 372 Q50 366 56 384" stroke="#2e2e2e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- kettle steam -->
    <g stroke="#fff" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M174 336q-8-12 0-22t0-20"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- fruit bowl -->
  <g>
    <ellipse cx="225" cy="408" rx="48" ry="5" fill="#000" opacity="0.12"/>
    <circle cx="205" cy="388" r="14" fill="#f08a3c"/><circle cx="232" cy="385" r="15" fill="#e8553e"/>
    <circle cx="250" cy="392" r="12" fill="#f2cf4a"/>
    <path d="M232 371q4-8 10-8" stroke="#5c8a3a" stroke-width="3" fill="none"/>
    <path d="M178 394 Q225 428 272 394Z" fill="#7fb0b8"/>
    <rect x="215" y="404" width="20" height="5" rx="2" fill="#6a9aa2"/>
  </g>

  <!-- coffee mug with steam, center-right -->
  <g>
    <ellipse cx="470" cy="408" rx="30" ry="4" fill="#000" opacity="0.12"/>
    <rect x="445" y="372" width="44" height="36" rx="8" fill="#fff6e6" stroke="#e0c8a0" stroke-width="2"/>
    <path d="M489 380q18 0 16 14t-16 10" stroke="#fff6e6" stroke-width="6" fill="none"/>
    <ellipse cx="467" cy="374" rx="22" ry="5" fill="#6b3f26"/>
    <path d="M456 392l8 8 8-8" stroke="#e98f7a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7">
      <path d="M458 362q-8-10 0-18t0-16"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/></path>
      <path d="M472 362q-8-10 0-18t0-16"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- toast plate -->
  <g>
    <ellipse cx="545" cy="406" rx="38" ry="6" fill="#fff6e6" stroke="#e0c8a0"/>
    <rect x="522" y="388" width="26" height="22" rx="8" fill="#e6b26a"/>
    <rect x="526" y="392" width="18" height="14" rx="5" fill="#f4d08a"/>
    <rect x="546" y="390" width="26" height="20" rx="8" fill="#e6b26a" transform="rotate(8 559 400)"/>
    <rect x="550" y="394" width="18" height="12" rx="5" fill="#f4d08a" transform="rotate(8 559 400)"/>
  </g>

  <!-- vase with flowers at right -->
  <g>
    <ellipse cx="690" cy="408" rx="26" ry="4" fill="#000" opacity="0.12"/>
    <path d="M674 408 Q668 380 680 366 H700 Q712 380 706 408Z" fill="#f6efe2" stroke="#e0c8a0" stroke-width="2"/>
    <g stroke="#5c9a4a" stroke-width="3" fill="none"><path d="M686 366q-8-30-18-36M690 366V322M694 366q8-30 18-34"/></g>
    <circle cx="666" cy="328" r="9" fill="#f6c84a"/><circle cx="666" cy="328" r="4" fill="#8a5a2a"/>
    <circle cx="690" cy="318" r="10" fill="#f2a1b0"/><circle cx="690" cy="318" r="4" fill="#f6c84a"/>
    <circle cx="714" cy="330" r="9" fill="#fff"/><circle cx="714" cy="330" r="4" fill="#f6c84a"/>
  </g>

  <!-- pendant lamp (off, sun is enough) -->
  <path d="M400 0V40" stroke="#7a5a3c" stroke-width="3"/>
  <path d="M370 70 Q400 30 430 70Z" fill="#e8c26a"/>
  <ellipse cx="400" cy="70" rx="30" ry="5" fill="#fff3c4"/>

  <!-- cat curled on rug -->
  <g>
    <ellipse cx="320" cy="580" rx="30" ry="14" fill="#e8934a"/>
    <circle cx="298" cy="574" r="11" fill="#e8934a"/>
    <path d="M292 565l-2-9 8 5zM304 563l4-8 3 9z" fill="#e8934a"/>
    <path d="M294 574q3 2 6 0" stroke="#5a3a20" stroke-width="1.5" fill="none"/>
    <path d="M340 586q14-2 8-12" stroke="#e8934a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M310 570q8-4 14 0M318 576q8-4 14 0" stroke="#c97a38" stroke-width="2" fill="none"/>
  </g>

  <!-- floating dust motes in the sunbeam -->
  <g fill="#fff8d0" opacity="0.8">
    <circle cx="430" cy="200" r="2"/><circle cx="480" cy="260" r="1.5"/><circle cx="540" cy="320" r="2"/>
    <circle cx="590" cy="380" r="1.5"/><circle cx="460" cy="320" r="1.5"/><circle cx="510" cy="200" r="2"/>
  </g>
</svg>
