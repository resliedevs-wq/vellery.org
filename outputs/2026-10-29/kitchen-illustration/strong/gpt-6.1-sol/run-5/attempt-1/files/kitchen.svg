<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A quiet Monday morning in the kitchen</title>
  <desc id="desc">A flat vector illustration seen from the front: a small wooden kitchen table holds exactly three red apples, a blue mug printed with MONDAY, and a folded newspaper with a sleeping gray cat on top. Morning sunlight enters through a window on the left. There are no people.</desc>

