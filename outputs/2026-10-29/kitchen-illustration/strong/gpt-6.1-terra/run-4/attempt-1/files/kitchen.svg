<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A quiet Monday morning</title>
  <desc id="desc">A front view of a small kitchen table with three red apples, a blue Monday mug, and a gray cat sleeping on a folded newspaper in warm light from a window on the left.</desc>
