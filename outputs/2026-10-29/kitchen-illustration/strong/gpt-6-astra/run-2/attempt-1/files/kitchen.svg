  <path fill="#a4a8a1" d="m612 426-2-29 25 16q14-5 26 2l23-16-3 33c4 18-10 31-33 31-24 0-40-14-36-37"/>
  <path fill="#c3b0a5" d="m617 407 2 18 11-7zM677 408l-12 12 11 7z"/>
