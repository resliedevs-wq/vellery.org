  <path fill="#9b7e74" d="M640 441h10l-5 6z"/>
  <path d="m628 447-22-3m22 8-20 2m56-7 19-4m-19 9 19 1" fill="none" stroke="#727c75" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="676" cy="460" rx="18" ry="7" fill="#b7bbb2"/>
  <path d="m673 459 1 4m5-4 1 4" fill="none" stroke="#8e9690" stroke-width="1.5" stroke-linecap="round"/>
</svg>
