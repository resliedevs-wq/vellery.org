  <ellipse cx="505.5" cy="402" rx="36.5" ry="5" fill="#635647"/>
  <text x="506" y="450" text-anchor="middle" fill="#fff1d8" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">MONDAY</text>

