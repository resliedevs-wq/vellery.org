  <ellipse cx="702" cy="462" rx="91" ry="8" fill="#c3c1af"/>
  <path fill="#929793" d="M645 441c-4-29 22-52 63-52 42 0 75 21 75 47 0 20-25 29-62 29h-54c-15 0-23-9-22-24"/>
  <path fill="#a6aaa4" d="M670 409c20-17 58-17 82 2-20-6-48-1-58 15-6 8-21 3-24-17"/>
