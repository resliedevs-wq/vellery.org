  <text x="482" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#f7efd9">MONDAY</text>
  <path d="M468 316C456 302 482 295 470 281M492 312C481 298 506 291 495 277" fill="none" stroke="#fff8e7" stroke-width="5" stroke-linecap="round" opacity=".75"/>

  <!-- Folded newspaper; layered lower edge and central fold. -->
  <ellipse cx="701" cy="432" rx="130" ry="7" fill="#9e7655" opacity=".25"/>
  <path d="M587 393L794 390 822 428 597 435 575 423Z" fill="#b7afa0"/>
  <path d="M585 390L793 387 819 423 596 430 575 419Z" fill="#e1d9c5"/>
  <path d="M585 387L792 384 816 418 596 425 574 415Z" fill="#f4ecd9"/>
