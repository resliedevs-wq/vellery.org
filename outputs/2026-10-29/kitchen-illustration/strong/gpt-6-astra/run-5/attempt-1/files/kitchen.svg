  <path d="M179 77V316M75 196H283" fill="none" stroke="#faf2dc" stroke-width="11"/>
  <rect x="52" y="324" width="254" height="14" rx="4" fill="#b49a77"/>
  <rect x="48" y="320" width="262" height="9" rx="3" fill="#f8edda"/>

  <!-- Table, straight-on with only a shallow visible top surface. -->
  <ellipse cx="515" cy="680" rx="341" ry="28" fill="#b39a7d" opacity=".3"/>
  <path d="M207 474H249L240 678Q240 685 233 685H215Q208 685 208 678Z" fill="#99704e"/>
  <path d="M783 474H825L823 678Q823 685 816 685H798Q791 685 791 678Z" fill="#99704e"/>
  <path d="M219 484H235L229 672H219Z" fill="#b78960"/>
