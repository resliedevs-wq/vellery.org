  <path d="M654 387Q674 381 690 389Q699 398 686 401H653Z" fill="#a6a69e"/>
  <path d="M615 358L612 328Q614 323 619 327L638 344Q650 341 661 347L678 334Q682 332 682 339L679 369C679 389 665 400 645 399C622 399 609 382 615 358Z" fill="#a0a19a"/>
  <path d="M619 335L622 354 633 347Z" fill="#c3aaa0"/>
  <path d="M675 343L664 351 676 359Z" fill="#c3aaa0"/>
  <path d="M639 345L643 356M650 345L650 355" stroke="#838780" stroke-width="4" stroke-linecap="round"/>
  <path d="M622 372Q629 379 636 372M650 374Q657 381 664 374" fill="none" stroke="#555e59" stroke-width="2.7" stroke-linecap="round"/>
  <path d="M639 382Q644 379 648 383L644 387Z" fill="#876f69"/>
  <path d="M644 387Q641 392 637 389M644 387Q647 392 651 390" fill="none" stroke="#646b64" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M629 384L608 380M629 388L608 390M657 387L678 384M657 391L676 395" fill="none" stroke="#737971" stroke-width="1.5" stroke-linecap="round"/>
</svg>
