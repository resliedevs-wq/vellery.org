      <path d="M249 365Q258 350 271 357Q264 370 249 365Z" fill="#87976b"/>
      <path d="M229 383Q224 393 228 402" fill="none" stroke="#d77c66" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="apple-two">
      <path d="M312 377C297 367 282 378 282 395C282 410 292 427 305 425Q312 422 319 425C332 426 343 409 342 393C342 377 326 368 312 377Z" fill="#c6604d"/>
      <path d="M312 379Q315 368 310 362" fill="none" stroke="#71563c" stroke-width="4" stroke-linecap="round"/>
      <path d="M294 388Q290 396 294 403" fill="none" stroke="#e08c70" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="apple-three">
      <path d="M374 374C359 364 344 376 344 393C344 410 354 427 367 425Q374 422 381 425C395 426 405 407 404 391C403 375 388 365 374 374Z" fill="#ad493e"/>
