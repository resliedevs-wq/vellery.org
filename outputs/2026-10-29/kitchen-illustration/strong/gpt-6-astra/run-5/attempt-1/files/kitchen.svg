  <path d="M214 508H818" stroke="#946a49" stroke-width="3"/>
  <rect x="169" y="428" width="694" height="49" rx="10" fill="#a77852"/>
  <rect x="169" y="418" width="694" height="39" rx="10" fill="#c99e71"/>
