<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">A quiet Monday morning</title>
  <desc id="description">Flat vector illustration of a small kitchen table viewed from the front. Exactly three red apples, a blue mug printed with MONDAY, and a folded newspaper with a sleeping gray cat sit on the table. Warm morning sunlight enters through a window on the left. No people.</desc>
  <defs>
    <clipPath id="window-view"><rect x="76" y="78" width="206" height="237" rx="4"/></clipPath>
  </defs>

  <!-- Warm kitchen wall and floor. -->
  <rect width="1000" height="760" fill="#eee3cf"/>
  <rect y="582" width="1000" height="178" fill="#d6bfa0"/>
  <rect y="573" width="1000" height="11" fill="#c8af8c"/>
  <path d="M0 686H1000M162 584L113 760M845 584L901 760" fill="none" stroke="#c9af8e" stroke-width="2"/>

  <!-- Left-hand window and broad, flat shapes of morning light. -->
  <path d="M86 174L282 155 870 573H463Z" fill="#f6e9bd" opacity=".65"/>
  <path d="M86 271L282 238 683 573H420Z" fill="#fff1ca" opacity=".65"/>
  <rect x="61" y="63" width="236" height="267" rx="7" fill="#c2ad8f"/>
  <rect x="70" y="72" width="218" height="249" rx="4" fill="#faf2dc"/>
