      <path d="M837 444Q828 460 835 473M859 449Q848 466 858 477M881 461Q870 474 879 487" fill="none" stroke="#7c8380" stroke-width="8" stroke-linecap="round"/>
      <path d="M882 488C917 484 931 507 913 521C899 533 865 532 845 527C830 523 834 509 848 511C866 514 885 517 894 511" fill="none" stroke="#7f8783" stroke-width="18" stroke-linecap="round"/>
      <path d="M789 510Q804 499 824 506Q837 509 832 519Q813 527 785 521Z" fill="#a6aaa6"/>
      <path d="M721 477L720 447Q721 441 727 445L747 461Q761 458 774 463L794 448Q799 444 799 451L795 480C806 498 795 516 776 520L744 519C725 517 712 498 721 477Z" fill="#a0a5a1"/>
      <path d="M726 452L729 472L741 464Z" fill="#c5aaa2"/>
      <path d="M791 456L780 467L791 474Z" fill="#c5aaa2"/>
      <path d="M748 462L751 474M763 462L762 474" fill="none" stroke="#858d87" stroke-width="5" stroke-linecap="round"/>
      <path d="M733 490Q740 497 747 490M768 490Q775 497 782 490" fill="none" stroke="#515f59" stroke-width="3" stroke-linecap="round"/>
      <path d="M751 500Q757 497 762 500L757 505Z" fill="#ad837c"/>
      <path d="M757 505Q754 510 750 507M757 505Q760 510 764 507" fill="none" stroke="#68716b" stroke-width="2" stroke-linecap="round"/>
      <path d="M738 502L715 498M738 507L714 509M778 502L800 498M778 507L802 510" fill="none" stroke="#747d76" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="748" cy="518" rx="22" ry="7" fill="#b2b5ae"/>
      <path d="M737 517L739 521M744 517L746 522" stroke="#949d94" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
