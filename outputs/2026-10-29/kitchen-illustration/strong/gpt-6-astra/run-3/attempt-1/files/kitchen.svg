    <g id="folded-newspaper">
      <path d="M676 516L929 518L976 553L702 560Z" fill="#a98968" opacity=".45"/>
      <path d="M666 513L917 511L966 547L695 554Z" fill="#c1b9a5"/>
      <path d="M666 506L917 505L966 540V547L695 549L666 513Z" fill="#eee5ce"/>
