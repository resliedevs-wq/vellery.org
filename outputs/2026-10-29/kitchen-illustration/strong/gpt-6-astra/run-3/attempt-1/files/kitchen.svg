        <path d="M337 494Q333 480 341 473" fill="none" stroke="#755a3f" stroke-width="5" stroke-linecap="round"/>
        <path d="M340 482Q355 465 367 477Q356 488 340 482" fill="#879363"/>
        <path d="M314 507Q316 499 322 498" fill="none" stroke="#d67c60" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="apple-2">
        <path d="M390 481C374 470 357 480 356 497C355 518 366 536 380 535Q390 532 398 535C413 538 426 517 424 499C423 481 406 471 390 481Z" fill="#a9443b"/>
        <path d="M390 482Q386 470 392 462" fill="none" stroke="#755a3f" stroke-width="5" stroke-linecap="round"/>
        <path d="M367 494Q368 486 375 484" fill="none" stroke="#cb6c55" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="apple-3">
