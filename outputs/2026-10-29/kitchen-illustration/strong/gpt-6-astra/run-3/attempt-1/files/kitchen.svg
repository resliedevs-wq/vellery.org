    <path d="M129 365Q191 335 245 364T321 352V401H129Z" fill="#96afa3"/>
    <path d="M225 122V401M129 258H321" stroke="#faf2df" stroke-width="12"/>
    <rect x="96" y="409" width="258" height="18" rx="5" fill="#b49a78"/>
    <rect x="96" y="405" width="258" height="10" rx="4" fill="#f9eed6"/>

    <!-- Small domestic details, kept subordinate to the table. -->
    <rect x="837" y="151" width="124" height="152" rx="3" fill="#b89b7b"/>
    <rect x="847" y="161" width="104" height="132" fill="#f4e9d3"/>
    <path d="M899 266V198M899 235Q872 233 873 211Q896 210 899 235M899 221Q923 216 926 193Q902 193 899 221M899 252Q920 251 924 231Q902 231 899 252" fill="#8e9d80" stroke="#8e9d80" stroke-width="3" stroke-linecap="round"/>

