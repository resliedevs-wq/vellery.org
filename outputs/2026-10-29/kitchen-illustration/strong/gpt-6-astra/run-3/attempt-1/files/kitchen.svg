      <path d="M599 479H615C648 479 647 526 618 528H599" fill="none" stroke="#547e92" stroke-width="13"/>
      <path d="M499 464H608V533Q608 551 589 552H518Q499 551 499 533Z" fill="#658fa2"/>
      <path d="M501 471H513V530Q513 540 519 544" fill="none" stroke="#80a6b4" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="553.5" cy="464" rx="54.5" ry="11" fill="#94b2bc"/>
      <ellipse cx="553.5" cy="465" rx="45.5" ry="6" fill="#64574b"/>
      <text x="554" y="513" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1" fill="#faf1da">MONDAY</text>
      <path d="M536 441C524 426 545 417 537 402M567 439C556 426 577 414 569 400" fill="none" stroke="#f8efdc" stroke-width="5" stroke-linecap="round"/>
    </g>

