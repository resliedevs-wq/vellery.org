    <ellipse cx="650" cy="797" rx="392" ry="32" fill="#b39b80" opacity=".35"/>
    <path d="M292 590H337L327 793Q326 800 319 800H303Q296 800 296 793Z" fill="#997050"/>
    <path d="M952 590H997L992 793Q992 800 985 800H969Q962 800 962 793Z" fill="#997050"/>
    <path d="M302 610H321L315 785H305Z" fill="#b48a61"/>
    <path d="M963 610H982L982 785H973Z" fill="#b48a61"/>
    <rect x="283" y="577" width="723" height="58" rx="5" fill="#ae8058"/>
    <path d="M309 618H980" stroke="#956c4c" stroke-width="3" stroke-linecap="round"/>
    <path d="M285 538H1003L1038 572H249Z" fill="#d2a577"/>
    <rect x="249" y="570" width="789" height="23" rx="7" fill="#bb8b60"/>
    <path d="M261 575H1026" stroke="#e0b68a" stroke-width="4" stroke-linecap="round"/>

