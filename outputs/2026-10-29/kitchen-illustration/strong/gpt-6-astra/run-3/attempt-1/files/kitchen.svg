        <path d="M423 508Q420 495 427 487" fill="none" stroke="#755a3f" stroke-width="5" stroke-linecap="round"/>
        <path d="M401 520Q402 513 408 512" fill="none" stroke="#dd8970" stroke-width="6" stroke-linecap="round"/>
      </g>
