      <path d="M802 506L836 541" stroke="#c3baa5" stroke-width="2"/>
      <path d="M689 515L777 514M694 520L782 519M699 525L736 524M705 530L742 529M711 535L748 534M747 524L787 523M753 529L793 528M759 534L799 533M851 525L913 524M858 530L923 529M864 535L934 533" stroke="#aaa797" stroke-width="2"/>
