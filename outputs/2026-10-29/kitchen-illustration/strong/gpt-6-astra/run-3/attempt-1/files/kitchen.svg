<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A quiet Monday morning</title>
  <desc id="desc">Flat vector illustration of a small kitchen table viewed from the front. Exactly three red apples and a blue mug labeled MONDAY sit beside a folded newspaper with a gray cat sleeping on top. Morning sunlight enters through a window on the left. No people.</desc>
  <defs>
    <clipPath id="room"><rect x="40" y="40" width="1120" height="820" rx="28"/></clipPath>
  </defs>

  <!-- Warm room and broad, flat shapes of morning light. -->
  <rect width="1200" height="900" fill="#f4eddf"/>
  <g clip-path="url(#room)">
    <rect x="40" y="40" width="1120" height="820" fill="#e9ddc9"/>
    <path d="M40 691H1160V860H40Z" fill="#d3bea3"/>
    <path d="M40 687H1160" stroke="#c5ad90" stroke-width="8"/>
    <path d="M125 179L309 175L1069 690H573Z" fill="#f4e8c5"/>
    <path d="M573 695H1069L1160 770V831Z" fill="#e4d2ae"/>
    <path d="M40 786H1160M245 695L179 860M789 695L860 860" fill="none" stroke="#c3aa8c" stroke-width="3" opacity=".45"/>

    <!-- Left window, with a simple pale morning sky. -->
    <rect x="104" y="115" width="242" height="320" rx="9" fill="#d5c4ab"/>
    <rect x="113" y="107" width="224" height="310" rx="6" fill="#faf2df"/>
    <rect x="129" y="123" width="192" height="278" fill="#bbced0"/>
