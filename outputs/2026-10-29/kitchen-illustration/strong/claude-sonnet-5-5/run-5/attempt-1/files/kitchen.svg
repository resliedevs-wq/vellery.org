<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Kitchen table in morning light</title>

  <!-- wall and floor -->
  <rect width="800" height="600" fill="#efe0c8"/>
  <rect y="470" width="800" height="130" fill="#c9a37a"/>
  <rect y="466" width="800" height="8" fill="#b88f66"/>
  <g stroke="#b88f66" stroke-width="2" opacity="0.6">
    <line x1="0" y1="520" x2="800" y2="520"/>
    <line x1="0" y1="570" x2="800" y2="570"/>
  </g>

  <!-- window (left) -->
  <rect x="34" y="84" width="196" height="246" rx="4" fill="#c58f5e"/>
  <rect x="46" y="96" width="172" height="222" fill="#f6e7b8"/>
  <rect x="46" y="96" width="172" height="222" fill="#bcd6dc" opacity="0.55"/>
  <g stroke="#c58f5e" stroke-width="8">
    <line x1="132" y1="96" x2="132" y2="318"/>
    <line x1="46" y1="207" x2="218" y2="207"/>
  </g>
  <rect x="24" y="328" width="216" height="14" rx="3" fill="#b27d4e"/>

  <!-- sunlight from the window -->
  <polygon points="218,96 218,318 720,520 720,330" fill="#fff0b3" opacity="0.38"/>
  <polygon points="218,150 218,260 720,470 720,380" fill="#fff6cf" opacity="0.28"/>
  <polygon points="300,474 700,474 740,560 380,560" fill="#f4d98f" opacity="0.35"/>

  <!-- table shadow on floor -->
  <ellipse cx="430" cy="545" rx="270" ry="14" fill="#7a5a3c" opacity="0.28"/>

  <!-- table -->
  <rect x="215" y="380" width="430" height="14" fill="#9c6b45"/>
  <rect x="235" y="394" width="26" height="148" fill="#a8734a"/>
  <rect x="599" y="394" width="26" height="148" fill="#8f603d"/>
  <rect x="235" y="394" width="9" height="148" fill="#bd8a5d"/>
  <rect x="170" y="360" width="520" height="24" rx="5" fill="#c58f5e"/>
  <rect x="170" y="360" width="520" height="6" rx="3" fill="#d9a674"/>

  <!-- folded newspaper -->
  <rect x="222" y="334" width="176" height="26" fill="#e9e1cf"/>
  <rect x="222" y="334" width="176" height="5" fill="#f6f0e2"/>
  <line x1="310" y1="339" x2="310" y2="360" stroke="#c9bfa8" stroke-width="2"/>
  <g stroke="#9a927f" stroke-width="2" stroke-linecap="round">
    <line x1="234" y1="346" x2="296" y2="346"/>
    <line x1="234" y1="353" x2="280" y2="353"/>
    <line x1="324" y1="346" x2="386" y2="346"/>
    <line x1="324" y1="353" x2="370" y2="353"/>
  </g>
  <rect x="234" y="341" width="30" height="2.5" fill="#6d6759"/>

  <!-- sleeping gray cat -->
  <path d="M 262 334 C 255 318 280 296 322 296 C 362 296 380 318 372 334 Z" fill="#8c8f94"/>
  <path d="M 268 334 C 262 322 278 304 298 300" fill="none" stroke="#a7aaae" stroke-width="3" stroke-linecap="round"/>
  <path d="M 262 332 C 238 334 232 318 246 312" fill="none" stroke="#7a7d82" stroke-width="9" stroke-linecap="round"/>
  <path d="M 262 332 C 238 334 232 318 246 312" fill="none" stroke="#8c8f94" stroke-width="6" stroke-linecap="round"/>
  <g>
    <polygon points="352,304 356,282 368,298" fill="#7a7d82"/>
    <polygon points="381,298 394,282 396,304" fill="#7a7d82"/>
    <polygon points="356,300 358,289 365,298" fill="#d9a9a0"/>
    <polygon points="385,297 392,289 392,302" fill="#d9a9a0"/>
    <ellipse cx="374" cy="316" rx="25" ry="19" fill="#8c8f94"/>
    <path d="M 361 313 Q 366 317 371 313 M 380 313 Q 385 317 390 313" fill="none" stroke="#3e4044" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="376" cy="321" rx="2.5" ry="2" fill="#c98a86"/>
    <path d="M 376 323 Q 372 327 368 325 M 376 323 Q 380 327 384 325" fill="none" stroke="#3e4044" stroke-width="1.3" stroke-linecap="round"/>
    <g stroke="#b9bcc0" stroke-width="1" stroke-linecap="round">
      <line x1="354" y1="322" x2="342" y2="320"/>
      <line x1="394" y1="322" x2="404" y2="320"/>
    </g>
  </g>
  <g stroke="#6f7277" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 300 304 Q 304 316 300 330"/>
    <path d="M 318 301 Q 322 316 318 332"/>
  </g>

  <!-- blue mug -->
  <path d="M 490 322 H 498 A 20 20 0 0 1 498 362 H 490" fill="none" stroke="#3f6c93" stroke-width="7" stroke-linecap="round" transform="translate(0,-4)"/>
  <rect x="428" y="298" width="64" height="62" rx="6" fill="#4a7ea8"/>
  <rect x="428" y="298" width="12" height="62" rx="5" fill="#6a9bc2"/>
  <rect x="428" y="298" width="64" height="7" rx="3" fill="#3f6c93"/>
  <rect x="440" y="322" width="46" height="16" fill="#e8dcc0" opacity="0.92"/>
  <text x="463" y="334" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="11" textLength="42" lengthAdjust="spacingAndGlyphs" fill="#2f4f6b">MONDAY</text>

  <!-- three red apples -->
  <g>
    <!-- apple 1 -->
    <path d="M 548 322 C 534 316 526 328 526 340 C 526 352 536 360 548 360 C 560 360 570 352 570 340 C 570 328 562 316 548 322 Z" fill="#c1443a"/>
    <path d="M 534 328 C 530 334 530 342 533 348" fill="none" stroke="#dd6a5c" stroke-width="3" stroke-linecap="round"/>
    <path d="M 548 322 Q 549 316 553 312" fill="none" stroke="#5e4630" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 552 316 Q 562 308 568 314 Q 560 321 552 316 Z" fill="#7d9460"/>

    <!-- apple 2 -->
    <path d="M 598 322 C 584 316 576 328 576 340 C 576 352 586 360 598 360 C 610 360 620 352 620 340 C 620 328 612 316 598 322 Z" fill="#b83c33"/>
    <path d="M 584 328 C 580 334 580 342 583 348" fill="none" stroke="#d96558" stroke-width="3" stroke-linecap="round"/>
    <path d="M 598 322 Q 599 316 603 312" fill="none" stroke="#5e4630" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 602 316 Q 612 308 618 314 Q 610 321 602 316 Z" fill="#7d9460"/>

    <!-- apple 3 -->
    <path d="M 648 322 C 634 316 626 328 626 340 C 626 352 636 360 648 360 C 660 360 670 352 670 340 C 670 328 662 316 648 322 Z" fill="#c1443a"/>
    <path d="M 634 328 C 630 334 630 342 633 348" fill="none" stroke="#dd6a5c" stroke-width="3" stroke-linecap="round"/>
    <path d="M 648 322 Q 649 316 653 312" fill="none" stroke="#5e4630" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 652 316 Q 662 308 668 314 Q 660 321 652 316 Z" fill="#7d9460"/>
  </g>
</svg>
