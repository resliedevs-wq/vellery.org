<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Kitchen table in morning light</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3e3c7"/>
      <stop offset="1" stop-color="#e2cfae"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d9a8"/>
      <stop offset="1" stop-color="#fbeccb"/>
    </linearGradient>
  </defs>

  <!-- Wall and floor -->
  <rect width="800" height="600" fill="url(#wall)"/>
  <rect y="470" width="800" height="130" fill="#c9a47e"/>
  <rect y="466" width="800" height="8" fill="#b48d68"/>

  <!-- Window on the left -->
  <rect x="38" y="70" width="174" height="240" rx="4" fill="#a7825f"/>
  <rect x="50" y="82" width="150" height="216" fill="url(#sky)"/>
  <circle cx="92" cy="128" r="22" fill="#fff3d0"/>
  <rect x="121" y="82" width="8" height="216" fill="#a7825f"/>
  <rect x="50" y="186" width="150" height="8" fill="#a7825f"/>
  <rect x="30" y="306" width="190" height="12" rx="3" fill="#946f4f"/>

  <!-- Sunbeam falling from the window across the table -->
  <polygon points="200,82 212,310 760,470 800,470 800,300" fill="url(#sun)"/>
  <!-- Warm patch of light on the floor -->
  <polygon points="300,470 520,470 640,600 360,600" fill="#e3c197" opacity="0.6"/>

  <!-- Table -->
  <g id="table">
    <rect x="200" y="392" width="22" height="168" fill="#8a5f3f"/>
    <rect x="628" y="392" width="22" height="168" fill="#7a5236"/>
    <rect x="160" y="378" width="530" height="18" rx="3" fill="#b07a4f"/>
    <rect x="160" y="378" width="530" height="5" rx="2" fill="#c99467"/>
    <rect x="176" y="396" width="498" height="16" fill="#9a6a44"/>
    <ellipse cx="425" cy="560" rx="250" ry="8" fill="#a98563" opacity="0.6"/>
  </g>

  <!-- Soft shadows cast to the right (light comes from the left) -->
  <g fill="#7f5534" opacity="0.28">
    <ellipse cx="226" cy="379" rx="26" ry="4"/>
    <ellipse cx="272" cy="379" rx="26" ry="4"/>
    <ellipse cx="318" cy="379" rx="26" ry="4"/>
    <ellipse cx="408" cy="379" rx="44" ry="4"/>
    <ellipse cx="575" cy="379" rx="100" ry="4"/>
  </g>

  <!-- Three red apples -->
  <g id="apples">
    <g id="apple1">
      <path d="M220,334 C200,328 196,350 200,362 C205,378 216,380 221,377 C226,380 237,378 242,362 C246,350 242,328 222,334 Z" fill="#c2463c"/>
      <path d="M232,342 C240,348 240,364 232,372" stroke="#9e3530" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="209" cy="348" rx="4" ry="7" fill="#e47d6e" opacity="0.8"/>
      <path d="M221,336 L223,322" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
      <path d="M223,326 C230,318 240,320 241,322 C236,330 228,330 223,326 Z" fill="#7c9a5a"/>
    </g>
    <g id="apple2">
      <path d="M266,334 C246,328 242,350 246,362 C251,378 262,380 267,377 C272,380 283,378 288,362 C292,350 288,328 268,334 Z" fill="#b93f37"/>
      <path d="M278,342 C286,348 286,364 278,372" stroke="#952f2b" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="255" cy="348" rx="4" ry="7" fill="#e47d6e" opacity="0.8"/>
      <path d="M267,336 L266,323" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="apple3">
      <path d="M312,334 C292,328 288,350 292,362 C297,378 308,380 313,377 C318,380 329,378 334,362 C338,350 334,328 314,334 Z" fill="#c74a3e"/>
      <path d="M324,342 C332,348 332,364 324,372" stroke="#9e3530" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
      <ellipse cx="301" cy="348" rx="4" ry="7" fill="#e47d6e" opacity="0.8"/>
      <path d="M313,336 L316,323" stroke="#6b4a2f" stroke-width="3" stroke-linecap="round"/>
      <path d="M315,327 C308,318 298,319 297,321 C301,329 310,330 315,327 Z" fill="#7c9a5a"/>
    </g>
  </g>

  <!-- Blue mug -->
  <g id="mug">
    <path d="M428,326 C454,326 456,366 428,366" stroke="#3d6189" stroke-width="9" fill="none"/>
    <rect x="356" y="314" width="76" height="64" rx="7" fill="#4a73a0"/>
    <rect x="410" y="314" width="22" height="64" rx="7" fill="#3d6189"/>
    <rect x="404" y="314" width="12" height="64" fill="#3d6189"/>
    <rect x="360" y="318" width="8" height="54" rx="4" fill="#7ba0c6" opacity="0.7"/>
    <ellipse cx="394" cy="315" rx="38" ry="4" fill="#2f4d70"/>
    <text x="394" y="351" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#f6ecd8" textLength="60" lengthAdjust="spacingAndGlyphs">MONDAY</text>
    <!-- steam -->
    <path d="M384,304 C378,294 390,288 384,276 M402,304 C396,294 408,288 402,276" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Folded newspaper -->
  <g id="newspaper">
    <rect x="474" y="356" width="190" height="22" rx="2" fill="#e9e1cf"/>
    <rect x="474" y="356" width="190" height="5" fill="#f4eee0"/>
    <path d="M474,366 H664 M474,372 H664" stroke="#cfc4ad" stroke-width="1.5"/>
    <rect x="482" y="363" width="70" height="3" fill="#8f8677"/>
    <rect x="560" y="363" width="40" height="2" fill="#a9a08f"/>
    <rect x="606" y="363" width="50" height="2" fill="#a9a08f"/>
    <path d="M664,358 C670,362 670,374 664,378" stroke="#d8ceb8" stroke-width="3" fill="none"/>
  </g>

  <!-- Gray cat asleep on the newspaper -->
  <g id="cat">
    <!-- tail curled along the front -->
    <path d="M640,348 C660,352 650,360 610,358 C580,357 545,358 528,352" stroke="#7b7f86" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M520,356 C512,322 548,302 590,304 C630,306 656,326 648,356 Z" fill="#8a8e95"/>
    <path d="M600,308 C630,312 652,330 646,354 L620,354 C628,334 618,318 600,308 Z" fill="#7b7f86"/>
    <path d="M560,312 C566,320 566,330 560,338 M580,308 C586,318 586,328 580,336" stroke="#757980" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- tail tip over the body front -->
    <path d="M530,353 C540,358 560,358 572,354" stroke="#6e7279" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- head resting on paws -->
    <ellipse cx="514" cy="351" rx="9" ry="5" fill="#a3a7ad"/>
    <ellipse cx="532" cy="351" rx="9" ry="5" fill="#a3a7ad"/>
    <path d="M500,322 L504,302 L514,316 Z" fill="#8a8e95"/>
    <path d="M530,316 L540,302 L544,322 Z" fill="#8a8e95"/>
    <path d="M504,308 L512,316 L506,318 Z" fill="#d9a7a0"/>
    <path d="M538,308 L536,318 L542,320 Z" fill="#d9a7a0"/>
    <ellipse cx="522" cy="333" rx="24" ry="19" fill="#959aa1"/>
    <!-- closed eyes -->
    <path d="M508,331 Q513,335 518,331 M527,331 Q532,335 537,331" stroke="#3f4247" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M520,339 L524,339 L522,341 Z" fill="#c98a85"/>
    <path d="M522,341 Q518,345 515,343 M522,341 Q526,345 529,343" stroke="#3f4247" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M506,340 L492,338 M506,343 L493,345 M538,340 L552,338 M538,343 L551,345" stroke="#c6c9ce" stroke-width="1" stroke-linecap="round"/>
    <!-- sunlit highlight on the left side -->
    <path d="M532,318 C548,308 568,305 584,306" stroke="#b4b8be" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- zzz -->
    <text x="556" y="298" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#8a8e95" opacity="0.7">z</text>
    <text x="566" y="286" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#8a8e95" opacity="0.55">z</text>
  </g>
</svg>
