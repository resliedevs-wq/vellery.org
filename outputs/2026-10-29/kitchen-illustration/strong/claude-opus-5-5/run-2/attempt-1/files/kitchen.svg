  <rect x="470" y="380" width="206" height="8" fill="#ddd4bf"/>
  <g stroke="#c3b9a2" stroke-width="1">
    <line x1="470" y1="383" x2="676" y2="383"/>
    <line x1="470" y1="386" x2="676" y2="386"/>
