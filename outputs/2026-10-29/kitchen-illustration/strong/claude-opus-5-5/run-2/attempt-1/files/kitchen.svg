  <path d="M646 360 C668 380 612 386 562 376" stroke="#77777e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M646 360 C668 380 612 386 562 376" stroke="#8b8b91" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
  <ellipse cx="556" cy="374" rx="11" ry="5" fill="#a3a3a9"/>
  <polygon points="522,346 519,326 535,339" fill="#8b8b91"/>
  <polygon points="541,338 555,327 556,346" fill="#8b8b91"/>
  <polygon points="524,342 523,332 531,339" fill="#d9a7a0"/>
  <polygon points="544,339 552,333 552,343" fill="#d9a7a0"/>
  <circle cx="538" cy="357" r="20" fill="#9a9aa0"/>
  <ellipse cx="531" cy="350" rx="6" ry="4" fill="#b2b2b8" opacity="0.7"/>
  <g stroke="#3e3e44" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M526 357 q4 3 8 0"/>
    <path d="M542 357 q4 3 8 0"/>
  </g>
  <path d="M535 362 h6 l-3 3 z" fill="#c98b84"/>
  <g stroke="#d8d8dc" stroke-width="1" stroke-linecap="round" opacity="0.8">
    <line x1="524" y1="364" x2="510" y2="362"/>
    <line x1="524" y1="366" x2="511" y2="368"/>
    <line x1="552" y1="364" x2="566" y2="362"/>
    <line x1="552" y1="366" x2="565" y2="368"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" fill="#8a7a68" opacity="0.75">
    <text x="560" y="318" font-size="11">z</text>
    <text x="570" y="306" font-size="14">z</text>
    <text x="583" y="292" font-size="17">Z</text>
  </g>
</svg>
