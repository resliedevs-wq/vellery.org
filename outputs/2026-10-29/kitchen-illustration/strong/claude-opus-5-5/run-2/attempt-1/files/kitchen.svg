  <ellipse cx="592" cy="352" rx="58" ry="24" fill="#8b8b91"/>
  <path d="M560 336 C575 326 610 326 630 336" stroke="#9fa0a6" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <g stroke="#6f6f76" stroke-width="3" fill="none" stroke-linecap="round">
