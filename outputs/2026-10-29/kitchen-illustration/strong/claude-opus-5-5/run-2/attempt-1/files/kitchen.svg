  <path d="M470 380 C464 380 464 388 470 388" fill="#d2c8b1"/>
  <g stroke="#8c8577" stroke-width="2" stroke-linecap="round">
    <line x1="482" y1="368" x2="510" y2="368"/>
    <line x1="480" y1="372" x2="508" y2="372"/>
    <line x1="478" y1="376" x2="500" y2="376"/>
    <line x1="644" y1="368" x2="664" y2="368"/>
    <line x1="648" y1="372" x2="667" y2="372"/>
    <line x1="652" y1="376" x2="670" y2="376"/>
  </g>
  <rect x="484" y="364.5" width="20" height="2" fill="#4a4540"/>

