<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4d2"/>
      <stop offset="1" stop-color="#f6d79a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2c8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff2c8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fffbe9"/>
      <stop offset="1" stop-color="#fffbe9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall and floor -->
  <rect width="800" height="600" fill="#efdcbc"/>
  <rect y="510" width="800" height="90" fill="#b98f6b"/>
  <rect y="502" width="800" height="10" fill="#d9c3a0"/>
  <g stroke="#a98060" stroke-width="2">
    <line x1="0" y1="545" x2="800" y2="545"/>
    <line x1="0" y1="580" x2="800" y2="580"/>
  </g>

  <!-- Window (left) -->
  <rect x="44" y="64" width="166" height="246" rx="4" fill="#f7efe0"/>
  <rect x="58" y="78" width="138" height="218" fill="url(#sky)"/>
  <circle cx="92" cy="112" r="26" fill="#fff6d8"/>
  <rect x="58" y="78" width="138" height="218" fill="url(#glow)"/>
  <rect x="123" y="78" width="8" height="218" fill="#f7efe0"/>
  <rect x="58" y="183" width="138" height="8" fill="#f7efe0"/>
  <rect x="36" y="306" width="182" height="12" rx="3" fill="#e8d9c0"/>
