    <path transform="translate(240 362)" d="M0 -14 C-10 -22 -24 -16 -22 0 C-20 16 -8 21 0 18 C8 21 20 16 22 0 C24 -16 10 -22 0 -14 Z" fill="#b8473a"/>
    <path transform="translate(240 362)" d="M6 -16 C18 -18 24 -6 21 4 C18 14 10 19 4 18 C14 10 16 -4 6 -16 Z" fill="#9c3a30"/>
    <ellipse cx="232" cy="354" rx="5" ry="7" fill="#e07e6c" opacity="0.8"/>
    <path d="M240 349 C240 343 242 339 245 336" stroke="#5e3b24" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M243 340 C250 333 258 335 260 338 C254 343 248 343 243 340 Z" fill="#7d9a52"/>
  </g>
  <use href="#apple" x="44"/>
  <use href="#apple" x="88"/>

  <!-- Blue MONDAY mug -->
  <path d="M452 326 C478 326 478 368 450 366" stroke="#3d5f8f" stroke-width="9" fill="none"/>
  <path d="M396 314 H456 V366 C456 376 450 380 442 380 H410 C402 380 396 376 396 366 Z" fill="#4c72a6"/>
  <rect x="402" y="320" width="7" height="50" rx="3.5" fill="#7d9cc6" opacity="0.7"/>
  <ellipse cx="426" cy="314" rx="30" ry="4" fill="#3d5f8f"/>
  <ellipse cx="426" cy="314" rx="26" ry="2.6" fill="#5b3a26"/>
  <text x="427" y="352" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.8" text-anchor="middle" fill="#f6efe2">MONDAY</text>
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M418 304 C412 296 424 290 418 280"/>
    <path d="M432 304 C426 296 438 290 432 282"/>
  </g>

