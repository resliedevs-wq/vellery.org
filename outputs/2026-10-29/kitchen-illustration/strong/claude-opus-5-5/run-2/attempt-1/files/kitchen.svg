    <ellipse cx="292" cy="381" rx="22" ry="4"/>
    <ellipse cx="336" cy="381" rx="22" ry="4"/>
    <ellipse cx="438" cy="381" rx="40" ry="5"/>
    <ellipse cx="584" cy="388" rx="104" ry="4"/>
