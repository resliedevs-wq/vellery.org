  <path d="M44 60 C40 140 50 220 42 326" stroke="#c47a58" stroke-width="3" fill="none"/>
  <rect x="22" y="46" width="210" height="8" rx="4" fill="#9a6b4c"/>

  <!-- Sunbeam -->
  <polygon points="210,70 210,310 800,600 800,330" fill="url(#beam)"/>

  <!-- Floor shadow under table (cast right, away from window) -->
  <ellipse cx="460" cy="572" rx="280" ry="14" fill="#7d5a40" opacity="0.25"/>

  <!-- Table -->
  <rect x="192" y="404" width="22" height="160" fill="#8f5f3e"/>
  <rect x="646" y="404" width="22" height="160" fill="#7c5134"/>
  <rect x="192" y="404" width="7" height="160" fill="#a8744f"/>
  <polygon points="190,364 670,364 692,388 168,388" fill="#c48a5e"/>
  <polygon points="190,364 400,364 330,388 168,388" fill="#d59d70" opacity="0.6"/>
  <rect x="168" y="388" width="524" height="20" fill="#9c6a45"/>
  <rect x="168" y="388" width="524" height="4" fill="#b07a52"/>

  <!-- Object shadows on tabletop -->
  <g fill="#7a4e30" opacity="0.28">
