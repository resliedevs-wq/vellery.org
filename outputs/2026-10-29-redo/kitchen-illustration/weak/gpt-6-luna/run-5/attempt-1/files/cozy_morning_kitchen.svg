<rect x="205" y="76" width="500" height="355" rx="7" fill="#fff8e9" stroke="#9b6849" stroke-width="15"/>
<rect x="222" y="93" width="466" height="321" fill="#b8d8d5"/>
<circle cx="585" cy="154" r="48" fill="#f6c76d"/>
