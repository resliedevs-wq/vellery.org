<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">A cozy kitchen in the morning</title>
<desc id="desc">Warm sunlight pours through a kitchen window onto a wooden counter, breakfast table, steaming tea, bread, and a vase of flowers.</desc>
<defs>
  <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f7e8c9"/><stop offset="1" stop-color="#f3dcb6"/></linearGradient>
  <linearGradient id="sun" x2="1" y2="1"><stop stop-color="#fff4b5" stop-opacity=".78"/><stop offset="1" stop-color="#ffd77a" stop-opacity=".05"/></linearGradient>
  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#b77b4d"/><stop offset="1" stop-color="#865337"/></linearGradient>
  <pattern id="tile" width="82" height="66" patternUnits="userSpaceOnUse"><rect width="82" height="66" fill="#f7f0df"/><path d="M0 0H82M0 0V66" fill="none" stroke="#dfc9a4" stroke-width="2"/></pattern>
  <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<!-- room -->
<rect width="1200" height="800" fill="url(#wall)"/>
<path d="M0 577H1200V800H0Z" fill="url(#floor)"/>
<path d="M0 578H1200" stroke="#f4e3c1" stroke-width="12"/>
<!-- sunlight on wall -->
<path d="M206 235H693L1015 578H448Z" fill="url(#sun)"/>
