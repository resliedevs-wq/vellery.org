<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <title>A pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f2"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>

    <g id="wheel">
      <circle r="46" fill="none" stroke="#2b2b2b" stroke-width="6"/>
      <circle r="42" fill="none" stroke="#b8bec4" stroke-width="2"/>
      <g stroke="#9aa3ab" stroke-width="1.2">
        <line x1="0" y1="-42" x2="0" y2="42"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(22.5)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(45)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(67.5)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(90)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(112.5)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(135)"/>
        <line x1="0" y1="-42" x2="0" y2="42" transform="rotate(157.5)"/>
      </g>
      <rect x="-2.5" y="-32" width="5" height="9" rx="1.5" fill="#ff8a1f"/>
      <circle cy="-46" r="2" fill="#777"/>
      <circle r="5" fill="#555"/>
      <circle r="2" fill="#ccc"/>
    </g>

    <g id="cloud">
      <ellipse cx="0" cy="0" rx="26" ry="11" fill="#fff"/>
      <ellipse cx="-12" cy="-6" rx="14" ry="11" fill="#fff"/>
      <ellipse cx="10" cy="-9" rx="15" ry="13" fill="#fff"/>
    </g>

    <g id="bush">
      <ellipse cx="0" cy="0" rx="22" ry="14" fill="#5f9f48"/>
      <ellipse cx="14" cy="4" rx="16" ry="10" fill="#6aab52"/>
    </g>

    <!-- foot resting on a pedal, origin = pedal axle -->
    <g id="pedal">
      <rect x="-8" y="-2" width="16" height="4" rx="1" fill="#333"/>
    </g>
    <path id="foot" d="M-4,-2 Q4,-10 15,-3 L13,-1 L9,-2.5 L5,-1 L1,-2.5 L-3,-1 Z"/>
  </defs>

  <!-- sky -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="345" cy="48" r="22" fill="#ffe27a"/>
  <circle cx="345" cy="48" r="30" fill="#ffe27a" opacity="0.3"/>

  <!-- clouds (slow parallax) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="18s" repeatCount="indefinite"/>
    <use href="#cloud" x="70" y="55"/>
    <use href="#cloud" x="250" y="35" transform="scale(0.8)"/>
    <use href="#cloud" x="470" y="55"/>
    <use href="#cloud" x="750" y="35" transform="scale(0.8)"/>
  </g>

  <!-- distant hills and bushes (medium parallax) -->
  <path d="M0,240 Q60,205 130,232 T260,226 T400,236 L400,262 L0,262 Z" fill="#a9d68a"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="4s" repeatCount="indefinite"/>
    <use href="#bush" x="40" y="255"/>
    <use href="#bush" x="180" y="252"/>
    <use href="#bush" x="320" y="256"/>
    <use href="#bush" x="440" y="255"/>
    <use href="#bush" x="580" y="252"/>
    <use href="#bush" x="720" y="256"/>
  </g>

  <!-- road and grass -->
  <rect y="262" width="400" height="26" fill="#6e6e72"/>
  <rect y="288" width="400" height="12" fill="#7cb35a"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="1.04s" repeatCount="indefinite"/>
    <line x1="0" y1="277" x2="800" y2="277" stroke="#f4f4f4" stroke-width="3" stroke-dasharray="30 20"/>
    <g fill="#5a9440">
      <path d="M30,300 l3,-9 l2,9 l3,-7 l2,7 Z"/>
      <path d="M140,300 l2,-8 l3,8 l2,-10 l3,10 Z"/>
      <path d="M255,300 l3,-9 l2,9 l3,-7 l2,7 Z"/>
      <path d="M350,300 l2,-8 l3,8 l2,-10 l3,10 Z"/>
      <path d="M430,300 l3,-9 l2,9 l3,-7 l2,7 Z"/>
      <path d="M540,300 l2,-8 l3,8 l2,-10 l3,10 Z"/>
      <path d="M655,300 l3,-9 l2,9 l3,-7 l2,7 Z"/>
      <path d="M750,300 l2,-8 l3,8 l2,-10 l3,10 Z"/>
    </g>
    <circle cx="90" cy="268" r="1.5" fill="#555"/>
    <circle cx="300" cy="270" r="1.2" fill="#555"/>
    <circle cx="490" cy="268" r="1.5" fill="#555"/>
    <circle cx="700" cy="270" r="1.2" fill="#555"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <line x1="30" y1="150" x2="70" y2="150">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="15" y1="175" x2="62" y2="175">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <line x1="35" y1="198" x2="60" y2="198">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- shadow -->
  <ellipse cx="202" cy="267" rx="112" ry="4.5" fill="#000" opacity="0.18"/>

  <!-- ===== far-side leg, crank and pedal (behind the bike) ===== -->
  <line x1="195" y1="218" x2="175" y2="218" stroke="#3d3d3d" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" dur="1s" repeatCount="indefinite" values="175;177.7;185;195;205;212.3;215;212.3;205;195;185;177.7;175"/>
    <animate attributeName="y2" dur="1s" repeatCount="indefinite" values="218;208;200.7;198;200.7;208;218;228;235.3;238;235.3;228;218"/>
  </line>
  <path fill="none" stroke="#c46a28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M186,140 L214.1,183.7 L175,218">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="M186,140 L214.1,183.7 L175,218;M186,140 L220.7,178.7 L177.7,208;M186,140 L227.7,171.1 L185,200.7;M186,140 L232.9,162.4 L195,198;M186,140 L234.8,158.1 L205,200.7;M186,140 L233.7,160.6 L212.3,208;M186,140 L229.7,168.1 L215,218;M186,140 L222.5,177 L212.3,228;M186,140 L213.7,184 L205,235.3;M186,140 L207.2,187.5 L195,238;M186,140 L206.3,187.9 L185,235.3;M186,140 L209.1,186.6 L177.7,228;M186,140 L214.1,183.7 L175,218"/>
  </path>
  <g transform="translate(175 218)">
    <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite" values="175 218;177.7 208;185 200.7;195 198;205 200.7;212.3 208;215 218;212.3 228;205 235.3;195 238;185 235.3;177.7 228;175 218"/>
    <use href="#pedal"/>
    <use href="#foot" fill="#c46a28"/>
  </g>

  <!-- ===== wheels ===== -->
  <g transform="translate(115 220)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>
  <g transform="translate(290 220)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.75s" repeatCount="indefinite"/>
      <use href="#wheel"/>
    </g>
  </g>

  <!-- chain -->
  <path d="M115,213 L195,204 A14,14 0 0 1 195,232 L115,227 A7,7 0 0 1 115,213 Z" fill="none" stroke="#555" stroke-width="1.8" stroke-dasharray="2 1.5"/>

  <!-- ===== frame ===== -->
  <g stroke="#1f8a9e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="115" y1="220" x2="195" y2="218"/>  <!-- chainstay -->
    <line x1="115" y1="220" x2="178" y2="150"/>  <!-- seatstay -->
    <line x1="195" y1="218" x2="178" y2="150"/>  <!-- seat tube -->
    <line x1="178" y1="150" x2="262" y2="150"/>  <!-- top tube -->
    <line x1="195" y1="218" x2="268" y2="170"/>  <!-- down tube -->
    <line x1="268" y1="170" x2="290" y2="220" stroke="#17707f"/>  <!-- fork -->
    <line x1="262" y1="150" x2="268" y2="170" stroke-width="7"/>  <!-- head tube -->
  </g>
  <line x1="178" y1="150" x2="176" y2="144" stroke="#999" stroke-width="3.5"/>
  <line x1="262" y1="150" x2="259" y2="138" stroke="#999" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="115" cy="220" r="7" fill="#666"/>

  <!-- chainring -->
  <g transform="translate(195 218)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
      <circle r="14" fill="none" stroke="#888" stroke-width="3" stroke-dasharray="2.2 2.2"/>
      <circle r="12" fill="#aab2b8" stroke="#777" stroke-width="1"/>
      <g stroke="#777" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-10"/>
        <line x1="0" y1="0" x2="0" y2="-10" transform="rotate(72)"/>
        <line x1="0" y1="0" x2="0" y2="-10" transform="rotate(144)"/>
        <line x1="0" y1="0" x2="0" y2="-10" transform="rotate(216)"/>
        <line x1="0" y1="0" x2="0" y2="-10" transform="rotate(288)"/>
      </g>
      <circle r="3.5" fill="#555"/>
    </g>
  </g>

  <!-- saddle -->
  <path d="M160,145 Q176,138 196,142 Q194,148 178,148 Q164,150 160,145 Z" fill="#2e2e2e"/>

  <!-- ===== pelican ===== -->
  <!-- tail -->
  <path d="M150,112 L116,104 L124,115 L114,124 L148,130 Z" fill="#ebe7de" stroke="#c9c4b8" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- neck outline (bobs with head) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 206 104;-4 206 104;0 206 104" dur="0.5s" repeatCount="indefinite"/>
    <path d="M206,104 C224,88 200,70 214,52" fill="none" stroke="#c9c4b8" stroke-width="17" stroke-linecap="round"/>
  </g>

  <!-- body -->
  <path d="M140,118 C142,96 175,88 205,96 C226,102 230,124 216,136 C200,150 160,150 146,138 C140,133 139,125 140,118 Z" fill="#f7f5f0" stroke="#c9c4b8" stroke-width="1.5"/>
  <!-- folded wing with dark flight feathers -->
  <path d="M152,110 L126,112 L134,118 L124,122 L152,124 Z" fill="#2f2f2f"/>
  <path d="M150,108 C170,96 200,98 214,112 C205,124 180,130 155,126 C147,120 146,113 150,108 Z" fill="#e3dfd5" stroke="#c9c4b8" stroke-width="1"/>
  <path d="M165,112 Q182,108 198,114 M162,119 Q180,116 194,121" fill="none" stroke="#cfcabd" stroke-width="1"/>

  <!-- neck + head -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 206 104;-4 206 104;0 206 104" dur="0.5s" repeatCount="indefinite"/>
    <path d="M206,104 C224,88 200,70 214,52" fill="none" stroke="#f7f5f0" stroke-width="15" stroke-linecap="round"/>
    <!-- crest -->
    <path d="M209,43 Q200,36 207,35 Q203,29 213,38 Z" fill="#f2d16b"/>
    <!-- pouch -->
    <path d="M227,56 C252,62 280,68 298,72 C286,86 255,88 236,75 C230,70 227,64 227,56 Z" fill="#ec8b47" stroke="#c96d2c" stroke-width="1.2">
      <animate attributeName="d" dur="0.5s" repeatCount="indefinite" values="M227,56 C252,62 280,68 298,72 C286,86 255,88 236,75 C230,70 227,64 227,56 Z;M227,56 C252,62 280,68 298,72 C286,90 254,92 236,78 C230,72 227,64 227,56 Z;M227,56 C252,62 280,68 298,72 C286,86 255,88 236,75 C230,70 227,64 227,56 Z"/>
    </path>
    <!-- head -->
    <ellipse cx="218" cy="50" rx="13.5" ry="11.5" fill="#f7f5f0" stroke="#c9c4b8" stroke-width="1.2"/>
    <!-- upper beak -->
    <path d="M225,45 C250,50 276,58 300,66 Q306,69 301,73 C277,66 250,60 226,57 Z" fill="#f2a93b" stroke="#d58a20" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M232,51 C255,56 275,61 296,68" fill="none" stroke="#d58a20" stroke-width="0.8"/>
    <!-- eye -->
    <circle cx="221" cy="47" r="4" fill="#f6c9a0"/>
    <circle cx="221.6" cy="47" r="2" fill="#222"/>
    <circle cx="222.2" cy="46.3" r="0.6" fill="#fff"/>
  </g>

  <!-- ===== near-side crank, leg and pedal ===== -->
  <line x1="195" y1="218" x2="215" y2="218" stroke="#555" stroke-width="4" stroke-linecap="round">
    <animate attributeName="x2" dur="1s" repeatCount="indefinite" values="215;212.3;205;195;185;177.7;175;177.7;185;195;205;212.3;215"/>
    <animate attributeName="y2" dur="1s" repeatCount="indefinite" values="218;228;235.3;238;235.3;228;218;208;200.7;198;200.7;208;218"/>
  </line>
  <circle cx="195" cy="218" r="3" fill="#444"/>
  <path fill="none" stroke="#f08a3c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M186,140 L229.7,168.1 L215,218">
    <animate attributeName="d" dur="1s" repeatCount="indefinite" values="M186,140 L229.7,168.1 L215,218;M186,140 L222.5,177 L212.3,228;M186,140 L213.7,184 L205,235.3;M186,140 L207.2,187.5 L195,238;M186,140 L206.3,187.9 L185,235.3;M186,140 L209.1,186.6 L177.7,228;M186,140 L214.1,183.7 L175,218;M186,140 L220.7,178.7 L177.7,208;M186,140 L227.7,171.1 L185,200.7;M186,140 L232.9,162.4 L195,198;M186,140 L234.8,158.1 L205,200.7;M186,140 L233.7,160.6 L212.3,208;M186,140 L229.7,168.1 L215,218"/>
  </path>
  <g transform="translate(215 218)">
    <animateTransform attributeName="transform" type="translate" dur="1s" repeatCount="indefinite" values="215 218;212.3 228;205 235.3;195 238;185 235.3;177.7 228;175 218;177.7 208;185 200.7;195 198;205 200.7;212.3 208;215 218"/>
    <use href="#pedal"/>
    <use href="#foot" fill="#f08a3c"/>
  </g>
  <!-- thigh feathers covering the hip -->
  <ellipse cx="190" cy="138" rx="12" ry="8" fill="#f7f5f0" transform="rotate(25 190 138)"/>

  <!-- handlebar -->
  <path d="M250,140 Q260,131 272,135 Q279,139 275,147" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round"/>

  <!-- wing reaching forward to grip the handlebar -->
  <path d="M198,106 C224,106 246,118 262,131 L268,140 C250,134 228,128 204,124 Z" fill="#ebe7de" stroke="#c9c4b8" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M256,128 L270,133 L272,140 L266,143 L262,137 L254,135 Z" fill="#2f2f2f"/>
</svg>
