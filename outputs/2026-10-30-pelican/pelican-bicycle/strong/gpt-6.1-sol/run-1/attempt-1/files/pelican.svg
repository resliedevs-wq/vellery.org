<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a bicycle</title>
  <desc id="desc">A cheerful white pelican sits on the saddle of a teal bicycle and actively pedals. Its articulated legs follow the rotating cranks, both wheels spin, its scarf flutters, and road markings slide beneath the bicycle.</desc>
