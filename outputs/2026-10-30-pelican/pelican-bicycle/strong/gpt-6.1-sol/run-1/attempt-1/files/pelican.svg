    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f6ce94"/><stop offset="1" stop-color="#f9e7c6"/></linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.4" y2="1"><stop stop-color="#ffc366"/><stop offset="1" stop-color="#ed9851"/></linearGradient>
    <pattern id="road" width="200" height="12" patternUnits="userSpaceOnUse"><path d="M 12 6 H 77 M 102 6 H 119" stroke="#c6c9b4" stroke-width="3" stroke-linecap="round"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-200 0" dur="1.1s" repeatCount="indefinite"/></pattern>
  </defs>
