<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican pedals a blue bicycle along a sunny path. The wheels and cranks spin.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d9f3ff"/><stop offset="1" stop-color="#f4fbff"/></linearGradient>
    <linearGradient id="feather" x2="0.8" y2="1"><stop stop-color="#fffdf4"/><stop offset="1" stop-color="#e4e8e2"/></linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="7"/></filter>
    <g id="wheel">
      <circle r="124" fill="#f8fcff" stroke="#293d50" stroke-width="9"/>
      <circle r="115" fill="none" stroke="#83a0b0" stroke-width="2"/>
      <g stroke="#9ab2be" stroke-width="2">
        <path d="M0 0V-114 M0 0V114 M0 0H114 M0 0H-114 M0 0L81-81 M0 0L-81 81 M0 0L81 81 M0 0L-81-81"/>
        <path d="M0 0L44-105 M0 0L-44 105 M0 0L105 44 M0 0L-105-44 M0 0L105-44 M0 0L-105 44 M0 0L44 105 M0 0L-44-105" opacity=".55"/>
      </g>
      <circle r="9" fill="#ec6a4b" stroke="#293d50" stroke-width="3"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.5s" repeatCount="indefinite"/>
    </g>
  </defs>
  <rect width="900" height="600" fill="url(#sky)"/>
  <circle cx="760" cy="104" r="43" fill="#ffd166" opacity=".9"/>
  <g fill="#fff" opacity=".75"><ellipse cx="150" cy="115" rx="60" ry="15"/><ellipse cx="184" cy="108" rx="31" ry="20"/><ellipse cx="575" cy="155" rx="52" ry="13"/><ellipse cx="604" cy="147" rx="27" ry="18"/></g>
  <path d="M0 438 Q180 405 345 438 T680 430 T900 437 V600H0Z" fill="#e3f2dc"/>
  <path d="M0 485 Q220 468 450 486 T900 480 V600H0Z" fill="#d0e8c7"/>
  <ellipse cx="460" cy="561" rx="300" ry="21" fill="#647d83" opacity=".18" filter="url(#shadow)"/>
  <path d="M0 555 Q200 545 370 556 T900 551" fill="none" stroke="#fff" stroke-width="4" opacity=".75"/>
  <!-- spinning bicycle wheels -->
  <use href="#wheel" x="260" y="430"/>
  <use href="#wheel" x="660" y="430"/>
  <!-- bicycle frame -->
  <g fill="none" stroke="#2486a8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 430 L420 310 L450 430 L260 430 L570 300 L660 430 L450 430"/>
    <path d="M570 300 L585 275" stroke-width="15"/>
  </g>
  <g fill="none" stroke="#193d55" stroke-width="9" stroke-linecap="round">
    <path d="M389 298 Q420 289 450 298"/>
    <path d="M570 277 Q604 268 625 282"/>
  </g>
  <circle cx="260" cy="430" r="9" fill="#f8fcff" stroke="#293d50" stroke-width="4"/>
  <circle cx="660" cy="430" r="9" fill="#f8fcff" stroke="#293d50" stroke-width="4"/>
  <!-- seated pelican, with feet following the rotating pedals -->
  <!-- far leg -->
  <path d="M397 269 Q415 309 425 348 Q438 376 450 374" fill="none" stroke="#d58447" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.5s" repeatCount="indefinite" values="M397 269 Q415 309 425 348 Q438 376 450 374;M397 269 Q426 308 459 341 Q490 372 506 430;M397 269 Q419 306 432 340 Q439 358 450 486;M397 269 Q390 309 392 352 Q391 385 394 430;M397 269 Q415 309 425 348 Q438 376 450 374"/>
  </path>
  <!-- near leg -->
  <path d="M408 267 Q422 312 425 357 Q440 405 450 486" fill="none" stroke="#ef9a50" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="2.5s" repeatCount="indefinite" values="M408 267 Q422 312 425 357 Q440 405 450 486;M408 267 Q428 312 451 358 Q482 388 506 430;M408 267 Q420 311 431 344 Q442 359 450 374;M408 267 Q394 310 390 355 Q384 389 394 430;M408 267 Q422 312 425 357 Q440 405 450 486"/>
  </path>
  <g transform="translate(450 430)">
   <g fill="#f4b04e" stroke="#bd6b37" stroke-width="2">
    <ellipse cy="-56" rx="19" ry="9"/><ellipse cy="56" rx="20" ry="9"/>
   </g>
   <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <!-- crank and pedals -->
  <g transform="translate(450 430)">
    <g stroke="#293d50" stroke-width="8" stroke-linecap="round">
      <path d="M0 0V-56 M0 0V56"/>
      <path d="M-22 -56H22 M-22 56H22" stroke-width="7"/>
    </g>
    <circle r="12" fill="#f2b84b" stroke="#293d50" stroke-width="4"/>
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.5s" repeatCount="indefinite"/>
  </g>
  <!-- rider's body -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 2;0 0" dur="1.25s" repeatCount="indefinite"/>
    <!-- rounded seated body -->
    <ellipse cx="414" cy="249" rx="49" ry="39" fill="url(#feather)" stroke="#536b76" stroke-width="3"/>
    <path d="M388 244 Q413 220 443 239 Q428 259 396 264Z" fill="#b7c7c3" stroke="#536b76" stroke-width="2"/>
    <path d="M394 253 Q417 264 441 247" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <!-- upright neck -->
    <path d="M428 230 Q439 202 451 175 Q461 151 467 128" fill="none" stroke="#f7f5eb" stroke-width="27" stroke-linecap="round"/>
    <path d="M429 229 Q441 198 453 173" fill="none" stroke="#536b76" stroke-width="2" opacity=".5"/>
    <!-- head -->
    <ellipse cx="470" cy="119" rx="31" ry="27" fill="url(#feather)" stroke="#536b76" stroke-width="3"/>
    <circle cx="480" cy="116" r="4.5" fill="#263747"/>
    <circle cx="481.5" cy="114.5" r="1.4" fill="#fff"/>
    <!-- enormous pelican bill and pouch -->
    <path d="M493 126 Q537 128 574 148 Q541 163 505 145 Q496 139 493 126Z" fill="#f4a340" stroke="#a85a35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M501 143 Q532 172 557 151 Q538 174 512 159Z" fill="#e97859" stroke="#a85a35" stroke-width="2"/>
    <path d="M499 128 Q538 132 566 146" fill="none" stroke="#ffe09a" stroke-width="3" stroke-linecap="round"/>
    <path d="M453 108 Q465 92 483 100" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M391 281 Q404 290 423 282" fill="none" stroke="#536b76" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g fill="#41774d" opacity=".75"><path d="M80 460q8-26 16-34q2 22-8 38zM99 461q15-21 27-25q-8 22-23 29zM816 457q3-24 12-35q5 22-3 39zM833 459q15-18 29-20q-10 21-25 25z"/></g>
</svg>
