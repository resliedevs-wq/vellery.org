<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican sits on a bicycle saddle and pedals as the wheels spin.</desc>
  <defs>
    <linearGradient id="feather" x2="0" y2="1">
      <stop stop-color="#fffdf5"/><stop offset="1" stop-color="#e8e5d8"/>
    </linearGradient>
    <linearGradient id="beak" x2="0" y2="1">
      <stop stop-color="#ffb83e"/><stop offset="1" stop-color="#f07835"/>
    </linearGradient>
    <linearGradient id="frame" x2="0" y2="1">
      <stop stop-color="#36c9b3"/><stop offset="1" stop-color="#128f91"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#183b45" flood-opacity=".13"/>
    </filter>
  </defs>

  <!-- quiet backdrop -->
  <rect width="800" height="500" rx="28" fill="#f2faf8"/>
  <circle cx="662" cy="89" r="43" fill="#e1f3ee"/>
  <path d="M60 430H740" stroke="#dcebe7" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="406" cy="431" rx="255" ry="13" fill="#dcebe7" opacity=".62"/>

  <!-- wheels: the spoke groups spin about their hubs -->
  <g fill="none" stroke-linecap="round">
    <circle cx="220" cy="340" r="101" stroke="#223e49" stroke-width="12"/>
    <circle cx="220" cy="340" r="91" stroke="#9db6b6" stroke-width="2"/>
    <g transform="translate(220 340)">
      <g stroke="#9db6b6" stroke-width="2">
        <path d="M0-91V91M-91 0H91M-64-64L64 64M64-64L-64 64"/>
        <path d="M-35-84L35 84M35-84L-35 84M-84-35L84 35M84-35L-84 35" opacity=".72"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="220" cy="340" r="8" fill="#fff" stroke="#e99b42" stroke-width="5"/>

    <circle cx="580" cy="340" r="101" stroke="#223e49" stroke-width="12"/>
    <circle cx="580" cy="340" r="91" stroke="#9db6b6" stroke-width="2"/>
    <g transform="translate(580 340)">
      <g stroke="#9db6b6" stroke-width="2">
        <path d="M0-91V91M-91 0H91M-64-64L64 64M64-64L-64 64"/>
        <path d="M-35-84L35 84M35-84L-35 84M-84-35L84 35M84-35L-84 35" opacity=".72"/>
      </g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <circle cx="580" cy="340" r="8" fill="#fff" stroke="#e99b42" stroke-width="5"/>
  </g>

  <!-- bicycle frame -->
  <g fill="none" stroke="url(#frame)" stroke-width="11" stroke-linejoin="round" stroke-linecap="round">
    <path d="M220 340L365 340L328 224L220 340L447 224L580 340"/>
    <path d="M328 224L447 224" stroke-width="8"/>
  </g>
  <path d="M447 224L580 340" fill="none" stroke="#ef9f43" stroke-width="5" stroke-linecap="round"/>
  <!-- handlebar, fork and saddle -->
  <path d="M447 224L457 203M453 202L488 198M453 202L434 195" fill="none" stroke="#294752" stroke-width="7" stroke-linecap="round"/>
  <path d="M580 340L447 224" fill="none" stroke="#294752" stroke-width="6" stroke-linecap="round"/>
  <path d="M328 224L319 204" fill="none" stroke="#294752" stroke-width="7" stroke-linecap="round"/>
  <path d="M294 204Q318 194 343 204Q347 211 336 214H298Q288 212 294 204Z" fill="#ee8d4a"/>
  <path d="M350 340H380" stroke="#294752" stroke-width="7" stroke-linecap="round"/>

  <!-- far leg, pedaling in time with the far-side pedal -->
  <path d="M365 194 Q344 257 317 340 L303 347" fill="none" stroke="#e99742" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1"
      values="M365 194 Q344 257 317 340 L303 347;M365 194 Q330 248 365 292 L379 300;M365 194 Q383 253 413 340 L427 347;M365 194 Q403 251 365 388 L351 396;M365 194 Q344 257 317 340 L303 347"/>
  </path>

  <!-- pelican body and tail -->
  <g filter="url(#softShadow)">
    <path d="M320 153Q290 135 276 143Q287 162 315 171Z" fill="#e6e3d7"/>
    <ellipse cx="371" cy="153" rx="69" ry="45" transform="rotate(-8 371 153)" fill="url(#feather)"/>
    <path d="M330 163Q365 182 410 162" fill="none" stroke="#d8d7ca" stroke-width="3" stroke-linecap="round"/>
    <!-- curved neck -->
    <path d="M407 151Q424 137 426 116Q425 96 442 83" fill="none" stroke="#fdfbf2" stroke-width="29" stroke-linecap="round"/>
    <path d="M410 148Q425 132 425 116" fill="none" stroke="#e5e2d6" stroke-width="3" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="452" cy="78" r="27" fill="url(#feather)"/>
    <path d="M467 88Q518 91 572 108Q537 117 484 105Q468 102 458 96Z" fill="url(#beak)"/>
    <path d="M476 98Q510 111 548 111Q527 132 493 119Q478 113 476 98Z" fill="#ee8150"/>
    <path d="M480 99Q503 106 528 108" fill="none" stroke="#d6653a" stroke-width="2" opacity=".65"/>
    <circle cx="459" cy="72" r="3.6" fill="#203c46"/>
    <circle cx="460" cy="71" r="1.1" fill="#fff"/>
  </g>

  <!-- near leg; the foot follows the rotating crank -->
  <path d="M367 194 Q393 258 413 340 L427 347" fill="none" stroke="#f2a348" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" keyTimes="0;.25;.5;.75;1"
      values="M367 194 Q393 258 413 340 L427 347;M367 194 Q403 251 365 388 L351 396;M367 194 Q344 257 317 340 L303 347;M367 194 Q383 250 365 292 L379 300;M367 194 Q393 258 413 340 L427 347"/>
  </path>

  <!-- crank and pedals -->
  <g transform="rotate(0 365 340)">
    <path d="M365 340L413 340M365 340L317 340" stroke="#294752" stroke-width="8" stroke-linecap="round"/>
    <circle cx="365" cy="340" r="12" fill="#ef9f43" stroke="#294752" stroke-width="4"/>
    <path d="M401 340H429M305 340H333" stroke="#294752" stroke-width="8" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="rotate" from="0 365 340" to="360 365 340" dur="1.2s" repeatCount="indefinite"/>
  </g>
  <!-- small motion marks around the rear wheel -->
  <path d="M82 265L65 254M88 280L67 275" stroke="#72b8ad" stroke-width="4" stroke-linecap="round" opacity=".65"/>
  <path d="M690 284L708 276M691 302L711 299" stroke="#72b8ad" stroke-width="4" stroke-linecap="round" opacity=".65"/>
</svg>
