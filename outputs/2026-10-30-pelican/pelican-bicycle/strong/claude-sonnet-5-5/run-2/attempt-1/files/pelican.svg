<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0f5"/>
      <stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="45" ry="14" fill="#fff"/>
      <ellipse cx="-15" cy="-10" rx="22" ry="14" fill="#fff"/>
      <ellipse cx="14" cy="-13" rx="26" ry="17" fill="#fff"/>
    </g>
    <g id="wheel">
      <circle r="76" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="70" fill="none" stroke="#b9c2c9" stroke-width="2"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.6s" repeatCount="indefinite"/>
        <g stroke="#8a949b" stroke-width="1.5">
          <line x1="-70" y1="0" x2="70" y2="0"/>
          <line x1="-61" y1="-35" x2="61" y2="35"/>
          <line x1="-35" y1="-61" x2="35" y2="61"/>
          <line x1="0" y1="-70" x2="0" y2="70"/>
          <line x1="35" y1="-61" x2="-35" y2="61"/>
          <line x1="61" y1="-35" x2="-61" y2="35"/>
        </g>
        <circle cx="0" cy="-60" r="5" fill="#e53935"/>
        <circle cx="0" cy="60" r="5" fill="#fdd835"/>
      </g>
      <circle r="8" fill="#555"/>
    </g>
  </defs>

  <!-- sky & scenery -->
  <rect width="800" height="470" fill="url(#sky)"/>
  <circle cx="680" cy="70" r="36" fill="#ffe27a"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="40s" repeatCount="indefinite"/>
    <use href="#cloud" x="150" y="80"/>
    <use href="#cloud" x="520" y="130"/>
    <use href="#cloud" x="950" y="70"/>
    <use href="#cloud" x="1320" y="120"/>
  </g>
  <path d="M0,400 Q120,330 260,390 T520,380 T800,385 L800,470 L0,470 Z" fill="#9ed58b"/>
  <rect x="0" y="428" width="800" height="42" fill="#6b6f73"/>
  <line x1="0" y1="450" x2="800" y2="450" stroke="#f5f5f5" stroke-width="5" stroke-dasharray="40 30">
    <animate attributeName="stroke-dashoffset" from="0" to="490" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="428" x2="800" y2="428" stroke="#4a4d50" stroke-width="3"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="60" y1="170" x2="130" y2="170"><animate attributeName="x1" values="140;20" dur="0.5s" repeatCount="indefinite"/><animate attributeName="x2" values="200;80" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="40" y1="250" x2="120" y2="250"><animate attributeName="x1" values="120;0" dur="0.4s" repeatCount="indefinite"/><animate attributeName="x2" values="190;70" dur="0.4s" repeatCount="indefinite"/></line>
    <line x1="30" y1="320" x2="100" y2="320"><animate attributeName="x1" values="130;10" dur="0.45s" repeatCount="indefinite"/><animate attributeName="x2" values="190;70" dur="0.45s" repeatCount="indefinite"/></line>
  </g>

  <!-- rear wheel -->
  <use href="#wheel" x="215" y="350"/>

  <!-- far crank + far leg (leg B, half a turn out of phase) -->
  <path d="M370,355 L325,355" stroke="#555" stroke-width="7" stroke-linecap="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M370,355 L325,355;M370,355 L331,332.5;M370,355 L347.5,316;M370,355 L370,310;M370,355 L392.5,316;M370,355 L409,332.5;M370,355 L415,355;M370,355 L409,377.5;M370,355 L392.5,394;M370,355 L370,400;M370,355 L347.5,394;M370,355 L331,377.5;M370,355 L325,355"/>
  </path>
  <path d="M315,359 L335,359" stroke="#333" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M315,359 L335,359;M321,336.5 L341,336.5;M337.5,320 L357.5,320;M360,314 L380,314;M382.5,320 L402.5,320;M399,336.5 L419,336.5;M405,359 L425,359;M399,381.5 L419,381.5;M382.5,398 L402.5,398;M360,404 L380,404;M337.5,398 L357.5,398;M321,381.5 L341,381.5;M315,359 L335,359"/>
  </path>
  <path d="M335,222 L401.6,293.9 L325,355" stroke="#d9822b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M335,222 L401.6,293.9 L325,355;M335,222 L413.8,280.1 L331,332.5;M335,222 L426.3,257.7 L347.5,316;M335,222 L432.2,234.3 L370,310;M335,222 L432.9,226.7 L392.5,316;M335,222 L431.8,237.3 L409,332.5;M335,222 L426.3,257.6 L415,355;M335,222 L414.3,279.7 L409,377.5;M335,222 L399,296.2 L392.5,394;M335,222 L388.9,303.8 L370,400;M335,222 L387.7,304.6 L347.5,394;M335,222 L392.6,301.3 L331,377.5;M335,222 L401.6,293.9 L325,355"/>
  </path>
  <path d="M317,351 L351,357 L317,362 Z" fill="#d9822b" stroke="#a85f17" stroke-width="2" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M317,351 L351,357 L317,362 Z;M323,328.5 L357,334.5 L323,339.5 Z;M339.5,312 L373.5,318 L339.5,323 Z;M362,306 L396,312 L362,317 Z;M384.5,312 L418.5,318 L384.5,323 Z;M401,328.5 L435,334.5 L401,339.5 Z;M407,351 L441,357 L407,362 Z;M401,373.5 L435,379.5 L401,384.5 Z;M384.5,390 L418.5,396 L384.5,401 Z;M362,396 L396,402 L362,407 Z;M339.5,390 L373.5,396 L339.5,401 Z;M323,373.5 L357,379.5 L323,384.5 Z;M317,351 L351,357 L317,362 Z"/>
  </path>

  <!-- frame -->
  <g stroke="#1e6fb8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M215,350 L370,355"/>
    <path d="M215,350 L322,240"/>
    <path d="M370,355 L322,240"/>
    <path d="M322,240 L495,238"/>
    <path d="M370,355 L503,258"/>
    <path d="M495,238 L503,258"/>
    <path d="M503,258 Q540,300 565,350" stroke="#555"/>
    <path d="M495,238 L490,222 M490,222 L506,214 Q522,214 522,230" stroke="#333" stroke-width="5"/>
    <path d="M322,240 L322,236" stroke="#333"/>
  </g>
  <circle cx="215" cy="350" r="6" fill="#333"/>

  <!-- front wheel -->
  <use href="#wheel" x="565" y="350"/>

  <!-- chainring (turns with the cranks) -->
  <g transform="translate(370 355)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <circle r="21" fill="none" stroke="#666" stroke-width="5" stroke-dasharray="4 3"/>
      <circle r="14" fill="#888"/>
      <line x1="0" y1="0" x2="14" y2="0" stroke="#444" stroke-width="3"/>
    </g>
  </g>

  <!-- near crank + near leg (leg A) -->
  <path d="M370,355 L415,355" stroke="#444" stroke-width="8" stroke-linecap="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M370,355 L415,355;M370,355 L409,377.5;M370,355 L392.5,394;M370,355 L370,400;M370,355 L347.5,394;M370,355 L331,377.5;M370,355 L325,355;M370,355 L331,332.5;M370,355 L347.5,316;M370,355 L370,310;M370,355 L392.5,316;M370,355 L409,332.5;M370,355 L415,355"/>
  </path>
  <path d="M405,359 L425,359" stroke="#222" stroke-width="6" stroke-linecap="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M405,359 L425,359;M399,381.5 L419,381.5;M382.5,398 L402.5,398;M360,404 L380,404;M337.5,398 L357.5,398;M321,381.5 L341,381.5;M315,359 L335,359;M321,336.5 L341,336.5;M337.5,320 L357.5,320;M360,314 L380,314;M382.5,320 L402.5,320;M399,336.5 L419,336.5;M405,359 L425,359"/>
  </path>
  <path d="M335,222 L426.3,257.6 L415,355" stroke="#f08a24" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M335,222 L426.3,257.6 L415,355;M335,222 L414.3,279.7 L409,377.5;M335,222 L399,296.2 L392.5,394;M335,222 L388.9,303.8 L370,400;M335,222 L387.7,304.6 L347.5,394;M335,222 L392.6,301.3 L331,377.5;M335,222 L401.6,293.9 L325,355;M335,222 L413.8,280.1 L331,332.5;M335,222 L426.3,257.7 L347.5,316;M335,222 L432.2,234.3 L370,310;M335,222 L432.9,226.7 L392.5,316;M335,222 L431.8,237.3 L409,332.5;M335,222 L426.3,257.6 L415,355"/>
  </path>
  <path d="M407,351 L441,357 L407,362 Z" fill="#f08a24" stroke="#b9620f" stroke-width="2" stroke-linejoin="round">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M407,351 L441,357 L407,362 Z;M401,373.5 L435,379.5 L401,384.5 Z;M384.5,390 L418.5,396 L384.5,401 Z;M362,396 L396,402 L362,407 Z;M339.5,390 L373.5,396 L339.5,401 Z;M323,373.5 L357,379.5 L323,384.5 Z;M317,351 L351,357 L317,362 Z;M323,328.5 L357,334.5 L323,339.5 Z;M339.5,312 L373.5,318 L339.5,323 Z;M362,306 L396,312 L362,317 Z;M384.5,312 L418.5,318 L384.5,323 Z;M401,328.5 L435,334.5 L401,339.5 Z;M407,351 L441,357 L407,362 Z"/>
  </path>

  <!-- saddle -->
  <path d="M298,236 Q325,224 354,231 L352,240 Q325,244 300,242 Z" fill="#2b2b2b"/>

  <!-- pelican -->
  <g>
    <!-- tail -->
    <path d="M250,168 L192,184 L196,206 L252,204 Z" fill="#f4f4ee" stroke="#9a9a92" stroke-width="2" stroke-linejoin="round"/>
    <path d="M192,184 L196,206 L214,204 L210,180 Z" fill="#3a3a3a"/>
    <!-- body -->
    <ellipse cx="317" cy="182" rx="90" ry="50" transform="rotate(-8 317 182)" fill="#fafaf5" stroke="#9a9a92" stroke-width="2"/>
    <!-- wing reaching for the handlebar -->
    <path d="M325,150 C385,138 445,170 508,206 L504,220 C445,203 385,210 330,196 Z" fill="#eeeee6" stroke="#9a9a92" stroke-width="2" stroke-linejoin="round"/>
    <path d="M440,184 L508,206 L504,220 L430,198 Z" fill="#3a3a3a"/>
    <!-- neck + head, gently bobbing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 385 150;2 385 150;-2 385 150" dur="0.6s" repeatCount="indefinite"/>
      <path d="M375,155 C415,155 385,105 425,92" fill="none" stroke="#9a9a92" stroke-width="31" stroke-linecap="round"/>
      <path d="M375,155 C415,155 385,105 425,92" fill="none" stroke="#fafaf5" stroke-width="27" stroke-linecap="round"/>
      <circle cx="433" cy="84" r="21" fill="#fafaf5" stroke="#9a9a92" stroke-width="2"/>
      <path d="M418,68 Q408,56 396,60 Q408,66 412,76 Z" fill="#fafaf5" stroke="#9a9a92" stroke-width="2" stroke-linejoin="round"/>
      <!-- bill: pouch, upper mandible, hooked tip -->
      <path d="M448,92 Q505,160 574,108 L448,92 Z" fill="#f9cf7a" stroke="#c98a22" stroke-width="2" stroke-linejoin="round"/>
      <path d="M446,74 L576,97 Q586,100 580,107 Q576,110 572,106 L446,93 Z" fill="#f2a93b" stroke="#c98a22" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="438" cy="77" r="5" fill="#222"/>
      <circle cx="439.5" cy="75.5" r="1.6" fill="#fff"/>
    </g>
  </g>
  <!-- hand on the grip -->
  <circle cx="508" cy="213" r="6" fill="#3a3a3a"/>
</svg>
