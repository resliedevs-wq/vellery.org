<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <title>Pelican riding a bicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc4ef"/>
      <stop offset="1" stop-color="#d7f0ff"/>
    </linearGradient>
    <g id="cloud" fill="#ffffff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="30" ry="14"/>
      <ellipse cx="-18" cy="6" rx="18" ry="11"/>
      <ellipse cx="22" cy="6" rx="20" ry="12"/>
    </g>
  </defs>

  <!-- Sky, sun and slowly drifting clouds (parallax: the bike moves right, so the sky drifts left) -->
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="700" cy="70" r="34" fill="#ffd54a"/>
  <g>
    <use xlink:href="#cloud" x="-340" y="70"/>
    <use xlink:href="#cloud" x="-140" y="115"/>
    <use xlink:href="#cloud" x="60" y="70"/>
    <use xlink:href="#cloud" x="260" y="115"/>
    <use xlink:href="#cloud" x="460" y="70"/>
    <use xlink:href="#cloud" x="660" y="115"/>
    <use xlink:href="#cloud" x="860" y="70"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="30s" repeatCount="indefinite"/>
  </g>

  <!-- Road with dashes scrolling at the rolling speed of the wheels -->
  <rect y="400" width="800" height="100" fill="#4b5058"/>
  <rect y="400" width="800" height="4" fill="#9aa1a9"/>
  <g>
    <rect x="-108" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="10" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="128" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="246" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="364" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="482" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="600" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="718" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="836" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <rect x="954" y="440" width="60" height="6" rx="3" fill="#f4f4f4"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-118 0" dur="0.2s" repeatCount="indefinite"/>
  </g>

  <!-- Everything below is the bicycle and pelican, shifted to centre the composition -->
  <g transform="translate(45 0)">

    <!-- Rear wheel (hub 230,325; spokes and cog spin forward, i.e. clockwise) -->
    <g>
      <circle cx="230" cy="325" r="75" fill="none" stroke="#222" stroke-width="9"/>
      <circle cx="230" cy="325" r="66" fill="none" stroke="#c9ced4" stroke-width="2"/>
      <g stroke="#9aa3ad" stroke-width="1.3">
        <line x1="230" y1="325" x2="287" y2="325"/>
        <line x1="230" y1="325" x2="263" y2="382"/>
        <line x1="230" y1="325" x2="197" y2="382"/>
        <line x1="230" y1="325" x2="173" y2="325"/>
        <line x1="230" y1="325" x2="197" y2="268"/>
        <line x1="230" y1="325" x2="263" y2="268"/>
        <circle cx="230" cy="325" r="13" fill="none" stroke="#444" stroke-width="2.5" stroke-dasharray="3 3"/>
        <animateTransform attributeName="transform" type="rotate" from="0 230 325" to="360 230 325" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle cx="230" cy="325" r="7" fill="#555"/>
    </g>

    <!-- Front wheel (hub 480,325) -->
    <g>
      <circle cx="480" cy="325" r="75" fill="none" stroke="#222" stroke-width="9"/>
      <circle cx="480" cy="325" r="66" fill="none" stroke="#c9ced4" stroke-width="2"/>
      <g stroke="#9aa3ad" stroke-width="1.3">
        <line x1="480" y1="325" x2="537" y2="325"/>
        <line x1="480" y1="325" x2="513" y2="382"/>
        <line x1="480" y1="325" x2="447" y2="382"/>
        <line x1="480" y1="325" x2="423" y2="325"/>
        <line x1="480" y1="325" x2="447" y2="268"/>
        <line x1="480" y1="325" x2="513" y2="268"/>
        <animateTransform attributeName="transform" type="rotate" from="0 480 325" to="360 480 325" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle cx="480" cy="325" r="7" fill="#555"/>
    </g>

    <!-- Chain between chainring (318,325) and rear cog (230,325) -->
    <g stroke="#3a3a3a" stroke-width="2.5" fill="none">
      <line x1="318" y1="301" x2="230" y2="312"/>
      <line x1="318" y1="349" x2="230" y2="338"/>
    </g>

    <!-- Frame -->
    <g fill="none" stroke="#c0392b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M318,325 L290,182 L430,230 L440,262 L318,325"/>
      <path d="M318,325 L230,325 L290,182"/>
      <path d="M440,262 L480,325"/>
    </g>
    <path d="M430,230 L446,196 L472,190" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Crank set: chainring and two crank arms rotate clockwise (forward) once per 1.6 s -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 318 325" to="360 318 325" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="318" cy="325" r="24" fill="none" stroke="#555" stroke-width="3" stroke-dasharray="4 3"/>
      <line x1="318" y1="325" x2="356" y2="325" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <line x1="318" y1="325" x2="280" y2="325" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    </g>
    <circle cx="318" cy="325" r="7" fill="#333"/>

    <!-- Saddle (the pelican sits on it at hip position 290,176) -->
    <path d="M256,184 C258,174 280,172 318,170 C324,172 322,186 312,187 L266,190 C258,190 256,188 256,184 Z" fill="#222"/>

    <!-- Far leg (drawn behind the body). Knee and ankle positions are precomputed for each crank step. -->
    <path fill="none" stroke="#c9782a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M290,176 L353.3,225">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="M290,176 L353.3,225;M290,176 L360.5,213.9;M290,176 L366.4,199.7;M290,176 L369.5,184.7;M290,176 L369.9,173.8;M290,176 L369.8,170.8;M290,176 L370,175.8;M290,176 L369.3,186.6;M290,176 L366.2,200.4;M290,176 L360,214.7;M290,176 L351.6,227.1;M290,176 L343.4,235.6;M290,176 L338.3,239.7;M290,176 L337.8,240.1;M290,176 L340.9,237.7;M290,176 L346.4,232.7;M290,176 L353.3,225"/>
    </path>
    <path fill="none" stroke="#c9782a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M353.3,225 L280,320">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="M353.3,225 L280,320;M360.5,213.9 L282.9,305.5;M366.4,199.7 L291.1,293.1;M369.5,184.7 L303.5,284.9;M369.9,173.8 L318,282;M369.8,170.8 L332.5,284.9;M370,175.8 L344.9,293.1;M369.3,186.6 L353.1,305.5;M366.2,200.4 L356,320;M360,214.7 L353.1,334.5;M351.6,227.1 L344.9,346.9;M343.4,235.6 L332.5,355.1;M338.3,239.7 L318,358;M337.8,240.1 L303.5,355.1;M340.9,237.7 L291.1,346.9;M346.4,232.7 L282.9,334.5;M353.3,225 L280,320"/>
    </path>
    <!-- Far foot and pedal ride on the crank, moving with it -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="280 325;282.9 310.5;291.1 298.1;303.5 289.9;318 287;332.5 289.9;344.9 298.1;353.1 310.5;356 325;353.1 339.5;344.9 351.9;332.5 360.1;318 363;303.5 360.1;291.1 351.9;282.9 339.5;280 325"/>
      <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#2b2b2b"/>
      <ellipse cx="3" cy="-6" rx="9" ry="4" fill="#b5651d"/>
    </g>

    <!-- Near leg -->
    <path fill="none" stroke="#f0a040" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" d="M290,176 L366.2,200.4">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="M290,176 L366.2,200.4;M290,176 L360,214.7;M290,176 L351.6,227.1;M290,176 L343.4,235.6;M290,176 L338.3,239.7;M290,176 L337.8,240.1;M290,176 L340.9,237.7;M290,176 L346.4,232.7;M290,176 L353.3,225;M290,176 L360.5,213.9;M290,176 L366.4,199.7;M290,176 L369.5,184.7;M290,176 L369.9,173.8;M290,176 L369.8,170.8;M290,176 L370,175.8;M290,176 L369.3,186.6;M290,176 L366.2,200.4"/>
    </path>
    <path fill="none" stroke="#f0a040" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M366.2,200.4 L356,320">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="M366.2,200.4 L356,320;M360,214.7 L353.1,334.5;M351.6,227.1 L344.9,346.9;M343.4,235.6 L332.5,355.1;M338.3,239.7 L318,358;M337.8,240.1 L303.5,355.1;M340.9,237.7 L291.1,346.9;M346.4,232.7 L282.9,334.5;M353.3,225 L280,320;M360.5,213.9 L282.9,305.5;M366.4,199.7 L291.1,293.1;M369.5,184.7 L303.5,284.9;M369.9,173.8 L318,282;M369.8,170.8 L332.5,284.9;M370,175.8 L344.9,293.1;M369.3,186.6 L353.1,305.5;M366.2,200.4 L356,320"/>
    </path>
    <!-- Near foot and pedal -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0625;0.125;0.1875;0.25;0.3125;0.375;0.4375;0.5;0.5625;0.625;0.6875;0.75;0.8125;0.875;0.9375;1" values="356 325;353.1 339.5;344.9 351.9;332.5 360.1;318 363;303.5 360.1;291.1 351.9;282.9 339.5;280 325;282.9 310.5;291.1 298.1;303.5 289.9;318 287;332.5 289.9;344.9 298.1;353.1 310.5;356 325"/>
      <rect x="-10" y="-2.5" width="20" height="5" rx="2" fill="#2b2b2b"/>
      <ellipse cx="3" cy="-6" rx="9" ry="4" fill="#f29b38"/>
    </g>

    <!-- Pelican body -->
    <path d="M250,140 L204,156 L210,178 L250,168 Z" fill="#6f7781" stroke="#4d555d" stroke-width="1.5" stroke-linejoin="round"/>
    <ellipse cx="305" cy="148" rx="68" ry="34" transform="rotate(-24 305 148)" fill="#f7f5f0" stroke="#4d555d" stroke-width="2"/>

    <!-- Folded wing, gently flapping at the shoulder -->
    <path d="M334,126 Q296,102 238,150 Q296,150 338,140 Z" fill="#8c959e" stroke="#4d555d" stroke-width="1.5" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="rotate" values="0 334 126;-6 334 126;0 334 126" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- Wing-arm holding the handlebar -->
    <line x1="352" y1="136" x2="470" y2="192" stroke="#8c959e" stroke-width="11" stroke-linecap="round"/>

    <!-- Neck (outline, then white) -->
    <path d="M352,124 Q372,104 386,80" fill="none" stroke="#4d555d" stroke-width="29" stroke-linecap="round"/>
    <path d="M352,124 Q372,104 386,80" fill="none" stroke="#f7f5f0" stroke-width="25" stroke-linecap="round"/>

    <!-- Head, eye and bill with pouch -->
    <circle cx="388" cy="76" r="17" fill="#f7f5f0" stroke="#4d555d" stroke-width="2"/>
    <path d="M400,70 Q462,86 516,106 L404,90 Z" fill="#efc64a" stroke="#7a5c12" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M404,90 Q424,132 462,126 Q496,120 516,106 Q498,126 466,136 Q424,146 402,100 Z" fill="#f08a2c" stroke="#7a4512" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="395" cy="71" r="4.5" fill="#ffffff" stroke="#4d555d" stroke-width="1"/>
    <circle cx="396" cy="71" r="2.2" fill="#1d1d1d"/>
  </g>
</svg>
