<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Pelican on a bicycle</title>
  <desc id="desc">A cheerful white pelican sits on the saddle of a sea-green bicycle, grips the handlebar with its wing, and pedals continuously. Its webbed feet follow the rotating cranks, both wheels spin, and the seaside scenery glides past.</desc>
