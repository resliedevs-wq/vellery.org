<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <!-- sky & ground -->
  <rect width="600" height="450" fill="#cdeefd"/>
  <circle cx="520" cy="70" r="38" fill="#ffd94a"/>
  <rect y="395" width="600" height="55" fill="#8fd17a"/>
  <line x1="0" y1="400" x2="600" y2="400" stroke="#5aa64a" stroke-width="3"/>

  <!-- motion lines -->
  <g stroke="#7fb6d6" stroke-width="4" stroke-linecap="round">
    <line x1="40" y1="160" x2="110" y2="160"/>
    <line x1="20" y1="200" x2="100" y2="200"/>
    <line x1="50" y1="240" x2="105" y2="240"/>
  </g>

  <!-- wheels -->
  <g fill="none" stroke="#333" stroke-width="6">
    <circle cx="170" cy="330" r="68"/>
    <circle cx="430" cy="330" r="68"/>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <line x1="170" y1="262" x2="170" y2="398"/><line x1="102" y1="330" x2="238" y2="330"/>
    <line x1="122" y1="282" x2="218" y2="378"/><line x1="218" y1="282" x2="122" y2="378"/>
    <line x1="430" y1="262" x2="430" y2="398"/><line x1="362" y1="330" x2="498" y2="330"/>
    <line x1="382" y1="282" x2="478" y2="378"/><line x1="478" y1="282" x2="382" y2="378"/>
  </g>
  <circle cx="170" cy="330" r="6" fill="#333"/>
  <circle cx="430" cy="330" r="6" fill="#333"/>

  <!-- frame -->
  <g fill="none" stroke="#d6336c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="170,330 290,330 255,222 170,330"/>
    <line x1="255" y1="222" x2="395" y2="218"/>
    <line x1="290" y1="330" x2="402" y2="242"/>
    <line x1="395" y1="212" x2="430" y2="330"/>
  </g>
  <!-- handlebar & seat -->
  <path d="M395 214 L388 186 L362 182" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
  <path d="M228 214 Q255 204 278 214 Z" fill="#333" stroke="#333" stroke-width="6" stroke-linejoin="round"/>

  <!-- crank & pedals -->
  <circle cx="290" cy="330" r="14" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="268" y1="306" x2="312" y2="354" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <rect x="256" y="302" width="24" height="7" rx="2" fill="#222"/>
  <rect x="300" y="351" width="24" height="7" rx="2" fill="#222"/>

  <!-- far leg -->
  <g stroke="#f08c00" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="262,212 292,250 268,302"/>
  </g>
  <path d="M256 302 L282 302 L270 292 Z" fill="#f08c00"/>

  <!-- tail -->
  <path d="M200 175 L160 160 L172 178 L155 190 L205 195 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="262" cy="178" rx="70" ry="44" fill="#ffffff" stroke="#adb5bd" stroke-width="3" transform="rotate(-12 262 178)"/>

  <!-- neck -->
  <path d="M300 160 C335 140 320 110 340 88 L360 98 C345 120 360 150 318 185 Z" fill="#ffffff" stroke="#adb5bd" stroke-width="3" stroke-linejoin="round"/>

  <!-- near leg -->
  <g stroke="#f76707" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="282,212 330,262 312,350"/>
  </g>
  <path d="M298 351 L328 351 L314 340 Z" fill="#f76707"/>

  <!-- wing reaching to handlebar -->
  <path d="M220 160 C260 140 320 150 365 182 C330 190 290 200 240 196 C222 190 215 175 220 160 Z" fill="#ced4da" stroke="#868e96" stroke-width="2.5"/>
  <g stroke="#868e96" stroke-width="2" fill="none">
    <path d="M250 165 C280 165 310 172 340 182"/>
    <path d="M245 180 C275 182 300 186 325 188"/>
  </g>

  <!-- head -->
  <circle cx="352" cy="82" r="24" fill="#ffffff" stroke="#adb5bd" stroke-width="3"/>
  <path d="M340 60 Q352 48 366 60" fill="none" stroke="#ffd43b" stroke-width="4" stroke-linecap="round"/>

  <!-- beak & pouch -->
  <path d="M370 76 L480 96 L372 92 Z" fill="#ffa94d" stroke="#e8590c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M372 92 L480 96 C450 135 395 140 368 100 Z" fill="#ffc078" stroke="#e8590c" stroke-width="2" stroke-linejoin="round"/>
  <path d="M476 92 L486 100 L478 100 Z" fill="#e8590c"/>

  <!-- eye -->
  <circle cx="358" cy="76" r="6" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <circle cx="360" cy="76" r="3" fill="#111"/>
  <circle cx="361" cy="75" r="1" fill="#fff"/>
</svg>
