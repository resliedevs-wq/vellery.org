<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#cfeaf7"/>
  <rect y="520" width="800" height="80" fill="#9bc77a"/>
  <circle cx="680" cy="90" r="45" fill="#ffe27a"/>

  <!-- rear wheel -->
  <g fill="none" stroke="#222" stroke-width="8">
    <circle cx="250" cy="450" r="88"/>
    <circle cx="550" cy="450" r="88"/>
  </g>
  <g stroke="#888" stroke-width="2">
    <path d="M250 362V538M162 450H338M188 388L312 512M312 388L188 512"/>
    <path d="M550 362V538M462 450H638M488 388L612 512M612 388L488 512"/>
  </g>

  <!-- bike frame -->
  <g fill="none" stroke="#d33a2c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 450L370 350L500 350L400 450Z"/>
    <path d="M370 350L400 450"/>
    <path d="M500 350L550 450"/>
    <path d="M500 350L492 322"/>
  </g>
  <path d="M470 320H515" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <path d="M345 332H390" stroke="#222" stroke-width="12" stroke-linecap="round"/>
  <path d="M368 340L372 350" stroke="#222" stroke-width="8"/>
  <circle cx="400" cy="450" r="14" fill="#555"/>
  <circle cx="250" cy="450" r="8" fill="#555"/>
  <circle cx="550" cy="450" r="8" fill="#555"/>

  <!-- far leg + pedal -->
  <path d="M365 320L395 380L370 465" fill="none" stroke="#e8920c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M355 468H388" stroke="#222" stroke-width="8" stroke-linecap="round"/>

  <!-- tail -->
  <path d="M290 280L215 300L285 318Z" fill="#f2f2f2" stroke="#999" stroke-width="3" stroke-linejoin="round"/>

  <!-- neck -->
  <path d="M385 262C440 270 420 215 440 200C460 185 470 190 470 190L450 215C440 230 460 275 400 305Z" fill="#fafafa" stroke="#999" stroke-width="3" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="350" cy="285" rx="82" ry="48" transform="rotate(-10 350 285)" fill="#fafafa" stroke="#999" stroke-width="3"/>

  <!-- head -->
  <circle cx="455" cy="188" r="25" fill="#fafafa" stroke="#999" stroke-width="3"/>

  <!-- beak: upper -->
  <path d="M472 180L605 218L478 198Z" fill="#f4a31c" stroke="#b36b00" stroke-width="3" stroke-linejoin="round"/>
  <!-- pouch -->
  <path d="M478 198L605 218C585 270 500 270 472 215Z" fill="#ffc94d" stroke="#b36b00" stroke-width="3" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="458" cy="182" r="6" fill="#111"/>
  <circle cx="460" cy="180" r="2" fill="#fff"/>

  <!-- wing / arm to handlebar -->
  <path d="M345 262C390 250 460 290 512 318C500 330 440 320 395 310C350 300 320 290 345 262Z" fill="#9aa7b5" stroke="#5c6a78" stroke-width="3" stroke-linejoin="round"/>

  <!-- near leg + pedal -->
  <path d="M345 325L412 372L408 442" fill="none" stroke="#f5a623" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M395 444H430" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <path d="M430 444l14 6M395 444l-8 6" stroke="#f5a623" stroke-width="6" stroke-linecap="round"/>
</svg>
