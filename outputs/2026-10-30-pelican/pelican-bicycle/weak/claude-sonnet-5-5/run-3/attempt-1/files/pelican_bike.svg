<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="800" height="600">
  <rect width="400" height="300" fill="#cfe9f7"/>
  <rect y="245" width="400" height="55" fill="#8fc27a"/>
  <circle cx="340" cy="50" r="24" fill="#ffe27a"/>

  <!-- wheels -->
  <g fill="none" stroke="#222" stroke-width="5">
    <circle cx="110" cy="210" r="40"/>
    <circle cx="290" cy="210" r="40"/>
  </g>
  <g stroke="#888" stroke-width="1.5">
    <line x1="110" y1="170" x2="110" y2="250"/><line x1="70" y1="210" x2="150" y2="210"/>
    <line x1="82" y1="182" x2="138" y2="238"/><line x1="138" y1="182" x2="82" y2="238"/>
    <line x1="290" y1="170" x2="290" y2="250"/><line x1="250" y1="210" x2="330" y2="210"/>
    <line x1="262" y1="182" x2="318" y2="238"/><line x1="318" y1="182" x2="262" y2="238"/>
  </g>

  <!-- bike frame -->
  <g fill="none" stroke="#d33" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 210 L170 210 L150 140 L250 140 L290 210"/>
    <path d="M170 210 L250 140"/>
    <path d="M250 140 L262 115 M248 115 L282 115"/>
    <path d="M150 140 L145 125"/>
  </g>
  <rect x="130" y="118" width="38" height="9" rx="4" fill="#222"/>
  <circle cx="170" cy="210" r="8" fill="#555"/>

  <!-- pedal leg -->
  <path d="M165 135 L185 180 L172 212" fill="none" stroke="#f5a623" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="172" cy="215" rx="12" ry="4" fill="#f5a623"/>

  <!-- body -->
  <ellipse cx="170" cy="100" rx="52" ry="36" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <!-- wing reaching to handlebars -->
  <path d="M185 95 Q230 100 258 114" fill="none" stroke="#9aa7b3" stroke-width="12" stroke-linecap="round"/>
  <path d="M130 90 Q115 80 120 62 Q140 75 150 90 Z" fill="#9aa7b3"/>

  <!-- neck and head -->
  <path d="M205 80 Q235 70 232 45" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
  <circle cx="234" cy="40" r="17" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <circle cx="240" cy="36" r="3.5" fill="#222"/>
  <!-- beak -->
  <path d="M248 36 L320 44 Q300 60 250 50 Z" fill="#f5a623" stroke="#c77d0a" stroke-width="2"/>
  <path d="M250 50 Q285 72 305 52" fill="#ffcf66" stroke="#c77d0a" stroke-width="2"/>
  <!-- helmet -->
  <path d="M217 38 Q220 16 240 18 Q254 22 252 34 Z" fill="#3a7bd5"/>
</svg>
