  <!-- front leg -->
  <path d="M385 315L445 372L415 462" fill="none" stroke="#f08a1c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M415 462l22 4M415 462l16 -8M415 462l10 10" stroke="#f08a1c" stroke-width="6" stroke-linecap="round"/>

