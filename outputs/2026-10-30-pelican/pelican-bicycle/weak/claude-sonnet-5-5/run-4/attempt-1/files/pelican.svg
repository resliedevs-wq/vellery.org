<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <rect width="600" height="400" fill="#cfe9f7"/>
  <rect y="368" width="600" height="32" fill="#8fc27a"/>

  <!-- back leg (behind frame) -->
  <path d="M255 208 L275 262 L282 272" fill="none" stroke="#e08a1e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bike -->
  <g fill="none" stroke="#2b2b2b" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="170" cy="298" r="68" stroke-width="6"/>
    <circle cx="430" cy="298" r="68" stroke-width="6"/>
    <circle cx="170" cy="298" r="5" fill="#2b2b2b"/>
    <circle cx="430" cy="298" r="5" fill="#2b2b2b"/>
    <g stroke="#d6322e" stroke-width="7">
      <path d="M170 298 L300 298 L275 222 Z"/>
      <path d="M275 222 L385 215 L300 298"/>
      <path d="M385 215 L430 298"/>
    </g>
    <path d="M385 215 L392 195 L418 192" stroke-width="6"/>
    <path d="M262 214 L290 214" stroke-width="9"/>
    <path d="M275 222 L275 214" stroke-width="5"/>
    <path d="M300 298 L282 272 M300 298 L320 328" stroke-width="6"/>
    <path d="M312 330 L330 330" stroke-width="7"/>
  </g>

  <!-- tail -->
  <path d="M222 178 L170 196 L226 204 Z" fill="#e8e8e8" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="265" cy="178" rx="58" ry="38" transform="rotate(-12 265 178)" fill="#f7f7f7" stroke="#555" stroke-width="3"/>

  <!-- front leg -->
  <path d="M268 208 L302 262 L320 326" fill="none" stroke="#e08a1e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312 330 L334 330" stroke="#e08a1e" stroke-width="6" stroke-linecap="round"/>

  <!-- neck -->
  <path d="M296 155 C340 150 300 115 338 98" fill="none" stroke="#555" stroke-width="24" stroke-linecap="round"/>
  <path d="M296 155 C340 150 300 115 338 98" fill="none" stroke="#f7f7f7" stroke-width="19" stroke-linecap="round"/>

  <!-- wing reaching for handlebar -->
  <path d="M262 160 Q330 175 414 194" fill="none" stroke="#555" stroke-width="20" stroke-linecap="round"/>
  <path d="M262 160 Q330 175 414 194" fill="none" stroke="#9fb3c8" stroke-width="15" stroke-linecap="round"/>

  <!-- head -->
  <circle cx="345" cy="92" r="19" fill="#f7f7f7" stroke="#555" stroke-width="3"/>
  <!-- pouch + bill -->
  <path d="M358 98 Q410 125 462 120 Q420 160 358 108 Z" fill="#f2c14e" stroke="#9a6b12" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M356 84 Q410 92 466 118 Q410 112 358 100 Z" fill="#e08a1e" stroke="#9a6b12" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="350" cy="87" r="4" fill="#111"/>
  <circle cx="351.5" cy="85.5" r="1.3" fill="#fff"/>
  <!-- crest -->
  <path d="M332 76 Q318 64 322 56 Q336 62 342 74" fill="#f7f7f7" stroke="#555" stroke-width="2.5" stroke-linejoin="round"/>
