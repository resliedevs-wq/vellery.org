    <path d="M265 514L389 377L459 514ZM389 377H617L459 514M617 377L689 514" fill="none" stroke="#e97862" stroke-width="9"/>
    <path d="M389 377l-10-31M617 377l-16-48q-3-11 12-12h40" fill="none" stroke-width="9"/>
