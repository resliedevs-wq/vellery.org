<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <title>A pelican riding a bicycle</title>
  <desc>A smiling white pelican with a long golden bill pedals a coral bicycle beside the sea, wearing a teal scarf.</desc>
