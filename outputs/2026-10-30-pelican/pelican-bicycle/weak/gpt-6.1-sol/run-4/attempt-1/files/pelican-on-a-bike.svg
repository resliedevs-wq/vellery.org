  <path d="M524 264c-29-12-53-9-75-25l9 24-25 8c33 12 61 14 88 10" fill="#e77d65" stroke="#25464a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M522 253c10 9 21 14 36 15l-7 20c-16 0-31-8-40-16Z" fill="#ed8b70" stroke="#25464a" stroke-width="4"/>
  <!-- The near wing reaches forward to steer. -->
  <path d="M389 324c26-8 49 6 76 27 27 20 47 25 72 12l101-59c10-6 22-1 21 7-1 6-7 11-15 14l-96 65c-29 18-69 18-106-4-22-13-40-20-51-30" fill="#eff4e9" stroke="#25464a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M408 341c29 3 43 33 77 36m-79-22c17 5 28 17 38 24" fill="none" stroke="#b8cdbf" stroke-width="4" stroke-linecap="round"/>
  <!-- A bent leg and a broad webbed foot push the pedal. -->
  <path d="m480 429-13 45 68 61" fill="none" stroke="#25464a" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m480 429-13 45 68 61" fill="none" stroke="#efb455" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m498 550 47 22" stroke="#25464a" stroke-width="8" stroke-linecap="round"/>
  <path d="m527 527 37 12-6 10 25 19-64-3 9-18Z" fill="#f5bc5c" stroke="#25464a" stroke-width="4" stroke-linejoin="round"/>
  <path d="m537 545 21 12m-26-6 5 11" fill="none" stroke="#d39140" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M526 575h54" stroke="#25464a" stroke-width="10" stroke-linecap="round"/>
  <!-- Little signs of forward motion. -->
  <g fill="none" stroke="#83aaa0" stroke-width="4" stroke-linecap="round">
    <path d="M190 404h56m-76 19h50m-17 19h38"/>
  </g>
  <g fill="#d0aa65">
    <circle cx="201" cy="680" r="3"/><circle cx="799" cy="690" r="3"/><circle cx="841" cy="675" r="2"/>
  </g>
</svg>
