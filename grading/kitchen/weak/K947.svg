  <path d="M365 375q0-56 55-56t55 56z" fill="#b96d52" stroke="#744b3b" stroke-width="6"/><path d="M475 336q38-10 27 25-8 20-29 10" fill="none" stroke="#744b3b" stroke-width="8"/>
  <path d="M414 312q12-13 25 0" fill="none" stroke="#744b3b" stroke-width="6"/><path d="M380 375h60" stroke="#e2aa78" stroke-width="5"/>
  <path d="M475 397h49v-35h-49z" fill="#f6e1b9" stroke="#78513c" stroke-width="5"/><path d="M524 368q26-5 16 18-5 10-17 7" fill="none" stroke="#78513c" stroke-width="5"/>
  <!-- sink -->
  <path d="M860 405q0-34 32-34h151q32 0 32 34" fill="#d8d4bf" stroke="#77513b" stroke-width="7"/>
  <path d="M922 367v-40q0-25 28-25h17v18h-13q-13 0-13 12v35" fill="none" stroke="#786451" stroke-width="9"/>
  <path d="M944 324q0 34-14 49" fill="none" stroke="#8eb5b3" stroke-width="5"/>
  <!-- flowers in sunlight -->
  <path d="M697 400v-89m22 89v-66m21 66v-100" stroke="#687b4f" stroke-width="6"/>
  <path d="M681 401h76l-8 38h-60z" fill="#d98669" stroke="#80503e" stroke-width="5"/>
  <g fill="#df9d54"><circle cx="697" cy="307" r="13"/><circle cx="719" cy="329" r="12"/><circle cx="740" cy="294" r="14"/></g><g fill="#f3d27f"><circle cx="697" cy="307" r="5"/><circle cx="719" cy="329" r="5"/><circle cx="740" cy="294" r="5"/></g>
  <!-- small table -->
  <ellipse cx="784" cy="666" rx="245" ry="32" fill="#704832" opacity=".22"/>
  <path d="M552 535h447l-26 50H579z" fill="#d79c68" stroke="#744b39" stroke-width="8"/>
  <path d="M605 585h23l-17 161h-27zm316 0h23l20 161h-27z" fill="#8c5a3f"/>
  <path d="M578 554h396" stroke="#f0c18a" stroke-width="7"/>
  <!-- bread and plate -->
  <ellipse cx="738" cy="532" rx="101" ry="24" fill="#f2e2c6" stroke="#9a7656" stroke-width="5"/>
  <path d="M664 520q8-52 74-52 68 0 76 52z" fill="#c47a46" stroke="#8d5437" stroke-width="5"/>
  <path d="M690 507q7-22 22-28m22 27q7-22 22-28m19 29q7-22 22-27" fill="none" stroke="#f1c789" stroke-width="8" stroke-linecap="round"/>
  <!-- jam jar -->
  <rect x="839" y="483" width="44" height="51" rx="8" fill="#bc6652" stroke="#794b3b" stroke-width="4"/><rect x="834" y="477" width="54" height="11" rx="3" fill="#dec08c"/><path d="M850 493v32" stroke="#e8a17d" stroke-width="4"/>
  <!-- sleepy cat on chair -->
  <path d="M1002 595h151v20h-151z" fill="#d69a65" stroke="#704c3b" stroke-width="6"/>
  <path d="M1020 615v129m118-129v129" stroke="#704c3b" stroke-width="13"/>
  <path d="M1040 552q7-47 50-47 50 0 55 51l-15 38h-79z" fill="#e3aa70" stroke="#805540" stroke-width="6"/>
  <path d="m1044 523-1-32 30 19m54 0 29-21-3 37" fill="#e3aa70" stroke="#805540" stroke-width="6" stroke-linejoin="round"/>
  <path d="M1066 546q9 8 18 0m31 0q9 8 18 0" fill="none" stroke="#624b3f" stroke-width="5" stroke-linecap="round"/>
  <path d="M1094 562q8 7 16 0m-14 13q-18 11-34 1m54-1q17 10 33 0" fill="none" stroke="#98674d" stroke-width="3" stroke-linecap="round"/>
  <path d="M1133 581q40 9 43 36" fill="none" stroke="#e3aa70" stroke-width="15" stroke-linecap="round"/>
  <!-- scattered sunlight flecks -->
  <g fill="#fff2c6" opacity=".7"><circle cx="515" cy="494" r="5"/><circle cx="559" cy="480" r="3"/><circle cx="1005" cy="458" r="4"/><circle cx="1070" cy="477" r="3"/><circle cx="934" cy="510" r="5"/><circle cx="546" cy="518" r="3"/></g>
</svg>
