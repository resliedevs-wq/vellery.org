  <path d="M94 357v-96h183v96" fill="#e9ddc7" stroke="#78513c" stroke-width="7"/>
  <rect x="115" y="276" width="140" height="69" rx="6" fill="#98745b"/>
  <path d="M130 294h110v35H130z" fill="#61483b"/>
  <circle cx="117" cy="376" r="9" fill="#d49a5d"/><circle cx="153" cy="376" r="9" fill="#d49a5d"/><circle cx="217" cy="376" r="9" fill="#d49a5d"/><circle cx="254" cy="376" r="9" fill="#d49a5d"/>
  <path d="M139 259q12-20 23 0m22-4q12-20 23 0" fill="none" stroke="#fff1d2" stroke-width="8" stroke-linecap="round" opacity=".8"/>
