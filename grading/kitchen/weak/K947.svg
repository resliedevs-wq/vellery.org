  <path d="M0 454h1200v126H0z" fill="#81906a"/>
  <path d="M30 472h225v96H30zm250 0h225v96H280zm250 0h225v96H530zm250 0h225v96H780zm250 0h140v96h-140z" fill="#9baa7f" stroke="#687650" stroke-width="7"/>
  <path d="M131 480v82m250-82v82m250-82v82m250-82v82m250-82v82" stroke="#6d7958" stroke-width="4"/>
  <circle cx="239" cy="520" r="5" fill="#f2d19c"/><circle cx="464" cy="520" r="5" fill="#f2d19c"/><circle cx="714" cy="520" r="5" fill="#f2d19c"/><circle cx="964" cy="520" r="5" fill="#f2d19c"/><circle cx="1107" cy="520" r="5" fill="#f2d19c"/>
