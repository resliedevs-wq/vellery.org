<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A cozy kitchen in the morning</title>
  <desc id="desc">A warm sunlit kitchen with a little table, fresh bread, flowers, and a sleepy cat.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f6dfb9"/><stop offset="1" stop-color="#f2cfa4"/></linearGradient>
    <linearGradient id="sun" x2="0" y2="1"><stop stop-color="#fff6d7"/><stop offset="1" stop-color="#ffd782"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#d49b68"/><stop offset="1" stop-color="#a96846"/></linearGradient>
    <pattern id="tiles" width="52" height="52" patternUnits="userSpaceOnUse"><rect width="52" height="52" fill="#f7eddb"/><path d="M0 0h52v52H0z" fill="none" stroke="#dfc7a5" stroke-width="2"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <!-- room -->
  <rect width="1200" height="800" fill="url(#wall)"/>
  <path d="M0 570H1200V800H0z" fill="url(#floor)"/>
  <path d="M0 573h1200" stroke="#87563e" stroke-width="12"/>
  <path d="M0 620h1200M0 695h1200M0 770h1200" stroke="#8e5b42" stroke-width="5" opacity=".34"/>
  <path d="M190 620v180M470 620v180M760 620v180M1030 620v180" stroke="#8e5b42" stroke-width="4" opacity=".3"/>
  <!-- morning glow -->
  <ellipse cx="850" cy="405" rx="315" ry="235" fill="#ffe4a0" opacity=".48" filter="url(#soft)"/>
  <path d="M530 90h440v340H530z" fill="#f5e5c8" stroke="#855941" stroke-width="14"/>
  <path d="M551 111h398v298H551z" fill="url(#sun)"/>
  <path d="M750 111v298M551 260h398" stroke="#855941" stroke-width="12"/>
  <path d="M578 376 709 111h27L605 409h-27zm195 33L903 111h22L797 409h-24z" fill="#fff9e8" opacity=".3"/>
  <!-- curtains -->
  <path d="M505 75q45 18 61 53l-6 309q-30-33-65-41zm490 0q-45 18-61 53l6 309q30-33 65-41z" fill="#a8a969"/>
  <path d="M505 75q39 13 61 53m429-53q-39 13-61 53" fill="none" stroke="#7d8150" stroke-width="8"/>
  <!-- hanging herbs -->
  <path d="M257 0v116m-31-47q31 17 62 0m-57 21q26 15 52 0" fill="none" stroke="#7c6846" stroke-width="5"/>
  <g fill="#72804d"><ellipse cx="225" cy="63" rx="12" ry="25" transform="rotate(-45 225 63)"/><ellipse cx="249" cy="47" rx="12" ry="24" transform="rotate(-20 249 47)"/><ellipse cx="279" cy="61" rx="12" ry="25" transform="rotate(40 279 61)"/><ellipse cx="232" cy="94" rx="12" ry="23" transform="rotate(-50 232 94)"/><ellipse cx="267" cy="91" rx="12" ry="24" transform="rotate(45 267 91)"/></g>
  <!-- cupboards -->
  <path d="M40 160h330v250H40z" fill="#c67f52" stroke="#754c3a" stroke-width="10"/>
  <path d="M55 175h145v220H55zm160 0h140v220H215z" fill="#e5b47e" stroke="#8b5b3e" stroke-width="7"/>
  <path d="M76 195h103v180H76zm159 0h99v180h-99z" fill="#d79b63" stroke="#b6764b" stroke-width="4"/>
  <circle cx="166" cy="286" r="7" fill="#704c39"/><circle cx="249" cy="286" r="7" fill="#704c39"/>
  <!-- tiled backsplash and counter -->
  <path d="M0 421h1200v154H0z" fill="url(#tiles)"/>
  <path d="M0 405h1200v29H0z" fill="#80563e"/>
  <path d="M0 434h1200v20H0z" fill="#b77b53"/>
