<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f5dfbc"/><stop offset="1" stop-color="#e9c99d"/></linearGradient>
 <linearGradient id="sun" x2="1" y2="1"><stop stop-color="#fff8d9" stop-opacity=".88"/><stop offset="1" stop-color="#f3ba64" stop-opacity=".08"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c78c59"/><stop offset="1" stop-color="#98603f"/></linearGradient>
 <linearGradient id="window" x2="0" y2="1"><stop stop-color="#a8d8d0"/><stop offset="1" stop-color="#e5efcf"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="15"/></filter>
