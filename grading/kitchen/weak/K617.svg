<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">A cozy kitchen in the morning</title>
  <desc id="desc">Warm morning sunshine spills through a kitchen window onto a table set with coffee, toast, flowers, and a checked cloth.</desc>
  <defs>
