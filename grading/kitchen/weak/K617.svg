    <linearGradient id="sun" x2="1" y2="1"><stop stop-color="#fff4bb" stop-opacity=".78"/><stop offset="1" stop-color="#ffd579" stop-opacity=".05"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#c78c5d"/><stop offset="1" stop-color="#9c6248"/></linearGradient>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#f5e8d1"/><path d="M0 0h12v12H0zm12 12h12v12H12z" fill="#d78b70" opacity=".63"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="13"/></filter>
  </defs>
