  <path d="M952 493Q958 500 964 493M983 493Q989 500 995 493" fill="none" stroke="#555e5a" stroke-width="3" stroke-linecap="round"/>
  <path d="M970 505Q975 502 980 505L975 510Z" fill="#8f7770"/>
  <path d="M975 510V513Q970 518 966 513M975 513Q981 518 985 513" fill="none" stroke="#69716b" stroke-width="2" stroke-linecap="round"/>
  <g fill="none" stroke="#737c75" stroke-width="2" stroke-linecap="round">
    <path d="M953 507 931 502M953 513 929 513M994 507 1014 501M995 513 1019 512"/>
