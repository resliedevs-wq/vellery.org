  <path d="M235 142V412M109 277H361" fill="none" stroke="#faf0dc" stroke-width="12"/>
  <rect x="81" y="420" width="309" height="17" rx="4" fill="#bca27f"/>
  <rect x="81" y="416" width="309" height="10" rx="3" fill="#fcf1dc"/>

  <!-- Floor shadow and the front-facing table. -->
  <ellipse cx="615" cy="807" rx="425" ry="28" fill="#c6ad8b"/>
  <path d="M230 597H279L268 809H239Z" fill="#a9724f"/>
  <path d="M925 597H974L966 809H938Z" fill="#a9724f"/>
  <path d="M239 623H275L272 670H241Z" fill="#926146"/>
  <path d="M929 623H972L970 670H932Z" fill="#926146"/>
