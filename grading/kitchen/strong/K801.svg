  <path d="M887 525Q903 517 924 527L951 527Q964 529 961 538 958 546 938 544L904 542Q890 540 887 525Z" fill="#a9aba4"/>
  <path d="M946 535V542M939 535V543" fill="none" stroke="#858c84" stroke-width="2" stroke-linecap="round"/>
  <path d="M844 468 851 480M861 466 867 477" fill="none" stroke="#7f8680" stroke-width="6" stroke-linecap="round"/>
</svg>
