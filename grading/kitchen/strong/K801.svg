  <path d="M600 491V541" fill="none" stroke="#91afba" stroke-width="5" stroke-linecap="round"/>
  <text x="643" y="532" text-anchor="middle" fill="#faf0dc" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.3">MONDAY</text>

