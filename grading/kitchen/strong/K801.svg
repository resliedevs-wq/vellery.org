<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A quiet Monday morning</title>
  <desc id="desc">Flat vector illustration of a small kitchen table seen from the front. Exactly three red apples and a blue mug printed with MONDAY sit beside a folded newspaper with a sleeping gray cat on top. Morning sunlight enters through the window on the left. There are no people.</desc>
  <defs>
    <clipPath id="window-clip">
      <rect x="110" y="143" width="250" height="268" rx="3"/>
    </clipPath>
  </defs>

  <!-- Warm plaster wall and a quiet strip of floor. -->
  <rect width="1200" height="900" fill="#eee2ce"/>
  <rect y="709" width="1200" height="191" fill="#d9c4a6"/>
  <path d="M0 707H1200" fill="none" stroke="#cbb89c" stroke-width="8"/>

  <!-- Broad, flat planes of early sunlight. -->
  <path d="M119 292 353 292 868 709 457 709Z" fill="#f7ebc9"/>
  <path d="M119 359 353 359 1036 900 605 900Z" fill="#f1dfb7" opacity=".58"/>

  <!-- The left-hand window, its view deliberately simple. -->
  <rect x="89" y="122" width="292" height="313" rx="7" fill="#d6c2a2"/>
  <rect x="100" y="132" width="272" height="290" rx="4" fill="#fbf2df"/>
  <g clip-path="url(#window-clip)">
