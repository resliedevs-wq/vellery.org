  <path d="M438 367c-12-16-7-39 7-49 13-10 34-7 48 4 10-5 21-4 30 3 17 13 18 38 4 53-14 16-44 16-66 10-11-3-18-9-23-21z" fill="#858b8a" stroke="#626a69" stroke-width="2"/>
