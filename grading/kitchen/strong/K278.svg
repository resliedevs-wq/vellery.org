  <path d="M350 356h140" stroke="#d9c4a5" stroke-width="2"/>

  <!-- Table legs and broad front-facing top -->
  <path d="M194 442h30l-12 166h-28zM675 442h30l18 166h-28z" fill="#986342"/>
  <path d="M202 590h487v18H202z" fill="#81563d" opacity=".32"/>
  <rect x="126" y="405" width="648" height="48" rx="9" fill="#bd895f"/>
  <path d="M137 414h626v31H137z" fill="#c99569"/>
  <rect x="126" y="405" width="648" height="48" rx="9" fill="url(#cloth)"/>
  <path d="M143 454h614" stroke="#9e6e4d" stroke-width="3" opacity=".45"/>

