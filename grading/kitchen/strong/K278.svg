<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">A quiet kitchen morning</title>
  <desc id="desc">A small front-facing kitchen table holding exactly three red apples, a blue mug marked MONDAY, and a folded newspaper with a sleeping gray cat on top. Morning sun enters through a window at left.</desc>
  <defs>
    <pattern id="newsprint" width="18" height="15" patternUnits="userSpaceOnUse">
      <path d="M2 4h12M2 7h8M2 11h13" stroke="#aaa89f" stroke-width="1" opacity=".65"/>
    </pattern>
    <pattern id="cloth" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 12h24M12 0v24" stroke="#d7ae83" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <!-- Warm kitchen wall and the morning window -->
  <path fill="#f3e6cf" d="M0 0h900v464H0z"/>
  <path fill="#ead6b8" d="M0 438h900v26H0z"/>
  <rect x="72" y="48" width="228" height="250" rx="5" fill="#c18a5d"/>
  <rect x="82" y="58" width="208" height="230" fill="#f8edda"/>
  <rect x="94" y="70" width="184" height="206" fill="#b9d0ce"/>
