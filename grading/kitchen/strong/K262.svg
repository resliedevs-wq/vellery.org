<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d2"/>
      <stop offset="1" stop-color="#f6d88c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c08a5e"/>
      <stop offset="1" stop-color="#a6704a"/>
    </linearGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a8fd0"/>
      <stop offset="1" stop-color="#2a64a6"/>
    </linearGradient>
    <radialGradient id="apple" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff7a68"/>
      <stop offset="0.5" stop-color="#d7261e"/>
      <stop offset="1" stop-color="#8e1212"/>
    </radialGradient>
  </defs>

  <!-- Wall and floor -->
  <rect x="0" y="0" width="800" height="470" fill="#f2e4cc"/>
  <rect x="0" y="470" width="800" height="130" fill="#d4a97c"/>
  <rect x="0" y="462" width="800" height="8" fill="#d9c3a0"/>

  <!-- Window -->
  <rect x="50" y="60" width="230" height="240" fill="#8b6b4a"/>
  <rect x="62" y="72" width="206" height="216" fill="url(#glass)"/>
  <rect x="162" y="72" width="6" height="216" fill="#8b6b4a"/>
  <rect x="62" y="168" width="206" height="6" fill="#8b6b4a"/>
  <rect x="38" y="296" width="254" height="12" rx="3" fill="#a07a55"/>

  <!-- Morning sunlight beam from the window -->
  <polygon points="270,70 270,300 560,500 300,150" fill="#ffe49a" opacity="0.4"/>
  <polygon points="270,70 270,300 430,420 300,120" fill="#fff0b8" opacity="0.25"/>

  <!-- Table shadow and legs -->
  <ellipse cx="380" cy="522" rx="300" ry="10" fill="#6b4a2e" opacity="0.25"/>
  <rect x="150" y="350" width="18" height="170" fill="#8f5f3d"/>
  <rect x="612" y="350" width="18" height="170" fill="#8f5f3d"/>
  <rect x="168" y="440" width="444" height="8" fill="#8f5f3d"/>

  <!-- Tabletop -->
  <rect x="120" y="340" width="560" height="20" rx="2" fill="url(#wood)"/>
  <rect x="120" y="358" width="560" height="8" fill="#7a4f32"/>

  <!-- Apples (three) -->
  <g>
    <circle cx="190" cy="316" r="24" fill="url(#apple)"/>
    <ellipse cx="182" cy="306" rx="6" ry="4" fill="#ffffff" opacity="0.45"/>
    <path d="M190 292 Q191 284 195 280" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <circle cx="238" cy="316" r="24" fill="url(#apple)"/>
    <ellipse cx="230" cy="306" rx="6" ry="4" fill="#ffffff" opacity="0.45"/>
    <path d="M238 292 Q239 284 243 280" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>

    <circle cx="214" cy="276" r="23" fill="url(#apple)"/>
    <ellipse cx="206" cy="267" rx="6" ry="4" fill="#ffffff" opacity="0.45"/>
    <path d="M214 255 Q215 246 219 242" stroke="#5a3a1e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="229" cy="246" rx="8" ry="4" transform="rotate(-25 229 246)" fill="#6b9a3c"/>
  </g>

  <!-- Folded newspaper -->
  <rect x="370" y="300" width="170" height="40" fill="#ece6d4" stroke="#a79f8b" stroke-width="1.5"/>
  <rect x="384" y="307" width="70" height="6" fill="#4f4c44"/>
  <path d="M384 322 H470 M384 330 H500 M384 338 H455" stroke="#8c867a" stroke-width="2"/>
  <path d="M480 312 V 338" stroke="#b5ad99" stroke-width="1"/>

  <!-- Gray cat asleep on the newspaper -->
  <g>
    <!-- tail -->
    <path d="M505 298 C 520 298, 528 288, 520 280" stroke="#8a8d95" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <path d="M398 300 C 392 282, 405 262, 440 262 C 478 262, 503 274, 508 300 Z" fill="#9a9ca3"/>
    <!-- stripes -->
    <path d="M430 268 q 6 10 2 22 M455 264 q 5 12 0 26 M478 270 q 4 10 -1 22" stroke="#5f636c" stroke-width="3" fill="none" opacity="0.6"/>
    <!-- ears -->
    <path d="M386 275 L390 254 L402 268 Z" fill="#8e9199"/>
    <path d="M389 272 L391 260 L399 269 Z" fill="#c9a0a0" opacity="0.6"/>
    <path d="M408 268 L416 252 L422 277 Z" fill="#8e9199"/>
    <!-- head -->
    <ellipse cx="402" cy="284" rx="19" ry="16" fill="#9a9ca3"/>
    <!-- closed eyes -->
    <path d="M395 285 q 5 4 10 0 M408 285 q 5 4 10 0" stroke="#3d3f46" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M400 292 H406 L403 295 Z" fill="#d9908a"/>
    <!-- whiskers -->
    <path d="M386 290 L372 288 M386 294 L372 296" stroke="#6b6e76" stroke-width="1"/>
    <!-- front paws -->
    <ellipse cx="418" cy="297" rx="11" ry="4" fill="#b5b8be"/>
  </g>

  <!-- Blue mug -->
  <path d="M622 298 C 646 292, 648 326, 620 326" stroke="#2f6aa8" stroke-width="7" fill="none"/>
  <path d="M555 285 L625 285 L620 336 Q619 340 615 340 L565 340 Q561 340 560 336 Z" fill="url(#mug)"/>
  <rect x="561" y="290" width="5" height="44" fill="#ffffff" opacity="0.15"/>
  <ellipse cx="590" cy="285" rx="35" ry="6" fill="#6fa3dc"/>
  <text x="590" y="320" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle" textLength="56" lengthAdjust="spacingAndGlyphs">MONDAY</text>
</svg>
