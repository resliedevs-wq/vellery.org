  <path fill="#969b97" d="m745 444 1-30 25 16 23-10 10 29c13 14 7 37-10 43-16 7-40 4-50-9-9-12-8-27 1-39Z"/>
  <path fill="#c1b1a6" d="m752 439 0-14 13 9Zm31-5 9-6 5 17Z"/>
  <path fill="#afb2ac" d="M751 467c5-7 13-8 21-4 10-5 22-3 26 6 6 14-8 23-23 23-18 0-32-12-24-25Z"/>
  <g fill="none" stroke="#5c6663" stroke-width="2.6" stroke-linecap="round">
    <path d="M749 456q6 7 13 0m18 0q6 7 13 0"/>
    <path d="M770 473q3 4 7 0"/>
  </g>
  <path fill="#8e7972" d="M767 465h10l-5 5Z"/>
  <g fill="none" stroke="#77817b" stroke-width="1.5" stroke-linecap="round">
    <path d="m755 470-20-3m21 8-20 2m53-7 20-4m-21 9 21 1"/>
  </g>
</svg>
