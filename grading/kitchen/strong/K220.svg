    <path fill="#b65349" d="M393 470c-14-12-31-4-33 12-3 18 10 37 23 38 5 1 6-2 10-2s5 3 10 2c14-2 26-24 22-39-4-16-19-20-32-11Z"/>
    <path d="M372 484q-2 8 2 15" fill="none" stroke="#d88670" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Blue ceramic mug, with a clearly legible printed word. -->
  <ellipse cx="511" cy="520" rx="48" ry="7" fill="#ac805d" opacity=".4"/>
  <path d="M551 453h12c29 0 29 43 0 43h-12" fill="none" stroke="#62879a" stroke-width="13"/>
  <path fill="#7198a9" d="M467 438h88v65q0 17-19 17h-50q-19 0-19-17Z"/>
