<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title desc">
  <title id="title">A quiet Monday morning</title>
  <desc id="desc">Flat vector illustration of a small kitchen table viewed from the front. Exactly three red apples sit beside a blue mug printed with MONDAY. A gray cat sleeps on a folded newspaper. Warm morning sunlight enters through a window on the left. No people.</desc>
