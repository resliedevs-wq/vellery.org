    <clipPath id="window-glass"><rect x="66" y="94" width="210" height="262" rx="3"/></clipPath>
  </defs>

  <!-- Warm plaster wall and floor. -->
  <path fill="#eee4d3" d="M0 0h1000v800H0z"/>
  <path fill="#d9c7ac" d="M0 639h1000v161H0z"/>
  <path fill="#cdb99d" d="M0 631h1000v10H0z"/>

  <!-- The morning window, to the left of the table. -->
  <rect x="47" y="75" width="248" height="302" rx="6" fill="#d7c5a9"/>
  <rect x="56" y="84" width="230" height="282" rx="4" fill="#faf3e3"/>
  <g clip-path="url(#window-glass)">
    <path fill="#c6d6d2" d="M66 94h210v262H66z"/>
    <circle cx="111" cy="161" r="36" fill="#f7e8b4"/>
    <path fill="#b8c7b1" d="M66 306q57-38 112-10t98-9v69H66z"/>
    <path fill="#abbca6" d="M66 333q54-26 108-5t102-8v36H66z"/>
  </g>
  <path fill="#faf3e3" d="M164 90h12v272h-12zM62 220h218v12H62z"/>
  <rect x="37" y="365" width="270" height="14" rx="3" fill="#e2d2b8"/>
  <path fill="#fff1c5" opacity=".43" d="m77 379 187-1 606 261H436z"/>
  <path fill="#f5e2b1" opacity=".46" d="M436 641h434l130 104v55H729z"/>

  <!-- Straight-on view of a compact wooden table. -->
  <ellipse cx="519" cy="737" rx="344" ry="23" fill="#b9a183" opacity=".35"/>
  <path fill="#a47a57" d="M212 560h39v174h-39zM780 560h39v174h-39z"/>
  <path fill="#bb9168" d="M212 560h12v174h-12zM780 560h12v174h-12z"/>
  <path fill="#ae8059" d="M236 562h559v43H236z"/>
  <rect x="165" y="517" width="700" height="34" rx="9" fill="#cba073"/>
  <path fill="#b98b60" d="M165 539h700v17a7 7 0 0 1-7 7H172a7 7 0 0 1-7-7z"/>
  <path fill="#dfb786" d="M176 517h678a11 11 0 0 1 11 11H165a11 11 0 0 1 11-11Z"/>

