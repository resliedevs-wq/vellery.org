  <g fill="none" stroke="#a7a394" stroke-width="2">
    <path d="m617 490 65 1M620 496l35 1m7 0h24M622 502l35 1m7 0h25M624 508l35 1m7 0h26M754 497h55m-52 5h56m-52 5h56"/>
  </g>

  <!-- Sleeping gray cat, curled comfortably on the folded paper. -->
  <path fill="#8e9290" d="M648 479c-21-15-15-49 10-65 21-14 64-15 91-2 27 12 41 37 31 60-7 18-39 26-73 24-26-1-44-6-59-17Z"/>
  <path fill="#a1a4a0" d="M650 454c0-25 26-43 57-43 27 0 50 13 58 31-29-10-53-8-71 10-13 13-29 19-44 2Z"/>
  <path d="M651 459c-21 4-24 24-6 33 15 7 47 8 65 0 9-4 9-14-1-17-9-3-19 3-30 1" fill="none" stroke="#7d8381" stroke-width="17" stroke-linecap="round"/>
