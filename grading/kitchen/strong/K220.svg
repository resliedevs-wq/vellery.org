  <g id="apple-1">
    <ellipse cx="249" cy="518" rx="31" ry="6" fill="#ac805d" opacity=".4"/>
    <path d="M249 465q-4-13 3-22" fill="none" stroke="#765d42" stroke-width="5" stroke-linecap="round"/>
    <path fill="#889667" d="M251 453q8-15 24-10-7 15-24 10Z"/>
    <path fill="#b95448" d="M249 465c-16-12-34-2-34 16 0 19 13 39 26 39 5 0 6-3 9-3s5 3 10 2c14-3 24-25 22-41-2-16-19-24-33-13Z"/>
    <path d="M228 479q-3 10 2 18" fill="none" stroke="#d9826a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="apple-2">
    <ellipse cx="321" cy="519" rx="31" ry="6" fill="#ac805d" opacity=".4"/>
    <path d="M321 463q4-11 0-20" fill="none" stroke="#765d42" stroke-width="5" stroke-linecap="round"/>
    <path fill="#c46150" d="M321 464c-16-12-33-3-34 14-2 20 10 42 25 43 5 0 6-3 10-3s6 3 11 2c14-3 26-24 23-43-3-16-20-24-35-13Z"/>
    <path d="M300 479q-3 9 1 17" fill="none" stroke="#e09679" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g id="apple-3">
    <ellipse cx="393" cy="519" rx="30" ry="6" fill="#ac805d" opacity=".4"/>
    <path d="M394 470q-3-12 3-21" fill="none" stroke="#765d42" stroke-width="5" stroke-linecap="round"/>
