  <ellipse cx="511" cy="439" rx="36" ry="4.5" fill="#6c6254"/>
  <text x="511" y="484" fill="#fcf3df" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing=".6">MONDAY</text>

  <!-- A folded newspaper, its page edges and columns visible beneath the cat. -->
  <ellipse cx="721" cy="521" rx="112" ry="7" fill="#ac805d" opacity=".35"/>
  <path fill="#c7bfac" d="m607 488 204 1 28 32-224 1Z"/>
  <path fill="#f2ead8" d="m604 483 206 2 26 30-225 1Z"/>
