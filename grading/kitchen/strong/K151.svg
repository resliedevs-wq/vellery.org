<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Kitchen table in morning light</title>

  <!-- Wall and floor -->
  <rect x="0" y="0" width="800" height="600" fill="#eadbc4"/>
  <rect x="0" y="470" width="800" height="130" fill="#cdb08c"/>

  <!-- Window on the left -->
  <rect x="56" y="76" width="208" height="258" fill="#b48a5e"/>
  <rect x="68" y="88" width="184" height="234" fill="#fbeab0"/>
  <rect x="160" y="88" width="8" height="234" fill="#b48a5e"/>
  <rect x="68" y="200" width="184" height="8" fill="#b48a5e"/>
  <rect x="44" y="332" width="244" height="12" rx="3" fill="#a07550"/>

  <!-- Morning sunlight streaming in from the window -->
  <polygon points="264,96 264,334 760,520 760,380" fill="#fff3c4" opacity="0.28"/>

  <!-- Table legs -->
  <rect x="176" y="410" width="18" height="150" fill="#7a5538"/>
  <rect x="656" y="410" width="18" height="150" fill="#7a5538"/>

  <!-- Table top and front edge -->
  <rect x="140" y="368" width="560" height="26" rx="3" fill="#b8875f"/>
  <rect x="140" y="394" width="560" height="14" rx="2" fill="#9a6d4c"/>

  <!-- Three red apples -->
  <g>
    <circle cx="220" cy="348" r="20" fill="#b8443a"/>
    <ellipse cx="213" cy="339" rx="5" ry="3" fill="#e07a6e" opacity="0.7"/>
    <path d="M220,328 q1,-8 5,-10" fill="none" stroke="#5b4030" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="262" cy="348" r="20" fill="#b8443a"/>
    <ellipse cx="255" cy="339" rx="5" ry="3" fill="#e07a6e" opacity="0.7"/>
    <path d="M262,328 q1,-8 5,-10" fill="none" stroke="#5b4030" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="304" cy="348" r="20" fill="#b8443a"/>
    <ellipse cx="297" cy="339" rx="5" ry="3" fill="#e07a6e" opacity="0.7"/>
    <path d="M304,328 q1,-8 5,-10" fill="none" stroke="#5b4030" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Blue mug with MONDAY -->
  <g>
    <path d="M546,318 q24,0 24,24 t-24,24" fill="none" stroke="#4a6fa5" stroke-width="8"/>
    <rect x="470" y="300" width="76" height="70" rx="6" fill="#4a6fa5"/>
    <rect x="468" y="296" width="80" height="7" rx="3" fill="#3b5b87"/>
    <text x="508" y="342" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" text-anchor="middle" fill="#f4efe6">MONDAY</text>
  </g>

  <!-- Folded newspaper -->
  <g>
    <rect x="576" y="352" width="124" height="16" rx="2" fill="#efe8d4" stroke="#cdbf9f" stroke-width="1"/>
    <rect x="586" y="356" width="104" height="2" fill="#c8bfa8"/>
    <rect x="586" y="362" width="104" height="2" fill="#c8bfa8"/>
  </g>

  <!-- Gray cat asleep on the newspaper -->
  <g>
    <path d="M586,346 q-20,4 -14,-14 q4,-6 8,-2" fill="none" stroke="#8d8f96" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="622" cy="340" rx="40" ry="12" fill="#8d8f96"/>
    <path d="M604,332 q4,6 2,12" fill="none" stroke="#7b7d85" stroke-width="2" stroke-linecap="round"/>
    <path d="M618,330 q4,6 2,12" fill="none" stroke="#7b7d85" stroke-width="2" stroke-linecap="round"/>
    <polygon points="654,328 656,314 667,324" fill="#8d8f96"/>
    <polygon points="668,324 676,313 678,330" fill="#8d8f96"/>
    <ellipse cx="664" cy="336" rx="15" ry="12" fill="#8d8f96"/>
    <path d="M656,337 q4,3 8,0" fill="none" stroke="#4a4b52" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="674" cy="342" rx="2" ry="1.5" fill="#6f7178"/>
    <ellipse cx="650" cy="348" rx="7" ry="3.5" fill="#7b7d85"/>
  </g>
</svg>
