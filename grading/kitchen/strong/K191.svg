<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">A quiet Monday morning</title>
  <desc id="description">Front view of a small kitchen table holding exactly three red apples, a blue mug printed with MONDAY, and a folded newspaper with a sleeping gray cat on top. Warm morning sunlight enters through the window on the left. No people.</desc>
  <defs>
    <clipPath id="window-pane"><rect x="89" y="82" width="212" height="226" rx="3"/></clipPath>
  </defs>

  <!-- Warm plaster wall and a quiet strip of floor. -->
  <path fill="#f1e7d6" d="M0 0h1000v760H0z"/>
  <path fill="#dfcfb8" d="M0 581h1000v179H0z"/>
  <path fill="#d2bfa4" d="M0 575h1000v9H0z"/>

  <!-- The light is a flat, soft-colored shape, like cut paper. -->
  <path fill="#f7e7bc" d="M91 190 302 253 799 581H329z"/>
  <path fill="#eddbaf" d="m329 584 470-1 131 176H466z"/>

  <!-- Left-hand window, pale sky and distant morning hills. -->
  <rect x="69" y="62" width="252" height="269" rx="9" fill="#dac8ab"/>
  <rect x="78" y="71" width="234" height="250" rx="5" fill="#fcf4e3"/>
  <g clip-path="url(#window-pane)">
    <path fill="#c8d9d8" d="M89 82h212v226H89z"/>
    <circle cx="129" cy="131" r="27" fill="#f4df9f"/>
    <path fill="#b9c6b1" d="M75 278q75-63 133-19t111-10v72H75z"/>
    <path fill="#a7b7a3" d="M75 294q95-35 145-6t99-6v39H75z"/>
  </g>
  <path fill="#fcf4e3" d="M190 78h11v236h-11zM84 190h222v11H84z"/>
  <rect x="61" y="320" width="268" height="15" rx="4" fill="#c1a582"/>
  <rect x="61" y="318" width="268" height="7" rx="3" fill="#e1c9a6"/>

  <!-- Grounding shadow and a small, straight-on wooden table. -->
  <ellipse cx="510" cy="675" rx="332" ry="24" fill="#cbb89c"/>
  <path fill="#a27652" d="M190 449h39l-9 222h-28zM771 449h39l-2 222h-28z"/>
  <path fill="#bf936b" d="M193 462h13v202h-13zM781 462h12l7 202h-12z"/>
  <path fill="#bb8b60" d="M185 450h630v42H185z"/>
  <path fill="#a87953" d="M185 450h630v10H185z"/>
  <path fill="#d7ad7c" d="m164 414 16-20h640l16 20v19H164z"/>
  <rect x="155" y="416" width="690" height="26" rx="6" fill="#be8e62"/>
  <rect x="155" y="414" width="690" height="10" rx="5" fill="#ddb586"/>

  <!-- Exactly three apples. Each has its own silhouette and stem. -->
  <ellipse cx="281" cy="410" rx="104" ry="8" fill="#c49b6f"/>
  <g id="apple-one">
    <path d="M215 365q-2-15 5-23" fill="none" stroke="#745841" stroke-width="5" stroke-linecap="round"/>
    <path fill="#a5ad76" d="M218 352q6-15 21-11-4 14-21 11"/>
    <path fill="#b95349" d="M215 365c-16-13-36-3-36 17 0 19 13 34 27 33 5 0 7-3 10-3 4 0 7 3 12 2 14-2 25-18 24-35-1-19-22-27-37-14z"/>
    <path d="M192 377q-5 9-1 18" fill="none" stroke="#d9826a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="apple-two">
    <path d="M283 360q0-13-6-21" fill="none" stroke="#745841" stroke-width="5" stroke-linecap="round"/>
    <path fill="#bd5c4e" d="M282 359c-17-11-35-1-35 19 0 19 11 36 25 36 5 0 8-3 11-3 4 0 8 3 13 2 14-2 25-17 25-35 0-20-23-30-39-19z"/>
    <path d="M260 373q-5 10-1 18" fill="none" stroke="#dc8a70" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="apple-three">
    <path d="M348 368q-2-13 5-23" fill="none" stroke="#745841" stroke-width="5" stroke-linecap="round"/>
    <path fill="#a44b43" d="M348 367c-15-12-34-3-34 16 0 17 11 32 24 32 5 0 7-3 11-3 3 0 7 3 11 2 14-1 25-16 24-33-1-18-20-25-36-14z"/>
    <path d="M327 379q-4 7-1 15" fill="none" stroke="#cc7662" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- A sturdy blue mug, with an open handle and readable lettering. -->
  <ellipse cx="463" cy="412" rx="65" ry="7" fill="#c49b6f"/>
  <path d="M496 352h17c31 0 31 45 0 45h-17" fill="none" stroke="#557f91" stroke-width="13"/>
  <path fill="#648fa0" d="M411 341h91v58q0 16-17 16h-57q-17 0-17-16z"/>
  <path fill="#7da5af" d="M411 341h12v59q0 9 7 15h-2q-17 0-17-16z"/>
  <ellipse cx="456.5" cy="341" rx="45.5" ry="8" fill="#90b1b7"/>
  <ellipse cx="456.5" cy="341" rx="36" ry="4.5" fill="#645b50"/>
  <text x="456.5" y="384" fill="#fff3d9" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">MONDAY</text>

  <!-- Folded newspaper: a visible fold, stacked edges, and quiet print. -->
  <ellipse cx="671" cy="414" rx="133" ry="6" fill="#c49b6f"/>
  <path fill="#b6ad9b" d="m554 391 228 1 13 20-228 3z"/>
  <path fill="#ded8c8" d="m550 385 227 3 14 21-229 2z"/>
  <path fill="#f4eddc" d="m550 385 226 3 10 16-227 2z"/>
  <path d="m669 390 10 14M565 411l223-2" fill="none" stroke="#c2b9a5" stroke-width="2"/>
  <g fill="#a4a093">
    <path d="m563 390 47 1 1 3-46-1zM566 397l41 1 1 2-41-1zM619 397l39 1 1 2-39-1zM691 398l34 1 1 2-34-1zM736 399l32 1 1 2-32-1z"/>
  </g>

  <!-- Gray cat curled up asleep on the newspaper. -->
  <path fill="#858784" d="M615 383c-13-19-8-43 12-59 18-15 43-21 70-16 37 7 66 33 65 59-1 22-28 29-64 29h-49c-15 0-27-4-34-13z"/>
  <path fill="#989a95" d="M635 334c22-21 66-22 93 1 15 12 22 30 14 41-9 14-31 17-62 14l-44-9z"/>
  <!-- Rear haunch and a curling tail hug the sleeping body. -->
  <path d="M740 351c25 31 4 47-30 38-14-4-23-11-32-10" fill="none" stroke="#737773" stroke-width="19" stroke-linecap="round"/>
  <path d="M741 350c12 15 9 26 2 31" fill="none" stroke="#858984" stroke-width="7" stroke-linecap="round"/>
  <!-- Tucked front paw. -->
  <path fill="#b0b0a7" d="M608 380q19-9 43 1c9 4 7 13-2 14h-35q-16-2-6-15"/>
  <path d="m631 388 1 5m7-5 1 5" stroke="#92958e" stroke-width="2" stroke-linecap="round"/>
  <!-- Ears and round, lowered head. -->
  <path fill="#92968f" d="m580 350-2-30 27 17 19-7 20 17-10 32-43 3z"/>
  <path fill="#b9a99c" d="m585 331 2 17 13-8zM624 339l11 11-13 3z"/>
  <path fill="#a3a69e" d="M581 350c6-15 24-18 39-12 15 5 23 19 17 33-6 15-22 22-37 17-17-5-26-22-19-38z"/>
  <path fill="#8a8f87" d="m600 337 4 13 6-13zM612 338l2 12 7-9z"/>
  <!-- Closed eyes and a tiny relaxed muzzle make the sleep explicit. -->
  <g fill="none" stroke="#5c655e" stroke-width="2.8" stroke-linecap="round">
    <path d="M586 359q5 6 11 1M610 361q5 6 11 1"/>
    <path d="M604 371v4q-4 4-7 0m7 0q3 4 6 1" stroke-width="1.8"/>
  </g>
  <path fill="#88756c" d="m600 368 8 1-4 4z"/>
  <g fill="none" stroke="#737c72" stroke-width="1.5" stroke-linecap="round">
    <path d="m591 370-17-3m18 8-17 1m43-4 16-2m-16 6 16 2"/>
  </g>
</svg>
