<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">A quiet kitchen morning</title>
  <desc id="desc">A flat vector illustration of a small kitchen table with three red apples, a blue mug marked MONDAY, and a folded newspaper with a gray cat asleep on top. Morning sunlight enters through a window on the left.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f5e9d1"/><stop offset="1" stop-color="#ead8b8"/></linearGradient>
    <linearGradient id="sunbeam" x2="1" y2="1"><stop stop-color="#f9d78d" stop-opacity=".48"/><stop offset="1" stop-color="#f9d78d" stop-opacity="0"/></linearGradient>
    <linearGradient id="tabletop" x2="0" y2="1"><stop stop-color="#b9794d"/><stop offset="1" stop-color="#9e613e"/></linearGradient>
  </defs>

  <!-- Warm kitchen wall and the morning window -->
  <rect width="900" height="650" fill="url(#wall)"/>
  <rect y="465" width="900" height="185" fill="#d7c19c"/>
  <path d="M0 465H900" stroke="#b69a72" stroke-width="4"/>
  <rect x="55" y="48" width="218" height="248" rx="5" fill="#f7f0df" stroke="#9d7955" stroke-width="9"/>
  <rect x="69" y="62" width="190" height="220" fill="#9fc4c1"/>
  <path d="M69 170h190M164 62v220" stroke="#f2e7d1" stroke-width="9"/>
  <path d="M76 70h82v93H76z" fill="#b9d4ca" opacity=".85"/>
  <circle cx="216" cy="99" r="23" fill="#f6d27d"/>
  <path d="M164 294 435 465H60z" fill="url(#sunbeam)"/>
  <path d="M259 210 582 465H306z" fill="url(#sunbeam)" opacity=".7"/>
  <path d="M82 295h165" stroke="#8c6d4d" stroke-width="8" stroke-linecap="round"/>

  <!-- A small front-facing wooden table -->
  <ellipse cx="475" cy="567" rx="322" ry="32" fill="#a78b68" opacity=".2"/>
  <path d="M237 409 263 409 244 570 218 570zM681 409 707 409 728 570 702 570z" fill="#875435"/>
  <path d="M228 421h490v28H228z" fill="#875435"/>
  <path d="M170 365 Q170 350 187 350H756Q773 350 773 365V412Q773 426 756 426H187Q170 426 170 412Z" fill="url(#tabletop)" stroke="#875435" stroke-width="5"/>
  <path d="M192 372h559" stroke="#d99a64" stroke-width="4" opacity=".65"/>
  <path d="M199 397q70-8 136 0m211-4q69-10 139-1" fill="none" stroke="#8f593b" stroke-width="3" opacity=".4"/>

  <!-- Exactly three red apples -->
  <g stroke="#8c392e" stroke-width="3">
    <path d="M278 338c-8-21-27-32-44-24-18 8-24 31-14 49 11 20 32 25 52 12 20 13 42 8 52-12 10-18 4-41-14-49-17-8-36 3-44 24z" fill="#c94d3e"/>
    <path d="M446 338c-8-21-27-32-44-24-18 8-24 31-14 49 11 20 32 25 52 12 20 13 42 8 52-12 10-18 4-41-14-49-17-8-36 3-44 24z" fill="#d04e3e"/>
    <path d="M617 338c-8-21-27-32-44-24-18 8-24 31-14 49 11 20 32 25 52 12 20 13 42 8 52-12 10-18 4-41-14-49-17-8-36 3-44 24z" fill="#bd4438"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M277 314q-5-14 3-23" stroke="#684e34" stroke-width="6"/>
    <path d="M445 314q-5-14 3-23" stroke="#684e34" stroke-width="6"/>
    <path d="M616 314q-5-14 3-23" stroke="#684e34" stroke-width="6"/>
  </g>
  <g fill="#78905a"><ellipse cx="289" cy="298" rx="11" ry="5" transform="rotate(-28 289 298)"/><ellipse cx="457" cy="298" rx="11" ry="5" transform="rotate(-28 457 298)"/><ellipse cx="628" cy="298" rx="11" ry="5" transform="rotate(-28 628 298)"/></g>
  <g fill="#f18b70" opacity=".75"><ellipse cx="239" cy="342" rx="7" ry="12"/><ellipse cx="407" cy="342" rx="7" ry="12"/><ellipse cx="578" cy="342" rx="7" ry="12"/></g>

  <!-- Blue mug, with the requested lettering -->
  <path d="M696 289h80v70q0 17-17 17h-46q-17 0-17-17z" fill="#648fa1" stroke="#426b7d" stroke-width="4"/>
  <path d="M776 303h13q23 0 23 22t-23 22h-13" fill="none" stroke="#426b7d" stroke-width="9"/>
  <path d="M704 298h64" stroke="#9fc1c6" stroke-width="5" stroke-linecap="round"/>
  <text x="736" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.1" fill="#f5eee0">MONDAY</text>

  <!-- Folded newspaper and a sleeping gray cat curled on it -->
  <path d="M354 387 463 369 531 389 421 407z" fill="#eee8d8" stroke="#9b8c76" stroke-width="3"/>
  <path d="M421 407 531 389 531 402 421 420z" fill="#d4c9b5" stroke="#9b8c76" stroke-width="2"/>
  <path d="m367 387 96-16 44 14-96 16z" fill="#f6f1e7"/>
  <path d="m381 386 60-10m-54 16 38-6m23-4 28-5m-19 12 30-5" stroke="#9b978e" stroke-width="2" opacity=".75"/>
  <path d="m404 395 15-3m8-2 14-3m9-1 17-3m-63 15 32-5" stroke="#aaa195" stroke-width="2"/>
  <!-- curled body and tail -->
  <path d="M391 363c-11-21 4-43 29-45 26-2 43 13 43 31 0 17-14 27-31 25-13-1-20-10-18-19 2-8 10-12 18-9 5 2 7 7 4 11 12 0 19-8 17-17-2-12-14-19-29-17-18 2-26 16-20 30 5 12 17 18 35 17l-21 14c-15-1-23-10-27-21z" fill="#85827f" stroke="#5f5e5b" stroke-width="3" stroke-linejoin="round"/>
  <!-- head, ears, muzzle -->
  <path d="M420 338 419 316 436 329Q450 320 464 328l16-12 1 25q-5 25-31 26-25-1-30-29z" fill="#999591" stroke="#5f5e5b" stroke-width="3" stroke-linejoin="round"/>
  <path d="m423 324 1 12 9-7zm47 0-1 12-9-7z" fill="#d49b91"/>
  <path d="M431 345q6 5 12 0m13 0q6 5 12 0" fill="none" stroke="#514f4d" stroke-width="2.5" stroke-linecap="round"/>
  <path d="m448 352 4 3 4-3" fill="none" stroke="#725a58" stroke-width="2" stroke-linecap="round"/>
  <path d="M438 355q10 8 19 0" fill="none" stroke="#625d5a" stroke-width="2" stroke-linecap="round"/>
  <path d="m431 352-15-3m15 7-14 2m48-6 15-3m-15 7 14 2" fill="none" stroke="#625d5a" stroke-width="1.7" stroke-linecap="round"/>
  <path d="m474 319 15-10m-13 16 19-1" stroke="#aaa7a2" stroke-width="3" stroke-linecap="round"/>
  <!-- tiny sleep marks -->
  <path d="m493 304 9-11h-8m11 4 10-12h-9" fill="none" stroke="#8d806c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
