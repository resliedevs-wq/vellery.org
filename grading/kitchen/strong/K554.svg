<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Kitchen table with three apples, a MONDAY mug, and a cat asleep on a newspaper</title>

  <!-- Wall and floor -->
  <rect x="0" y="0" width="800" height="520" fill="#efe2c9"/>
  <rect x="0" y="508" width="800" height="12" fill="#dcc7a6"/>
  <rect x="0" y="520" width="800" height="80" fill="#d3b793"/>

  <!-- Table shadow on floor -->
  <ellipse cx="400" cy="540" rx="320" ry="12" fill="#b99c76" opacity="0.45"/>

  <!-- Window (left) -->
  <rect x="56" y="86" width="158" height="218" fill="#fdf3d0"/>
  <!-- Sunlight beam from window -->
  <polygon points="56,86 214,86 330,380 170,380" fill="#fff2b3" opacity="0.3"/>
  <!-- Window frame, mullions, sill -->
  <rect x="40" y="70" width="190" height="250" fill="none" stroke="#8c6a4f" stroke-width="16"/>
  <line x1="135" y1="86" x2="135" y2="304" stroke="#8c6a4f" stroke-width="8"/>
  <line x1="56" y1="195" x2="214" y2="195" stroke="#8c6a4f" stroke-width="8"/>
  <rect x="30" y="318" width="210" height="10" rx="2" fill="#a07a5c"/>

  <!-- Table legs -->
  <rect x="140" y="402" width="18" height="138" fill="#94603f"/>
  <rect x="622" y="402" width="18" height="138" fill="#94603f"/>

  <!-- Table top -->
  <rect x="110" y="380" width="600" height="16" fill="#bb7f55"/>
  <rect x="110" y="380" width="600" height="2" fill="#d9a477"/>
  <rect x="110" y="396" width="600" height="6" fill="#94603f"/>

  <!-- Sunlight patch on tabletop -->
  <polygon points="150,380 330,380 300,396 120,396" fill="#fff1b0" opacity="0.25"/>

  <!-- Three red apples -->
  <g transform="translate(186,362)">
    <path d="M0,-18 C14,-30 32,-22 30,2 C28,22 14,26 0,22 C-14,26 -28,22 -30,2 C-32,-22 -14,-30 0,-18 Z" fill="#c8372d"/>
    <ellipse cx="16" cy="6" rx="10" ry="14" fill="#8f1f1b" opacity="0.15"/>
    <ellipse cx="-13" cy="-2" rx="6" ry="10" fill="#ffffff" opacity="0.25"/>
    <path d="M0,-18 Q2,-26 6,-32" fill="none" stroke="#5b3a22" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(250,362)">
    <path d="M0,-18 C14,-30 32,-22 30,2 C28,22 14,26 0,22 C-14,26 -28,22 -30,2 C-32,-22 -14,-30 0,-18 Z" fill="#c8372d"/>
    <ellipse cx="16" cy="6" rx="10" ry="14" fill="#8f1f1b" opacity="0.15"/>
    <ellipse cx="-13" cy="-2" rx="6" ry="10" fill="#ffffff" opacity="0.25"/>
    <path d="M0,-18 Q2,-26 6,-32" fill="none" stroke="#5b3a22" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6,-30 Q18,-44 32,-34 Q18,-22 6,-30 Z" fill="#6f9440"/>
  </g>
  <g transform="translate(314,362)">
    <path d="M0,-18 C14,-30 32,-22 30,2 C28,22 14,26 0,22 C-14,26 -28,22 -30,2 C-32,-22 -14,-30 0,-18 Z" fill="#c8372d"/>
    <ellipse cx="16" cy="6" rx="10" ry="14" fill="#8f1f1b" opacity="0.15"/>
    <ellipse cx="-13" cy="-2" rx="6" ry="10" fill="#ffffff" opacity="0.25"/>
    <path d="M0,-18 Q2,-26 6,-32" fill="none" stroke="#5b3a22" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Blue mug with MONDAY -->
  <path d="M398,316 L470,316 L470,368 Q470,383 455,383 L413,383 Q398,383 398,368 Z" fill="#3f6fa6"/>
  <path d="M470,330 H482 Q496,330 496,346 Q496,362 482,362 H470" fill="none" stroke="#3f6fa6" stroke-width="10"/>
  <ellipse cx="434" cy="316" rx="36" ry="6" fill="#5a86b8"/>
  <rect x="406" y="324" width="5" height="50" rx="2" fill="#ffffff" opacity="0.18"/>
  <text x="434" y="354" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#fdf6e3" text-anchor="middle" textLength="56" lengthAdjust="spacingAndGlyphs">MONDAY</text>

  <!-- Folded newspaper -->
  <rect x="520" y="372" width="180" height="8" fill="#e6dfcc"/>
  <rect x="514" y="376" width="182" height="8" fill="#f7f2e4" stroke="#b5a98f" stroke-width="1"/>
  <rect x="524" y="380" width="40" height="1.5" fill="#9d9480"/>
  <rect x="572" y="380" width="30" height="1.5" fill="#9d9480"/>
  <rect x="650" y="380" width="36" height="1.5" fill="#9d9480"/>

  <!-- Gray cat asleep on the newspaper -->
  <path d="M682,372 C702,362 716,372 706,384" fill="none" stroke="#8d9197" stroke-width="7" stroke-linecap="round"/>
  <path d="M572,376 C572,346 600,338 630,338 C662,338 684,350 686,376 Z" fill="#8d9197"/>
  <path d="M600,350 q4,8 2,14 M614,346 q4,8 2,14 M628,345 q4,8 2,14" fill="none" stroke="#686c72" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M564,346 L566,327 L579,338 Z" fill="#8d9197"/>
  <path d="M586,338 L595,327 L598,348 Z" fill="#8d9197"/>
  <circle cx="578" cy="355" r="19" fill="#8d9197"/>
  <path d="M570,354 q4,3 8,0 M580,354 q4,3 8,0" fill="none" stroke="#4a4d52" stroke-width="1.8" stroke-linecap="round"/>
  <ellipse cx="587" cy="363" rx="2.5" ry="2" fill="#b98a8a"/>
  <path d="M596,360 L610,358 M596,364 L610,366" stroke="#5f6369" stroke-width="1" opacity="0.6"/>
  <ellipse cx="600" cy="373" rx="10" ry="4" fill="#7b8086"/>
</svg>
