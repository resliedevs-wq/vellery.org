    <ellipse cx="699.5" cy="337" rx="31" ry="5" fill="#394a4a"/>
    <path d="M665 356h68v28h-68z" rx="3" fill="#e9dfc9"/>
    <text x="699" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2" fill="#486a70">MONDAY</text>
    <path d="M668 344v51" stroke="#8bb0b1" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- folded newspaper -->
  <g>
    <ellipse cx="882" cy="420" rx="96" ry="9" fill="#80543d" opacity=".2"/>
    <path d="M791 355 940 348l34 61-153 12Z" fill="#e3dccb" stroke="#a99f8d" stroke-width="3"/>
