    <path d="m875 380 35-3m-33 9 39-3m-38 9 31-2m67-21 24-2m-22 8 25-2m-23 8 25-2" stroke="#aaa294" stroke-width="3" stroke-linecap="round"/>
    <path d="m798 367 56-3 3 8-54 4m-2 7 59-4m-58 10 42-3" stroke="#aaa294" stroke-width="3" stroke-linecap="round"/>
    <path d="m842 374 13 40m19-61 9 63" stroke="#c3b9a8" stroke-width="2"/>
  </g>
