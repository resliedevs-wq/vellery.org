<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">A quiet kitchen morning</title>
  <desc id="desc">A flat vector illustration of a small kitchen table with three red apples, a blue mug labeled MONDAY, and a folded newspaper with a sleeping gray cat. Morning sunlight enters through a window on the left.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#f5e8ce"/><stop offset="1" stop-color="#e8d4b4"/></linearGradient>
    <linearGradient id="sunbeam" x2="1" y2=".25"><stop stop-color="#f8d889" stop-opacity=".52"/><stop offset="1" stop-color="#f8d889" stop-opacity="0"/></linearGradient>
    <linearGradient id="tabletop" x2="0" y2="1"><stop stop-color="#bd8056"/><stop offset="1" stop-color="#a86d4a"/></linearGradient>
  </defs>
  <!-- warm kitchen wall and morning window -->
  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="602" width="1200" height="198" fill="#d4bd9c"/>
  <path d="M0 0h1200v800H0z" fill="none" stroke="#ddc9aa" stroke-width="8"/>
  <path d="M254 142 760 142 947 474 254 474Z" fill="url(#sunbeam)"/>
  <g transform="translate(78 78)">
    <rect width="224" height="250" rx="5" fill="#927154"/>
    <rect x="13" y="13" width="198" height="224" fill="#b8d0c8"/>
    <rect x="23" y="23" width="178" height="204" fill="#d9e4d7"/>
