    <path d="M111 24v203M24 126h177" stroke="#927154" stroke-width="13"/>
    <path d="M31 31h73v87H31z" fill="#f7e4ad" opacity=".58"/>
  </g>
  <path d="M0 590h1200" stroke="#c9af8c" stroke-width="5"/>
  <!-- small table -->
  <ellipse cx="610" cy="657" rx="475" ry="39" fill="#87634a" opacity=".17"/>
  <path d="M230 470h760l-22 40H252Z" fill="#8a5c40"/>
  <path d="M214 424q0-16 18-16h756q18 0 18 16v52q0 12-15 12H229q-15 0-15-12Z" fill="url(#tabletop)"/>
  <path d="M244 435h730" stroke="#d09a6e" stroke-width="5" opacity=".58"/>
  <path d="M298 492h50l-27 239h-47zM858 492h50l26 239h-48z" fill="#80543d"/>
  <path d="M284 714h44M883 714h45" stroke="#6f4937" stroke-width="11" stroke-linecap="round"/>
  <!-- exactly three red apples -->
  <g>
    <ellipse cx="378" cy="420" rx="45" ry="8" fill="#80543d" opacity=".18"/>
    <path d="M378 352c-9-19-1-33 14-40" fill="none" stroke="#644b35" stroke-width="7" stroke-linecap="round"/>
    <path d="M382 326q19-17 35-7-10 19-34 17" fill="#75865b"/>
    <path d="M378 352c-15-14-43-7-48 20-8 36 12 64 48 64 37 0 57-28 49-64-6-27-35-34-49-20Z" fill="#b84c43"/>
    <path d="M348 374q7-17 20-18" fill="none" stroke="#d97a66" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="481" cy="421" rx="42" ry="7" fill="#80543d" opacity=".18"/>
    <path d="M480 353c-7-17-1-29 12-37" fill="none" stroke="#644b35" stroke-width="7" stroke-linecap="round"/>
    <path d="M484 326q17-15 31-6-9 17-30 16" fill="#75865b"/>
    <path d="M480 353c-14-13-40-6-45 19-7 33 12 59 45 59 34 0 52-26 45-59-5-25-32-32-45-19Z" fill="#c35449"/>
    <path d="M453 373q7-15 18-16" fill="none" stroke="#e28770" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <ellipse cx="568" cy="422" rx="38" ry="7" fill="#80543d" opacity=".18"/>
    <path d="M569 360c-6-15 0-27 11-34" fill="none" stroke="#644b35" stroke-width="6" stroke-linecap="round"/>
    <path d="M573 333q16-14 29-5-8 16-28 15" fill="#75865b"/>
    <path d="M569 360c-13-12-36-6-41 17-7 31 10 55 41 55s48-24 41-55c-5-23-28-29-41-17Z" fill="#ad443e"/>
    <path d="M544 378q6-14 16-15" fill="none" stroke="#d87968" stroke-width="5" stroke-linecap="round"/>
  </g>
