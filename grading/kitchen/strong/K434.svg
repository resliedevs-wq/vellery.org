    <path d="m879 345 5 4 5-4" fill="#c8877b"/>
    <path d="M870 349q14 10 27 0" fill="none" stroke="#68716f" stroke-width="2.5"/>
    <path d="M855 347 838 344m18 10-17 3m77-8 16-4m-17 10 16 4" fill="none" stroke="#646d6b" stroke-width="2"/>
    <path d="M884 374c-1 15 11 23 24 17 10-5 11-15 2-20" fill="none" stroke="#727a78" stroke-width="8"/>
    <path d="M861 333q8-7 15 0m18 0q8-7 15 0" fill="none" stroke="#a9aeaa" stroke-width="3" opacity=".7"/>
    <text x="941" y="310" font-family="Georgia, serif" font-size="24" fill="#8f958f">z</text>
    <text x="958" y="298" font-family="Georgia, serif" font-size="17" fill="#8f958f">z</text>
  </g>
</svg>
