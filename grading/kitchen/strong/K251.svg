  <path d="M865 468Q860 473 855 470M865 468Q871 474 876 470" fill="none" stroke="#535958" stroke-width="2" stroke-linecap="round"/>
  <path d="M847 465L822 460M847 470L821 472M882 465L906 460M882 470L906 473" stroke="#d5d4cb" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M832 428Q846 439 852 450M869 423Q867 437 872 445" fill="none" stroke="#aeb1aa" stroke-width="5" stroke-linecap="round" opacity=".65"/>
  <path d="M821 478Q833 488 849 482" fill="none" stroke="#666d6a" stroke-width="5" stroke-linecap="round"/>

  <!-- Blue Monday mug -->
  <ellipse cx="600" cy="548" rx="55" ry="9" fill="#684933" opacity=".24"/>
  <path d="M633 493Q678 489 673 525Q670 548 640 546" fill="none" stroke="#416577" stroke-width="12"/>
  <path d="M565 478Q565 470 574 470H635Q644 470 644 479L638 539Q637 549 627 551H582Q572 550 571 540Z" fill="url(#mug)"/>
  <ellipse cx="604.5" cy="478" rx="39.5" ry="9" fill="#7796a0"/>
  <ellipse cx="604.5" cy="478" rx="31" ry="5" fill="#4b5960"/>
  <path d="M577 486L581 534" stroke="#8eabb0" stroke-width="4" stroke-linecap="round" opacity=".52"/>
