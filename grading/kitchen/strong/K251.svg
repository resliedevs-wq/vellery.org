  <!-- Small accents of soft morning light -->
  <path d="M81 484H247" stroke="#e0bd83" stroke-width="3" opacity=".65"/>
  <path d="M110 492H211" stroke="#e0bd83" stroke-width="2" opacity=".45"/>
</svg>
