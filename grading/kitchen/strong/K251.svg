    <rect x="208" y="69" width="13" height="360" fill="#eadcc4"/>
    <rect x="62" y="250" width="319" height="14" fill="#eadcc4"/>
  </g>
  <rect x="46" y="49" width="350" height="19" rx="8" fill="#bd8c63"/>
  <rect x="46" y="425" width="350" height="22" rx="7" fill="#bd8c63"/>
  <path d="M30 450H414L385 468H59Z" fill="#d0a77b"/>
  <path d="M78 449V476M365 449V476" stroke="#a87350" stroke-width="7" stroke-linecap="round"/>
  <!-- Small sill plant -->
  <path d="M332 422Q317 390 335 371Q352 395 344 422M352 423Q351 386 378 377Q378 405 361 425" fill="#7d9270"/>
  <path d="M322 416H368L363 445Q345 454 328 444Z" fill="#c77d5d"/>
  <path d="M326 421H366" stroke="#e2a17d" stroke-width="5"/>

