<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A quiet kitchen morning</title>
  <desc id="desc">A warm, muted flat vector illustration of a kitchen table with three red apples, a blue mug labeled MONDAY, and a folded newspaper with a sleeping gray cat on top. Sunlight enters through a window on the left.</desc>
  <defs>
    <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#eee0c8"/><stop offset="1" stop-color="#e4d1b2"/></linearGradient>
    <linearGradient id="sunbeam" x2="1" y2=".35"><stop stop-color="#f8df9e" stop-opacity=".56"/><stop offset="1" stop-color="#f8df9e" stop-opacity="0"/></linearGradient>
    <linearGradient id="tabletop" x2="0" y2="1"><stop stop-color="#b77b4f"/><stop offset="1" stop-color="#98623f"/></linearGradient>
    <linearGradient id="mug" x2="0" y2="1"><stop stop-color="#698b9b"/><stop offset="1" stop-color="#456b7c"/></linearGradient>
    <filter id="softShadow" x="-.2" y="-.3" width="1.4" height="1.7"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="windowClip"><rect x="66" y="71" width="310" height="343" rx="5"/></clipPath>
  </defs>

  <!-- Quiet, sunlit kitchen wall -->
  <rect width="1200" height="900" fill="url(#wall)"/>
