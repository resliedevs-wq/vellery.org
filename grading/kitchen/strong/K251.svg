  <path d="M0 666H1200M0 800H1200" stroke="#eadcc5" stroke-width="2" opacity=".8"/>

  <!-- Left window and broad morning beams -->
  <path d="M360 125L1010 610H660L360 374Z" fill="url(#sunbeam)"/>
  <rect x="47" y="52" width="348" height="383" rx="10" fill="#a77450"/>
  <rect x="58" y="63" width="326" height="361" rx="6" fill="#f2e5cf"/>
  <g clip-path="url(#windowClip)">
    <rect x="66" y="71" width="310" height="343" fill="#bed1ca"/>
    <rect x="66" y="71" width="310" height="188" fill="#b9d0d2"/>
    <circle cx="297" cy="128" r="40" fill="#e8c982"/>
    <path d="M56 293Q117 235 184 289Q240 226 399 282V427H56Z" fill="#8fa48b"/>
